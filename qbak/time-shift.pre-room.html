<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Time Shift - RMD Instructor Weekend</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#1A2233; --mut:#6B7C93; --line:#E3E8EF; --bg:#F5F7FA; --card:#fff;
  --pur:#44247C; --pur2:#2E1856; --purtint:#EFEAF8; --blu:#0067A4; --org:#F49001;
  --ok:#1E8449; --okbg:#E3F3E8; --bad:#B3261E; --badbg:#FCE8E6; --warn:#8A5200; --warnbg:#FFF1D6;
  --font:'Inter','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{background:var(--pur);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex:0 0 auto;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px}
.top .grow{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px;opacity:.85}
.seg button.on{background:#fff;color:var(--pur);opacity:1}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}
.tbtn:hover{background:rgba(255,255,255,.26)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr}
.side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:16px}
.pane{overflow-y:auto;padding:16px 20px 120px}
.h{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.step{background:var(--bg);border-radius:14px;padding:14px}
.step .q{font-weight:800;font-size:15px;margin-bottom:10px}
.selname{background:#fff;border:2px solid var(--pur);border-radius:12px;padding:10px 12px}
.selname b{display:block;font-size:16px}
.selname small{color:var(--mut)}
.modes{display:flex;gap:6px;margin-bottom:12px}
.modes button{flex:1;padding:10px 6px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink);line-height:1.2}
.modes button.on{border-color:var(--pur);background:var(--purtint);color:var(--pur)}
.big-time{width:100%;font-size:34px;font-weight:800;text-align:center;padding:10px;border:2px solid var(--line);border-radius:14px;background:#fff;font-variant-numeric:tabular-nums}
.big-time:focus{outline:none;border-color:var(--pur)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;margin-top:10px}
.quick button{padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--pur);min-height:46px}
.quick button:hover{border-color:var(--pur)}
.quick button.now{color:var(--ink)}
.delta-row{display:flex;align-items:center;gap:10px}
.delta-row .num{flex:1;text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.delta-row button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;font-weight:800;color:var(--pur)}
.radio{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--pur);background:var(--purtint)}
.radio input{margin-top:4px;width:18px;height:18px;accent-color:var(--pur)}
.radio b{display:block;font-size:14px}
.radio small{color:var(--mut);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.sub{margin:6px 0 0 28px}
.sub select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.sub label{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px;font-weight:600}
.sub input[type=checkbox]{width:17px;height:17px;accent-color:var(--pur)}

.sumstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px}
.tile .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.tile.warn .n{color:var(--bad)}
.msg{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.msg.err{background:var(--badbg);color:var(--bad)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.info{background:var(--purtint);color:var(--pur)}

.sched{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:62px 118px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid #F0F3F8;cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:hover{background:#FAFAFE}
.row.sel{background:var(--purtint);box-shadow:inset 5px 0 0 var(--pur)}
.row.past{opacity:.5}
.row.live{box-shadow:inset 5px 0 0 var(--ok)}
.row.sel.live{box-shadow:inset 5px 0 0 var(--pur)}
.row .orig{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;font-size:14px}
.row .orig.moved{text-decoration:line-through}
.row .nw{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;line-height:1.15}
.row .nw small{display:block;font-weight:600;font-size:12px;color:var(--mut)}
.row.chg .nw{color:var(--pur)}
.row .ttl b{display:block;font-size:15px}
.row .ttl small{color:var(--mut);font-size:12.5px}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.pill.fix{background:var(--ink);color:#fff}
.pill.brk{background:#EEF1F6;color:var(--mut)}
.pill.sq{background:var(--warnbg);color:var(--warn)}
.pill.lnk{background:var(--purtint);color:var(--pur)}
.pill.now{background:var(--ok);color:#fff}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;text-align:center;min-width:64px}
.chip.late{background:#FBE3D6;color:#B7410E}
.chip.early{background:#D8F0E2;color:var(--ok)}
.chip.on{background:#EEF1F6;color:var(--mut)}
.chip.same{background:transparent;color:var(--mut);font-weight:600}
.row.over{background:var(--badbg)}
.row .warn{color:var(--bad);font-weight:700;font-size:12px;display:block}

.bar{position:fixed;left:400px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding:12px 20px;display:flex;gap:12px;align-items:center;z-index:10}
.bar .txt{flex:1;font-weight:600;font-size:14px;min-width:0}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;color:var(--ink)}
.btn.pri{background:var(--pur);border-color:var(--pur);color:#fff;padding:14px 26px;font-size:16px}
.btn.pri:disabled{opacity:.4;cursor:default}
.btn:disabled{opacity:.5;cursor:default}
.log{font-size:13px;color:var(--mut);margin-top:18px}
.log h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.log div{padding:5px 0;border-bottom:1px solid var(--line)}
.gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.gate div{background:#fff;border-radius:16px;padding:30px;max-width:420px;box-shadow:0 8px 40px rgba(68,36,124,.16)}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .main{display:block}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .pane{padding:12px 12px 130px;overflow:visible}
  .bar{left:0;padding:10px 12px;flex-wrap:wrap}
  .row{grid-template-columns:52px 96px minmax(0,1fr);}
  .row .chg{display:none}
  .btn.pri{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate"><div>Loading...</div></div>

<div class="app hidden" id="app">
  <div class="top">
    <h1>Time Shift</h1>
    <div class="seg" id="dayTabs" role="tablist" aria-label="Day"></div>
    <div class="seg" id="streamTabs" role="tablist" aria-label="Programme"></div>
    <div class="grow"></div>
    <span class="clock" id="clock">--:--</span>
    <button class="tbtn" id="fsBtn" type="button">Full screen</button>
    <a class="tbtn" href="timetable.html">Back to timetable</a>
  </div>

  <div class="main">
    <aside class="side">
      <div>
        <div class="h">1. Which session?</div>
        <div class="selname" id="selName"></div>
        <div class="hint">Tap any session on the right to change it.</div>
      </div>

      <div class="step">
        <div class="q">2. What happened?</div>
        <div class="modes" id="modes">
          <button type="button" data-mode="end">It finished at...</button>
          <button type="button" data-mode="start">It starts at...</button>
          <button type="button" data-mode="delta">Late or early by...</button>
        </div>
        <div id="modeBody"></div>
      </div>

      <div class="step">
        <div class="q">3. What about the sessions after it?</div>
        <label class="radio" id="ruleAll"><input type="radio" name="rule" value="all"><span><b>Everything after moves</b><small>Every later session moves by the same amount, to the end of the day. Breaks and lunch keep their length.</small></span></label>
        <label class="radio" id="ruleFixed"><input type="radio" name="rule" value="fixed"><span><b>Catch up by the next fixed point</b><small>Later sessions move, but the fixed point below stays put. Breaks in between get shorter to absorb the delay.</small>
          <div class="sub" id="fixedSub">
            <select id="fixedSel" aria-label="Fixed point"></select>
            <label><input type="checkbox" id="squeeze" checked> Shorten breaks to catch up (never below <select id="minBreak" style="width:auto;padding:3px 6px;font-size:14px"><option value="5">5</option><option value="10">10</option></select> min)</label>
            <div class="hint" id="squeezeNote" style="margin-top:4px">Only a Course Director can shorten breaks.</div>
          </div></span></label>
      </div>
    </aside>

    <section class="pane" id="pane">
      <div class="sumstrip" id="sum"></div>
      <div id="msgs"></div>
      <div class="sched" id="sched"></div>
      <div class="log" id="logWrap"><h3>Recent changes</h3><div id="log">Loading...</div></div>
    </section>
  </div>

  <div class="bar" id="bar">
    <div class="txt" id="barTxt">Pick a session and say what happened. Nothing changes until you press Apply.</div>
    <button class="btn" id="discard" type="button">Clear</button>
    <button class="btn pri" id="apply" type="button" disabled>Apply to everyone</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/programme-data.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   Time Shift portal (new page, 2026-10-11)
   Changes live times only by calling the existing shiftProgrammeSession
   Cloud Function, the same audited path the timetable panel uses. This page
   works out the exact set of calls that produces the result you typed, then
   re-simulates the function's own algorithm to prove the calls land where the
   preview says before anything is sent.

   Reading the "length" of a session: the programme only stores START times.
   A session planned to run straight into the next one ends when the next one
   starts (see sessionEndMins in js/programme-data.js), so moving the next
   session earlier or later is what makes a session finish early or late, and
   it is also how a break gets shorter.
   ===================================================================== */

var DAYS = ['friday', 'saturday', 'sunday'];
var MAX_SHIFT = 240;                 // MAX_SHIFT_MINUTES in functions/index.js
var STATIC = JSON.parse(JSON.stringify(PROGRAMME));
var ORIG = {}, ORIG_DUR = {};
DAYS.forEach(function (d) { (STATIC[d].sessions || []).forEach(function (s) { ORIG[s.id] = toMin(s.start); ORIG_DUR[s.id] = s.duration; }); });

var role = null, fns = null;
var st = { day: 'saturday', stream: 'instructor', anchor: null, mode: 'end', time: '', delta: 0, rule: 'all', fixedId: '', squeeze: true, minBreak: 5, busy: false, result: '' };

function toMin(t) { var p = String(t).split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function fmt(n) { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function streamOf(s) { return (s.tags || []).indexOf('assessor-stream') >= 0 ? 'assessor' : 'instructor'; }
function sessions(day) { return PROGRAMME[day].sessions; }
function byId(day, id) { return sessions(day).filter(function (s) { return s.id === id; })[0] || null; }
function liveState(day) { var m = {}; sessions(day).forEach(function (s) { m[s.id] = toMin(s.start); }); return m; }
function sortedStream(day, state, stream) {
  return sessions(day).filter(function (s) { return streamOf(s) === stream; })
    .sort(function (a, b) { return (state[a.id] - state[b.id]) || ((a.order || 0) - (b.order || 0)); });
}
function isBreak(s) { return (s.tags || []).indexOf('break') >= 0 || /^(break|coffee|lunch|tea)/i.test(s.title || ''); }
function isLunch(s) { return /^lunch/i.test(s.title || ''); }

/* End of a session under a given set of start times: back-to-back sessions
   (planned end == next planned start, same stream, overlapping roles) end when
   the next one starts; everything else is start + duration. */
function endOf(day, s, state, durMap) {
  var plain = state[s.id] + (durMap && durMap[s.id] != null ? durMap[s.id] : s.duration);
  if (ORIG[s.id] == null) return plain;
  var origEnd = ORIG[s.id] + s.duration, mine = streamOf(s), myRoles = s.roles || [], best = null;
  sessions(day).forEach(function (n) {
    if (n.id === s.id || streamOf(n) !== mine || ORIG[n.id] == null || ORIG[n.id] !== origEnd) return;
    if (!(n.roles || []).some(function (r) { return myRoles.indexOf(r) >= 0; })) return;
    if (state[n.id] <= state[s.id]) return;
    if (best === null || state[n.id] < best) best = state[n.id];
  });
  return best === null ? plain : best;
}
/* Is this session planned to run straight into another? (so its length follows that session) */
function runsIntoNext(day, s) {
  if (ORIG[s.id] == null) return false;
  var origEnd = ORIG[s.id] + s.duration, mine = streamOf(s), myRoles = s.roles || [];
  return sessions(day).some(function (n) {
    return n.id !== s.id && streamOf(n) === mine && ORIG[n.id] === origEnd && (n.roles || []).some(function (r) { return myRoles.indexOf(r) >= 0; });
  });
}

/* Mirror of the Cloud Function: the anchor and every later session in its stream
   that day move by delta, plus each one's pairWith twin. */
function applyCall(day, state, id, delta) {
  var all = sessions(day), anchor = byId(day, id);
  if (!anchor) return { error: 'Session not found.' };
  if (!isFinite(delta) || delta === 0 || Math.floor(delta) !== delta) return { error: 'Nothing to move.' };
  if (Math.abs(delta) > MAX_SHIFT) return { error: 'A single update can move at most ' + MAX_SHIFT + ' minutes.' };
  var list = sortedStream(day, state, streamOf(anchor)), idx = list.findIndex(function (s) { return s.id === id; });
  var writes = {};
  list.slice(idx).forEach(function (s) {
    writes[s.id] = 1;
    if (s.pairWith && all.some(function (x) { return x.id === s.pairWith; })) writes[s.pairWith] = 1;
  });
  var next = Object.assign({}, state);
  for (var wid in writes) {
    var n = state[wid] + delta;
    if (n < 0 || n >= 1440) { var t = byId(day, wid); return { error: 'That would push "' + (t ? t.title : wid) + '" outside the day.' }; }
    next[wid] = n;
  }
  return { state: next };
}

/* ------------------------------------------------------------------
   Plan: turn "what happened" + the rule into target start times, then
   into the smallest list of function calls that reaches them.
   ------------------------------------------------------------------ */
function makePlan() {
  var day = st.day, live = liveState(day);
  var out = { target: Object.assign({}, live), calls: [], squeezed: {}, durNew: {}, notes: [], error: '', ready: false, fixedLabel: '' };
  var a = st.anchor ? byId(day, st.anchor) : null;
  if (!a || streamOf(a) !== st.stream) return out;

  var anchorDelta = 0, downDelta = 0;
  if (st.mode === 'start') {
    if (!st.time) return out;
    anchorDelta = toMin(st.time) - live[a.id]; downDelta = anchorDelta;
  } else if (st.mode === 'delta') {
    anchorDelta = st.delta; downDelta = st.delta;
  } else {
    if (!st.time) return out;
    var curEnd = endOf(day, a, live);
    downDelta = toMin(st.time) - curEnd; anchorDelta = 0;
    if (!runsIntoNext(day, a)) out.notes.push('"' + a.title + '" has a gap planned after it, so only the sessions after it move; its own end stays as programmed.');
  }
  if (anchorDelta === 0 && downDelta === 0) { out.ready = false; out.same = true; return out; }

  var list = sortedStream(day, live, st.stream), idx = list.findIndex(function (s) { return s.id === a.id; });
  var rest = list.slice(idx + 1);
  var delta = {};            // id -> minutes
  delta[a.id] = anchorDelta;

  if (st.rule === 'all' || downDelta <= 0 && st.rule !== 'fixed') {
    rest.forEach(function (s) { delta[s.id] = downDelta; });
  } else {
    var fIdx = st.fixedId ? rest.findIndex(function (s) { return s.id === st.fixedId; }) : -1;
    var before = fIdx >= 0 ? rest.slice(0, fIdx) : rest;       // fixedId '' = end of day
    var at = fIdx >= 0 ? rest.slice(fIdx) : [];
    out.fixedLabel = fIdx >= 0 ? at[0].title : 'End of day';
    var remaining = Math.max(downDelta, 0), taken = 0;
    before.forEach(function (s, i) {
      delta[s.id] = downDelta - taken;
      if (downDelta > 0 && st.squeeze && role === 'director' && isBreak(s) && !isLunch(s) && remaining > 0) {
        var len = endOf(day, s, live) - live[s.id];
        var take = Math.min(Math.max(0, len - st.minBreak), remaining);
        if (take > 0) {
          taken += take; remaining -= take;
          out.squeezed[s.id] = { from: len, to: len - take };
          if (!runsIntoNext(day, s)) {
            out.durNew[s.id] = s.duration - take;
            if (s.pairWith && byId(day, s.pairWith)) out.durNew[s.pairWith] = byId(day, s.pairWith).duration - take;
          }
        }
      }
    });
    var after = downDelta - taken;      // what the fixed point itself has to move by (0 if fully absorbed)
    at.forEach(function (s) { delta[s.id] = downDelta > 0 ? after : 0; });
    if (downDelta > 0 && after > 0) {
      out.notes.push(fIdx >= 0
        ? '"' + at[0].title + '" still has to start ' + after + ' min late: the breaks before it can not absorb all ' + downDelta + ' min.'
        : 'The day finishes ' + after + ' min late: the breaks can not absorb all ' + downDelta + ' min.');
    }
  }

  // twins move with their partner, by the same amount
  var all = sessions(day);
  Object.keys(delta).forEach(function (id) {
    var s = byId(day, id);
    if (s && s.pairWith && all.some(function (x) { return x.id === s.pairWith; })) {
      if (delta[s.pairWith] == null) delta[s.pairWith] = delta[id];
    }
  });

  // targets
  Object.keys(delta).forEach(function (id) { out.target[id] = live[id] + delta[id]; });
  for (var id in out.target) { if (out.target[id] < 0 || out.target[id] >= 1440) { out.error = 'That would push a session outside the day.'; return out; } }

  // order guard: nothing may start before a session that precedes it in the original programme
  var ordered = sortedStream(day, out.target, st.stream);
  var origOrder = sessions(day).filter(function (s) { return streamOf(s) === st.stream; })
    .sort(function (x, y) { return (ORIG[x.id] - ORIG[y.id]) || ((x.order || 0) - (y.order || 0)); });
  for (var i = 0; i < origOrder.length - 1; i++) {
    var p = origOrder[i], q = origOrder[i + 1];
    if (ORIG[p.id] < ORIG[q.id] && out.target[q.id] < out.target[p.id]) {
      out.error = '"' + q.title + '" would start before "' + p.title + '", which comes first. Choose a smaller change.'; return out;
    }
  }

  // calls: walk the stream in current time order; each time the wanted delta
  // changes, one call (anchor + everything after it) fixes the difference
  var running = 0, state = Object.assign({}, live), calls = [];
  for (var k = 0; k < list.length; k++) {
    var s2 = list[k], want = delta[s2.id] || 0, need = want - running;
    if (need !== 0) {
      if (Math.abs(need) > MAX_SHIFT) { out.error = 'One of the updates would be more than ' + MAX_SHIFT + ' minutes. Do it in two steps.'; return out; }
      var r = applyCall(day, state, s2.id, need);
      if (r.error) { out.error = r.error; return out; }
      state = r.state; calls.push({ sessionId: s2.id, deltaMinutes: need }); running = want;
    }
  }
  // verify the calls really land on the targets for this programme, and that shared twins match
  var bad = list.some(function (s3) { return state[s3.id] !== out.target[s3.id]; });
  Object.keys(delta).forEach(function (id) { if (state[id] !== out.target[id]) bad = true; });
  if (bad) { out.error = 'Could not build a safe set of updates for that. Try "Everything after moves", or a smaller change.'; return out; }
  out.calls = calls; out.ready = calls.length > 0; out.simState = state;
  return out;
}

/* ------------------------------------------------------------------ rendering */
var plan = null;

function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function todayDay() {
  var now = new Date();
  return DAYS.filter(function (d) {
    var m = String(PROGRAMME[d].date || '').match(/(\d+)\s+(\w+)\s+(\d{4})/);
    if (!m) return false;
    var dt = new Date(m[1] + ' ' + m[2] + ' ' + m[3]);
    return dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth() && dt.getDate() === now.getDate();
  })[0] || null;
}
function currentSession(day) {
  if (todayDay() !== day) return null;
  var live = liveState(day), n = nowMin(), list = sortedStream(day, live, st.stream), found = null;
  list.forEach(function (s) { if (live[s.id] <= n && n < endOf(day, s, live)) found = s; });
  return found;
}
function defaultAnchor() {
  var day = st.day, live = liveState(day), list = sortedStream(day, live, st.stream);
  var c = currentSession(day);
  if (c) return c.id;
  if (todayDay() === day) { var n = nowMin(), nx = list.filter(function (s) { return live[s.id] > n; })[0]; if (nx) return nx.id; }
  return list.length ? list[0].id : null;
}
function setAnchor(id) {
  st.anchor = id; st.delta = 0;
  var s = byId(st.day, id), live = liveState(st.day);
  if (s) {
    st.time = (st.mode === 'start') ? fmt(live[id]) : fmt(todayDay() === st.day && currentSession(st.day) && currentSession(st.day).id === id ? nowMin() : endOf(st.day, s, live));
  }
  st.result = '';
  defaultFixed();
  renderAll();
}
function defaultFixed() {
  var day = st.day, live = liveState(day), list = sortedStream(day, live, st.stream);
  var idx = list.findIndex(function (s) { return s.id === st.anchor; });
  var rest = idx >= 0 ? list.slice(idx + 1) : [];
  var lunch = rest.filter(isLunch)[0];
  st.fixedId = lunch ? lunch.id : '';
}

function renderTabs() {
  $('dayTabs').innerHTML = DAYS.map(function (d) { return '<button type="button" data-day="' + d + '" class="' + (d === st.day ? 'on' : '') + '">' + esc(PROGRAMME[d].label.split(' ')[0]) + '</button>'; }).join('');
  var sb = [['instructor', 'Instructor candidates'], ['assessor', 'Assessors']].filter(function (x) { return role !== 'assessor-faculty' || x[0] === 'assessor'; });
  $('streamTabs').innerHTML = sb.map(function (x) { return '<button type="button" data-stream="' + x[0] + '" class="' + (x[0] === st.stream ? 'on' : '') + '">' + x[1] + '</button>'; }).join('');
}

function renderControls() {
  var day = st.day, live = liveState(day), s = st.anchor ? byId(day, st.anchor) : null;
  $('selName').innerHTML = s ? '<b>' + esc(s.title) + '</b><small>Now ' + fmt(live[s.id]) + ' to ' + fmt(endOf(day, s, live)) + (s.location ? ' · ' + esc(s.location) : '') + '</small>' : '<b>None chosen</b>';
  Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === st.mode); });
  var body = $('modeBody');
  var hasInput = body.getAttribute('data-for') === st.mode;
  if (!hasInput) {
    body.setAttribute('data-for', st.mode);
    if (st.mode === 'delta') {
      body.innerHTML = '<div class="delta-row"><button type="button" id="dMinus" aria-label="One minute earlier">-</button><div class="num" id="dNum"></div><button type="button" id="dPlus" aria-label="One minute later">+</button></div>' +
        '<div class="quick"><button type="button" data-d="-15">-15</button><button type="button" data-d="-10">-10</button><button type="button" data-d="-5">-5</button><button type="button" data-d="5">+5</button><button type="button" data-d="10">+10</button><button type="button" data-d="15">+15</button></div>' +
        '<div class="hint">Plus means the session and everything it moves run later. Minus means earlier.</div>';
    } else {
      var lbl = st.mode === 'end' ? 'Type the time it actually finished (or will finish)' : 'Type the time it should start';
      body.innerHTML = '<input class="big-time" id="timeIn" type="time" step="60" aria-label="' + lbl + '">' +
        '<div class="quick"><button type="button" class="now" id="nowBtn">Now</button><button type="button" data-t="-5">-5</button><button type="button" data-t="5">+5</button><button type="button" data-t="10">+10</button></div>' +
        '<div class="hint">' + lbl + '. ' + (st.mode === 'end' ? 'Ran short? Type an earlier time and the sessions after it come forward.' : 'Everything after it follows.') + '</div>';
    }
  }
  if (st.mode === 'delta') $('dNum').textContent = (st.delta > 0 ? '+' : '') + st.delta + ' min';
  else { var ti = $('timeIn'); if (ti && document.activeElement !== ti) ti.value = st.time || ''; }
  $('ruleAll').classList.toggle('on', st.rule === 'all'); $('ruleFixed').classList.toggle('on', st.rule === 'fixed');
  document.querySelector('input[name=rule][value=all]').checked = st.rule === 'all';
  document.querySelector('input[name=rule][value=fixed]').checked = st.rule === 'fixed';
  $('fixedSub').style.display = st.rule === 'fixed' ? '' : 'none';
  // fixed options: sessions after the anchor + end of day
  var live2 = liveState(day), list = sortedStream(day, live2, st.stream), idx = list.findIndex(function (x) { return x.id === st.anchor; });
  var rest = idx >= 0 ? list.slice(idx + 1) : [];
  $('fixedSel').innerHTML = rest.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === st.fixedId ? ' selected' : '') + '>' + esc(x.title) + ' (' + fmt(live2[x.id]) + ')</option>'; }).join('') +
    '<option value=""' + (st.fixedId === '' ? ' selected' : '') + '>End of the day (finish time stays)</option>';
  $('squeeze').checked = st.squeeze && role === 'director'; $('squeeze').disabled = role !== 'director';
  $('squeezeNote').style.display = role === 'director' ? 'none' : '';
  $('minBreak').value = String(st.minBreak);
}

function renderSchedule() {
  plan = makePlan();
  var day = st.day, live = liveState(day), tgt = plan.target;
  var list = sortedStream(day, live, st.stream);
  var n = nowMin(), isToday = todayDay() === day, cur = currentSession(day);
  var moving = 0, origEndMax = 0, newEndMax = 0, squeezedMin = 0, linked = 0;
  var html = list.map(function (s) {
    var o = ORIG[s.id] != null ? ORIG[s.id] : live[s.id];
    var from = live[s.id], to = tgt[s.id], d = to - from, od = to - o;
    var endNow = endOf(day, s, live), endNew = endOf(day, s, tgt, plan.durNew);
    if (d !== 0) moving++;
    if (s.pairWith && d !== 0) linked++;
    origEndMax = Math.max(origEndMax, endOf(day, s, live)); newEndMax = Math.max(newEndMax, endNew);
    var sq = plan.squeezed[s.id];
    if (sq) squeezedMin += sq.from - sq.to;
    var isFixed = st.rule === 'fixed' && st.fixedId && s.id === st.fixedId && plan.ready;
    var over = false;
    var past = isToday && endNow <= n;
    var chip = d === 0 ? '<span class="chip same">no change</span>' : '<span class="chip ' + (d > 0 ? 'late' : 'early') + '">' + (d > 0 ? '+' : '') + d + ' min</span>';
    var lenNew = endNew - to, lenNow = endNow - from;
    var small = fmt(to) + ' to ' + fmt(endNew);
    return '<div class="row' + (s.id === st.anchor ? ' sel' : '') + (d !== 0 ? ' chg' : '') + (cur && cur.id === s.id ? ' live' : '') + (past ? ' past' : '') + '" data-id="' + esc(s.id) + '" tabindex="0" role="button">' +
      '<div class="orig' + (od !== 0 && d === 0 ? ' moved' : '') + '" title="Original time in the programme">' + fmt(o) + '</div>' +
      '<div class="nw">' + fmt(to) + '<small>' + (d !== 0 ? 'was ' + fmt(from) + ' · ' : '') + 'to ' + fmt(endNew) + '</small></div>' +
      '<div class="ttl"><b>' + esc(s.title) + (cur && cur.id === s.id ? '<span class="pill now">NOW</span>' : '') + (isFixed ? '<span class="pill fix">FIXED</span>' : '') +
      (isBreak(s) ? '<span class="pill brk">break ' + lenNew + ' min</span>' : '') + (sq ? '<span class="pill sq">shortened ' + sq.from + ' to ' + sq.to + ' min</span>' : '') +
      (s.pairWith ? '<span class="pill lnk" title="Shared with the other programme, moves with it">linked</span>' : '') + '</b>' +
      '<small>' + esc(s.location || '') + '</small></div>' +
      '<div class="chg">' + chip + '</div></div>';
  }).join('');
  $('sched').innerHTML = html || '<div style="padding:24px;color:var(--mut)">No sessions in this programme on this day.</div>';

  var finish = newEndMax;
  $('sum').innerHTML =
    '<div class="tile"><div class="n">' + (list.length ? fmt(finish) : '-') + '</div><div class="l">Programme finishes' + (finish !== origEndMax && list.length ? ' (was ' + fmt(origEndMax) + ')' : '') + '</div></div>' +
    '<div class="tile"><div class="n">' + moving + '</div><div class="l">Sessions that move' + (linked ? ' (' + linked + ' linked to the other programme)' : '') + '</div></div>' +
    (squeezedMin ? '<div class="tile"><div class="n">' + squeezedMin + ' min</div><div class="l">Taken out of breaks</div></div>' : '') +
    '<div class="tile"><div class="n">' + plan.calls.length + '</div><div class="l">Update' + (plan.calls.length === 1 ? '' : 's') + ' to send</div></div>';

  var msgs = '';
  if (st.result) msgs += st.result;
  if (plan.error) msgs += '<div class="msg err">' + esc(plan.error) + '</div>';
  plan.notes.forEach(function (t) { msgs += '<div class="msg warn">' + esc(t) + '</div>'; });
  if (plan.same && !st.result) msgs += '<div class="msg info">That is the same time as now, so nothing would change.</div>';
  $('msgs').innerHTML = msgs;

  var a = st.anchor ? byId(day, st.anchor) : null;
  var bar = $('barTxt'), ap = $('apply');
  if (plan.ready && !plan.error && a) {
    bar.textContent = moving + ' session' + (moving === 1 ? '' : 's') + ' will move. The programme will finish at ' + fmt(finish) + '. Shown to everyone straight away.';
  } else bar.textContent = 'Pick a session and say what happened. Nothing changes until you press Apply.';
  ap.disabled = !(plan.ready && !plan.error) || st.busy;
  $('discard').disabled = st.busy;
}

function renderAll() { renderTabs(); renderControls(); renderSchedule(); }

/* ------------------------------------------------------------------ apply */
async function applyPlan() {
  if (!plan || !plan.ready || plan.error || st.busy) return;
  st.busy = true; var calls = plan.calls.slice(), done = 0, planNow = plan;
  $('apply').disabled = true;
  try {
    var fn = fns.httpsCallable('shiftProgrammeSession');
    for (var i = 0; i < calls.length; i++) {
      $('barTxt').textContent = 'Sending update ' + (i + 1) + ' of ' + calls.length + '...';
      await fn(calls[i]); done++;
    }
    var durIds = Object.keys(planNow.durNew || {});
    if (durIds.length) {
      $('barTxt').textContent = 'Shortening ' + (durIds.length > 1 ? 'breaks' : 'the break') + '...';
      var batch = db.batch();
      durIds.forEach(function (id) { batch.update(db.collection(COLLECTIONS.sessions).doc(id), { duration: planNow.durNew[id] }); });
      await batch.commit();
    }
    st.result = '<div class="msg ok">Done. The programme has been updated for everyone.</div>';
    st.time = ''; st.delta = 0;
  } catch (err) {
    console.error('shiftProgrammeSession failed:', err);
    st.result = '<div class="msg err">Stopped after ' + done + ' of ' + calls.length + ' updates: ' + esc((err && (err.message || err.code)) || 'unknown error') + '. The list shows the times that are live now. Check it, then try again.</div>';
  }
  st.busy = false;
  loadLog();
  setTimeout(function () { st.anchor && setAnchorKeep(); renderAll(); }, 400);
}
function setAnchorKeep() { var s = byId(st.day, st.anchor), live = liveState(st.day); if (s && st.mode !== 'delta') st.time = fmt(st.mode === 'start' ? live[s.id] : endOf(st.day, s, live)); }

async function loadLog() {
  var wrap = $('logWrap'), el = $('log');
  if (role !== 'director') { wrap.style.display = 'none'; return; }
  try {
    var snap = await db.collection('programme_shift_log').orderBy('appliedAt', 'desc').limit(8).get();
    if (snap.empty) { el.textContent = 'No changes recorded yet.'; return; }
    el.innerHTML = snap.docs.map(function (doc) {
      var e = doc.data(), dt = e.appliedAt && e.appliedAt.toDate ? e.appliedAt.toDate() : null;
      var when = dt ? dt.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + fmt(dt.getHours() * 60 + dt.getMinutes()) : '';
      var sess = (PROGRAMME[e.day] ? PROGRAMME[e.day].sessions : []).filter(function (s) { return s.id === e.anchorSessionId; })[0];
      var d = e.deltaMinutes || 0;
      return '<div>' + esc(when) + ' · <b>' + esc(String(e.appliedByEmail || '').split('@')[0]) + '</b> moved ' + esc(sess ? sess.title : e.anchorSessionId) + (e.stream === 'assessor' ? ' (assessor)' : '') + ' ' + Math.abs(d) + ' min ' + (d > 0 ? 'later' : 'earlier') + ' · ' + ((e.affected || []).length) + ' session(s)</div>';
    }).join('');
  } catch (e) { el.textContent = 'The change log could not be loaded.'; }
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', function (e) {
  var t = e.target, b = t.closest ? t.closest('button') : null, row = t.closest ? t.closest('.row') : null;
  if (row && row.getAttribute('data-id')) { setAnchor(row.getAttribute('data-id')); return; }
  if (!b) return;
  if (b.getAttribute('data-day')) {
    if (st.busy) return;
    st.day = b.getAttribute('data-day'); st.anchor = defaultAnchor(); st.result = ''; setAnchor(st.anchor); return;
  }
  if (b.getAttribute('data-stream')) { st.stream = b.getAttribute('data-stream'); st.anchor = defaultAnchor(); setAnchor(st.anchor); return; }
  if (b.getAttribute('data-mode')) {
    st.mode = b.getAttribute('data-mode'); $('modeBody').removeAttribute('data-for');
    var s = byId(st.day, st.anchor), live = liveState(st.day);
    if (s && st.mode !== 'delta') st.time = fmt(st.mode === 'start' ? live[s.id] : endOf(st.day, s, live));
    st.result = ''; renderAll(); return;
  }
  if (b.getAttribute('data-d') != null && b.parentNode.classList.contains('quick')) { st.delta = Math.max(-MAX_SHIFT, Math.min(MAX_SHIFT, st.delta + parseInt(b.getAttribute('data-d'), 10))); renderAll(); return; }
  if (b.id === 'dPlus') { st.delta = Math.min(MAX_SHIFT, st.delta + 1); renderAll(); return; }
  if (b.id === 'dMinus') { st.delta = Math.max(-MAX_SHIFT, st.delta - 1); renderAll(); return; }
  if (b.id === 'nowBtn') { st.time = fmt(nowMin()); renderAll(); return; }
  if (b.getAttribute('data-t') != null) { var base = st.time ? toMin(st.time) : nowMin(); st.time = fmt(base + parseInt(b.getAttribute('data-t'), 10)); renderAll(); return; }
  if (b.id === 'apply') { applyPlan(); return; }
  if (b.id === 'discard') { st.result = ''; setAnchor(st.anchor); return; }
  if (b.id === 'fsBtn') { var el = document.documentElement; try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (er) { /* ignore */ } return; }
});
document.addEventListener('keydown', function (e) {
  var row = e.target.closest ? e.target.closest('.row') : null;
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setAnchor(row.getAttribute('data-id')); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'timeIn') { st.time = e.target.value; st.result = ''; renderSchedule(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.name === 'rule') { st.rule = t.value; renderAll(); }
  else if (t.id === 'fixedSel') { st.fixedId = t.value; renderAll(); }
  else if (t.id === 'squeeze') { st.squeeze = t.checked; renderAll(); }
  else if (t.id === 'minBreak') { st.minBreak = parseInt(t.value, 10); renderAll(); }
  else if (t.id === 'timeIn') { st.time = t.value; renderAll(); }
});

/* ------------------------------------------------------------------ boot */
function tickClock() { $('clock').textContent = fmt(nowMin()); }

function start() {
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  var td = todayDay(); st.day = td || 'saturday';
  st.stream = role === 'assessor-faculty' ? 'assessor' : 'instructor';
  st.anchor = defaultAnchor();
  st.mode = 'end';
  var s = st.anchor ? byId(st.day, st.anchor) : null, live = liveState(st.day);
  if (s) st.time = fmt(currentSession(st.day) ? nowMin() : endOf(st.day, s, live));
  defaultFixed(); renderAll(); tickClock(); setInterval(tickClock, 15000); setInterval(function () { if (!st.busy) renderSchedule(); }, 60000);
  loadLog();
  // live programme: same overlay timetable.html uses
  db.collection(COLLECTIONS.sessions).onSnapshot(function (snap) {
    var byDay = { friday: [], saturday: [], sunday: [] };
    snap.forEach(function (doc) { var x = doc.data(); x.id = doc.id; if (byDay[x.day]) byDay[x.day].push(x); });
    DAYS.forEach(function (d) { if (byDay[d].length) PROGRAMME[d].sessions = byDay[d]; });
    if (!st.busy) { if (!st.anchor || !byId(st.day, st.anchor)) st.anchor = defaultAnchor(); renderAll(); }
  }, function (err) { console.warn('Programme listener:', err.message); });
}

function denied(msg) { $('gate').innerHTML = '<div><h2 style="margin-bottom:8px">' + esc(msg) + '</h2><p style="color:var(--mut)">This page is for Course Directors and Assessor Faculty.</p><p style="margin-top:14px"><a href="timetable.html">Back to the timetable</a></p></div>'; }

initFirebase();
auth.onAuthStateChanged(async function (user) {
  if (!user) { window.location.href = 'signin.html'; return; }
  try { role = await resolveRole(user.uid, user.email || ''); } catch (e) { role = null; }
  if (role !== 'director' && role !== 'assessor-faculty') { denied('You do not have access to this page.'); return; }
  try { fns = firebase.functions(); } catch (e) { denied('The update service could not start.'); return; }
  start();
});
})();
</script>
</body>
</html>
