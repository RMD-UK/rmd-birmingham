<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERC Export — RMD 2026</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f3f6; font-family: var(--font); margin: 0; padding: 0 0 60px; }

    .top-bar {
      background: var(--rmd-navy); color: white;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar img { height: 28px; }
    .top-bar-title { font-size: 15px; font-weight: 700; flex: 1; }

    .content { padding: 14px; max-width: 860px; margin: 0 auto; }

    .warn-banner {
      background: #fff3cd; border-left: 4px solid #c17a00;
      border-radius: 0 6px 6px 0; padding: 14px 16px;
      font-size: 13px; color: #6b4500; margin-bottom: 18px; line-height: 1.5;
    }
    .warn-banner strong { display: block; margin-bottom: 4px; font-size: 14px; }

    .card {
      background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 16px; margin-bottom: 14px;
    }
    .card-title { font-size: 15px; font-weight: 700; color: var(--rmd-navy); margin: 0 0 4px; }
    .card-sub   { font-size: 12px; color: var(--rmd-muted); margin: 0 0 12px; line-height: 1.5; }
    .card-counts { font-size: 13px; color: var(--rmd-navy); margin-bottom: 12px; }
    .card-counts b { color: var(--rmd-blue); }

    .btn-action {
      padding: 9px 16px; background: var(--rmd-blue); color: white;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 700;
      font-family: var(--font); cursor: pointer;
    }
    .btn-action:hover { background: var(--rmd-navy); }
    .btn-action:disabled { background: #aab8c2; cursor: default; }
    .btn-action.secondary { background: white; color: var(--rmd-navy); border: 2px solid #ccd6dd; }

    .assumption-list { font-size: 12px; color: var(--rmd-muted); margin: 8px 0 0; padding-left: 18px; line-height: 1.6; }

    .loading { text-align: center; padding: 40px; color: var(--rmd-muted); }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="cd-dashboard.html" title="Back to dashboard" style="display:flex;align-items:center;"><img src="assets/rmd-logo.png" alt="RMD" style="cursor:pointer;"></a>
  <div class="top-bar-title">ERC Export</div>
</div>

<div class="content" id="pageContent">
  <div class="loading">Loading…</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
/*
 * ══════════════════════════════════════════════════════════════════════════
 * ERC PRE-COURSE EXPORT — verified against real template 2026-07-07
 * ══════════════════════════════════════════════════════════════════════════
 * Real template: import_participants_template.xlsx (Jon uploaded 2026-07-07;
 * saved to the Instructor weekend folder in Claude sync). It's a
 * generic ERC participant-import sheet with 15 named columns (FIRST NAME,
 * MIDDLE NAME, LAST NAME, EMAIL, DATE OF BIRTH, TITLE, ADDRESS, ZIP, CITY,
 * STATE, COUNTRY, ACCESS TO COURSE MATERIALS, ALTERNATIVE NAME, TITLE SHORT,
 * ADDRESS COUNTRY CODE) plus dropdown validation on TITLE/COUNTRY/ACCESS TO
 * COURSE MATERIALS, and two trailing columns (TITLE SHORT, ADDRESS COUNTRY
 * CODE) that are auto-derived by VLOOKUP formulas from TITLE/COUNTRY in the
 * live workbook — not meant to be filled in by hand.
 *
 * Jon confirmed (2026-07-07) only 5 of those 15 columns are needed for our
 * submissions: FIRST NAME, MIDDLE NAME (if applicable), LAST NAME, EMAIL,
 * COUNTRY — and COUNTRY is always "United Kingdom" (exact dropdown spelling
 * from the template's Data sheet, which maps to code GB). DATE OF BIRTH,
 * TITLE, ADDRESS, ZIP, CITY, STATE, ACCESS TO COURSE MATERIALS, ALTERNATIVE
 * NAME are deliberately omitted — don't add them back in without checking
 * with Jon first, this was a scoped-down decision, not an oversight.
 *
 * Data model notes (so future edits don't have to rediscover this):
 *   - iw_registrations: name (single field, not split first/last), email,
 *     role ("Instructor Candidate" | "Assessor / Senior Instructor" | "Faculty" | "Instructor Trainer Candidate"),
 *     status ("pending" | "confirmed" | "declined"). No per-record day-attendance
 *     field — instructor candidates are assumed both days, assessor candidates
 *     Saturday only, per the course structure, not stored per-registration.
 *   - faculty_responses: firstName/lastName split, days.{friday,saturday,sunday},
 *     attendanceStatus ("confirmed" | "declined" | null/pending).
 *   - gateway_assessments/{uid} and development_assessments/{uid} are keyed by
 *     the candidate's `people` collection doc ID (their Firebase Auth uid) —
 *     NOT the iw_registrations doc ID. This tool joins iw_registrations to
 *     people BY EMAIL to find the right uid, because the two collections are
 *     not guaranteed to share IDs (the "sync confirmed candidates to people"
 *     step is a separate, still-pending piece of admin-iw-registrations.html).
 *   - Assessor candidates are NOT included in ERC exports below — per the
 *     handoff, their RMD assessor certificate is a separate, non-ERC credential.
 *
 * "NOT SUCCESSFUL" EXCLUSIONS — added 2026-07-22, Jon's spec:
 *   - Provider Course export (run after Saturday's Gateway assessment):
 *     excludes any confirmed instructor candidate whose gateway_assessments
 *     outcome is explicitly "fail" (set on assessment-gateway.html). Anyone
 *     pending, not yet recorded, or not yet linked to people/ is INCLUDED —
 *     same over-include-and-let-Jon-check default used elsewhere in this file.
 *     Only an explicit fail mark holds someone back.
 *   - Instructor Course export (run end of Sunday): development assessment
 *     (assessment-development.html) only produces a red/amber/green traffic
 *     light, not a pass/fail — Jon confirmed (2026-07-22) that traffic light
 *     should NOT auto-decide the export; the Course Director must explicitly
 *     confirm pass/fail per candidate first. This page adds that confirm step
 *     (see the review list under the Instructor Course card) and stores the
 *     decision as development_assessments/{personId}.directorDecision
 *     ("pass" | "fail"). The export only includes candidates with
 *     directorDecision === "pass" — no decision yet means excluded, not
 *     over-included, because "successful" here can't be inferred, only
 *     confirmed by Jon.
 *   - PEOPLE/ SYNC GAP (fixed 2026-07-22): both checks above depend on
 *     personByEmail() finding a people/ record. Rather than sending Jon to
 *     admin-iw-registrations.html mid-flow, this page now detects confirmed
 *     instructor candidates missing from people/ and offers a "Sync N now"
 *     button right here — syncMissingCandidatesToPeople() writes the exact
 *     same shape as that page's syncToPeople() (role always ROLES.INSTRUCTOR,
 *     since this only ever handles the "Instructor Candidate" IW role).
 *
 * POST-COURSE OUTCOMES EXPORT — still a placeholder, unlike the pre-course one.
 * Jon confirmed (2026-07-07) ERC does support bulk results upload by CSV, but
 * we still don't have their actual results/outcomes template — the headers
 * in exportPostCourseOutcomes() below are a guess, not verified. Same rule as
 * before: get the real file from Jon before trusting or extending this export.
 * ══════════════════════════════════════════════════════════════════════════
 */

initFirebase();

let iwRegistrations = [];
let facultyResponses = [];
let people = [];
let gatewayAssessments = {};
let developmentAssessments = {};

window.addEventListener("load", () => {
  requireDirector("timetable.html").then(() => {
    loadAllData();
  });
});

async function loadAllData() {
  const [regSnap, facSnap, peopleSnap, gwSnap, devSnap] = await Promise.all([
    db.collection("iw_registrations").get(),
    db.collection("faculty_responses").get(),
    db.collection("people").get(),
    db.collection("gateway_assessments").get(),
    db.collection("development_assessments").get()
  ]);

  iwRegistrations  = regSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  facultyResponses = facSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  people           = peopleSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  gwSnap.docs.forEach(d  => gatewayAssessments[d.id]     = d.data());
  devSnap.docs.forEach(d => developmentAssessments[d.id] = d.data());

  render();
}

// ── Helpers ──────────────────────────────────────────────────────────────
// iw_registrations only stores a single `name` field for instructor
// candidates (no first/middle/last split at source). Best-effort split:
// first word = first name, last word = last name, anything in between =
// middle name. Middle name is optional on the ERC side so an empty result
// for two-word names is fine.
function splitName(fullName) {
  const parts = (fullName || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return { first: "", middle: "", last: "" };
  if (parts.length === 1) return { first: parts[0], middle: "", last: "" };
  return {
    first:  parts[0],
    middle: parts.slice(1, -1).join(" "),
    last:   parts[parts.length - 1]
  };
}

function confirmedInstructorCandidates() {
  return iwRegistrations.filter(r => r.role === "Instructor Candidate" && r.status === "confirmed");
}

function confirmedFaculty() {
  return facultyResponses.filter(r => r.attendanceStatus === "confirmed");
}

function personByEmail(email) {
  const e = (email || "").trim().toLowerCase();
  return people.find(p => (p.email || "").trim().toLowerCase() === e);
}

// Same write shape as admin-iw-registrations.html's "Sync listed people" tool
// (syncToPeople()) — kept in sync deliberately rather than diverging. Only
// covers confirmed instructor candidates, since faculty rows never join
// through people/ in this export (their name/email come straight from
// faculty_responses). role is always ROLES.INSTRUCTOR here because
// confirmedInstructorCandidates() is already filtered to that IW role.
async function syncMissingCandidatesToPeople() {
  const missing = confirmedInstructorCandidates().filter(c => !personByEmail(c.email));
  if (!missing.length) return;
  const batch = db.batch();
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const added = [];
  missing.forEach(c => {
    const ref = db.collection("people").doc();
    const data = { name: c.name, email: c.email, role: ROLES.INSTRUCTOR, syncedFrom: "iw_registrations", syncedAt: ts };
    batch.set(ref, data);
    added.push({ id: ref.id, ...data });
  });
  await batch.commit();
  people = people.concat(added);
  render();
}

function candidateOutcome(email) {
  const person = personByEmail(email);
  if (!person) return { gateway: "not linked to people/ — sync needed", development: "" };
  const gw  = gatewayAssessments[person.id];
  const dev = developmentAssessments[person.id];
  return {
    gateway: gw ? (gw.outcome || "pending") : "not recorded",
    development: dev ? devDecisionLabel(dev) : "not recorded"
  };
}

// Gateway outcome is a direct pass/fail set by assessors on the day
// (assessment-gateway.html). null covers pending/not-recorded/not-linked —
// all treated as "not explicitly failed" for export purposes.
function gatewayOutcomeFor(email) {
  const person = personByEmail(email);
  if (!person) return null;
  const gw = person ? gatewayAssessments[person.id] : null;
  return gw ? (gw.outcome || null) : null;
}

// Development assessment only has a red/amber/green traffic light, computed
// the same way assessment-development.html computes it (ratings + optional
// override). This is a DISPLAY hint only — it is deliberately NOT used to
// decide export inclusion, because Jon confirmed (2026-07-22) the traffic
// light must not auto-decide pass/fail. See directorDecisionFor().
function computeDevTrafficLight(dev) {
  if (!dev) return null;
  if (dev.overallOverride) return dev.overallOverride;
  const vals = Object.values(dev.ratings || {});
  if (vals.length === 0) return null;
  if (vals.includes("red"))   return "red";
  if (vals.includes("amber")) return "amber";
  return "green";
}

// The Course Director's explicit pass/fail confirmation for the Instructor
// Course export — set via the review list on this page, stored on
// development_assessments/{personId}.directorDecision.
function directorDecisionFor(email) {
  const person = personByEmail(email);
  if (!person) return null;
  const dev = developmentAssessments[person.id];
  return dev ? (dev.directorDecision || null) : null;
}

function devDecisionLabel(dev) {
  if (dev.directorDecision === "pass") return "Confirmed successful";
  if (dev.directorDecision === "fail") return "Confirmed not successful";
  const tl = computeDevTrafficLight(dev);
  return tl ? `traffic light: ${tl} — awaiting Course Director confirmation` : "not recorded";
}

async function setDirectorDecision(email, decision) {
  const person = personByEmail(email);
  if (!person) {
    alert(`${email} isn't linked to people/ yet — run the "sync confirmed candidates to people" step on Course Administration first.`);
    return;
  }
  await db.collection("development_assessments").doc(person.id).set({
    directorDecision:   decision,
    directorDecisionAt: firebase.firestore.FieldValue.serverTimestamp(),
    directorDecisionBy: auth.currentUser ? auth.currentUser.uid : null
  }, { merge: true });
  developmentAssessments[person.id] = {
    ...(developmentAssessments[person.id] || {}),
    directorDecision: decision
  };
  render();
}

function toCsv(headers, rows) {
  const esc = v => `"${(v == null ? "" : String(v)).replace(/"/g, '""')}"`;
  return [headers.map(esc).join(","), ...rows.map(r => r.map(esc).join(","))].join("\n");
}

function downloadCsv(filename, csv) {
  const blob = new Blob([csv], { type: "text/csv" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = filename; a.click();
}

// ── Exports ──────────────────────────────────────────────────────────────
// Real ERC import_participants_template.xlsx column names, restricted to the
// 5 fields Jon confirmed we actually need to fill in (2026-07-07). COUNTRY is
// always "United Kingdom" — exact spelling from the template's dropdown list,
// which is what its ADDRESS COUNTRY CODE formula resolves to "GB" from.
const ERC_HEADERS = ["FIRST NAME", "MIDDLE NAME", "LAST NAME", "EMAIL", "COUNTRY"];
const ERC_COUNTRY = "United Kingdom";

function rowsToCsvRows(list, nameFn) {
  return list.map(x => {
    const n = nameFn(x);
    return [n.first, n.middle, n.last, x.email, ERC_COUNTRY];
  });
}

function exportBlsProvider() {
  // Run this AFTER Saturday's Gateway assessment. Excludes only candidates
  // explicitly marked "fail" on assessment-gateway.html — pending/unlinked
  // candidates are still included (over-include, let Jon check).
  const candidates = confirmedInstructorCandidates()
    .filter(c => gatewayOutcomeFor(c.email) !== "fail");
  const faculty = confirmedFaculty().filter(f => !f.days || f.days.saturday);

  const rows = [
    ...rowsToCsvRows(candidates, c => splitName(c.name)),
    ...rowsToCsvRows(faculty, f => ({ first: f.firstName, middle: f.middleName || "", last: f.lastName }))
  ];
  downloadCsv("erc-precourse-provider-course.csv", toCsv(ERC_HEADERS, rows));
}

function exportInstructorTraining() {
  // Run this at the END of Sunday. Only includes candidates the Course
  // Director has explicitly confirmed "pass" via the review list below —
  // no decision yet means excluded (not over-included), since "successful"
  // here can't be inferred from the traffic light alone.
  const candidates = confirmedInstructorCandidates()
    .filter(c => directorDecisionFor(c.email) === "pass");
  const faculty = confirmedFaculty().filter(f => !f.days || (f.days.saturday && f.days.sunday));

  const rows = [
    ...rowsToCsvRows(candidates, c => splitName(c.name)),
    ...rowsToCsvRows(faculty, f => ({ first: f.firstName, middle: f.middleName || "", last: f.lastName }))
  ];
  downloadCsv("erc-precourse-instructor-course.csv", toCsv(ERC_HEADERS, rows));
}

function exportPostCourseOutcomes() {
  const headers = ["First Name", "Last Name", "Email", "BLS Gateway Outcome", "Development Outcome", "Notes"];
  const rows = confirmedInstructorCandidates().map(c => {
    const n = splitName(c.name);
    const outcome = candidateOutcome(c.email);
    return [n.first, n.last, c.email, outcome.gateway, outcome.development, ""];
  });
  downloadCsv("erc-postcourse-instructor-outcomes.csv", toCsv(headers, rows));
}

// ── Render ───────────────────────────────────────────────────────────────
function render() {
  const icCount  = confirmedInstructorCandidates().length;
  const facCount = confirmedFaculty().length;

  const missingFromPeople = confirmedInstructorCandidates().filter(c => !personByEmail(c.email));

  const gwFailCount = confirmedInstructorCandidates()
    .filter(c => gatewayOutcomeFor(c.email) === "fail").length;

  const awaitingDecision = confirmedInstructorCandidates()
    .filter(c => directorDecisionFor(c.email) === null);
  const passCount = confirmedInstructorCandidates()
    .filter(c => directorDecisionFor(c.email) === "pass").length;
  const failCount = confirmedInstructorCandidates()
    .filter(c => directorDecisionFor(c.email) === "fail").length;

  const trafficDot = tl => tl === "red" ? "🔴" : tl === "amber" ? "🟠" : tl === "green" ? "🟢" : "⚪";

  const reviewRows = awaitingDecision.map(c => {
    const person = personByEmail(c.email);
    const dev = person ? developmentAssessments[person.id] : null;
    const tl = computeDevTrafficLight(dev);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">
        <span style="width:20px;">${trafficDot(tl)}</span>
        <span style="flex:1;">${c.name} <span style="color:var(--rmd-muted);">(${c.email})</span></span>
        <button class="btn-action secondary" style="padding:5px 10px;font-size:12px;" onclick="setDirectorDecision('${c.email}','pass')">Pass</button>
        <button class="btn-action secondary" style="padding:5px 10px;font-size:12px;color:#c0392b;border-color:#c0392b;" onclick="setDirectorDecision('${c.email}','fail')">Fail</button>
      </div>`;
  }).join("");

  document.getElementById("pageContent").innerHTML = `
    <div class="warn-banner">
      <strong>✓ Pre-course exports use the real ERC template's column names</strong>
      Verified against import_participants_template.xlsx (2026-07-07): FIRST NAME, MIDDLE NAME,
      LAST NAME, EMAIL, COUNTRY — Jon confirmed these 5 fields are all that's needed; Country is
      always "United Kingdom". The real template has 10 further fields (DOB, Title, Address, etc.)
      that are deliberately left out. Candidates marked "not successful" are excluded from both
      exports below — see each card for how.
    </div>

    ${missingFromPeople.length ? `
    <div class="warn-banner" style="background:#e8f0fe;border-left-color:var(--rmd-blue);color:var(--rmd-navy);">
      <strong>⚠ ${missingFromPeople.length} confirmed instructor candidate(s) not linked to people/ yet</strong>
      Gateway outcome and Pass/Fail can't be looked up for them until they're synced. Same sync as
      Course Administration's "Sync listed people" step — this only adds people/ records for these
      ${missingFromPeople.length}, nothing else changes.
      <div style="margin-top:8px;"><button class="btn-action" onclick="syncMissingCandidatesToPeople()">Sync ${missingFromPeople.length} now</button></div>
    </div>` : ""}

    <div class="card">
      <div class="card-title">1 · Provider Course export — run after Saturday's Gateway</div>
      <div class="card-sub">Confirmed instructor candidates who did NOT fail the Gateway assessment, plus confirmed faculty attending Saturday.</div>
      <div class="card-counts">${icCount - gwFailCount} of ${icCount} instructor candidate(s) included${gwFailCount ? ` · ${gwFailCount} excluded (failed Gateway)` : ""}</div>
      <button class="btn-action" onclick="exportBlsProvider()">⬇ Download CSV — Provider Course</button>
    </div>

    <div class="card">
      <div class="card-title">2 · Instructor Course export — run at the end of Sunday</div>
      <div class="card-sub">Confirmed instructor candidates YOU have confirmed "Pass" below, plus confirmed faculty attending the full weekend. Candidates with no decision yet are excluded until you decide.</div>
      <div class="card-counts">${passCount} of ${icCount} instructor candidate(s) included${failCount ? ` · ${failCount} excluded (failed)` : ""}${awaitingDecision.length ? ` · ${awaitingDecision.length} awaiting your decision` : ""}</div>
      ${awaitingDecision.length ? `
        <div style="margin:10px 0;">
          <div style="font-size:12px;font-weight:700;color:var(--rmd-navy);margin-bottom:4px;">Confirm before exporting — traffic light is a hint only, not the decision:</div>
          ${reviewRows}
        </div>` : ""}
      <button class="btn-action" onclick="exportInstructorTraining()" style="margin-top:10px;">⬇ Download CSV — Instructor Course</button>
    </div>

    <div class="card">
      <div class="card-title">Post-course: instructor pass/fail outcomes</div>
      <div class="card-sub">
        ⚠ <strong>Placeholder headers — do not upload to ERC yet.</strong> Jon confirmed (2026-07-07)
        ERC does accept bulk results upload by CSV, but we don't have their actual results template
        yet — the headers below (First Name, Last Name, Email, BLS Gateway Outcome, Development
        Outcome, Notes) are still a guess, same situation the participant-import file was in before
        it got fixed. Get the real results/outcomes template from the ERC course director portal
        before this export is used for anything real.
      </div>
      <div class="card-sub">
        Confirmed instructor candidates joined to their gateway/development assessment
        records by email. If a candidate shows "not linked to people/ — sync needed",
        the Course Administration "sync confirmed candidates to people" step hasn't
        been run for them yet, so their assessment record can't be found.
      </div>
      <div class="card-counts">${icCount} instructor candidate(s), ${facCount} confirmed faculty on file</div>
      <button class="btn-action" onclick="exportPostCourseOutcomes()">⬇ Download CSV (draft only)</button>
    </div>
  `;
}
</script>
</body>
</html>
