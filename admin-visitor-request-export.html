<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Request Export — RMD</title>
<link rel="stylesheet" href="css/rmd.css">
<style>
  * { box-sizing: border-box; }
  body { background: #f0f3f6; font-family: var(--font); margin: 0; padding: 0 0 60px; }

  .top-bar {
    background: var(--rmd-navy); color: white;
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar img { height: 28px; }
  .top-bar-title { font-size: 15px; font-weight: 700; flex: 1; }

  .content { padding: 14px; max-width: 900px; margin: 0 auto; }

  .warn-banner {
    background: #fff3cd; border-left: 4px solid #c17a00;
    border-radius: 0 6px 6px 0; padding: 14px 16px;
    font-size: 13px; color: #6b4500; margin-bottom: 16px; line-height: 1.5;
  }
  .warn-banner strong { display: block; margin-bottom: 4px; font-size: 14px; }

  .card {
    background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 16px; margin-bottom: 14px;
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--rmd-navy); margin: 0 0 4px; }
  .card-sub   { font-size: 12px; color: var(--rmd-muted); margin: 0 0 12px; line-height: 1.5; }
  .card-counts { font-size: 13px; color: var(--rmd-navy); margin-bottom: 12px; }
  .card-counts b { color: var(--rmd-blue); }

  .btn-action {
    padding: 9px 16px; background: var(--rmd-blue); color: white;
    border: none; border-radius: 6px; font-size: 13px; font-weight: 700;
    font-family: var(--font); cursor: pointer;
  }
  .btn-action:hover { background: var(--rmd-navy); }
  .btn-action.secondary { background: white; color: var(--rmd-navy); border: 2px solid #ccd6dd; }

  .fixed-grid { display: grid; grid-template-columns: 200px 1fr; gap: 10px 14px; font-size: 13px; align-items: start; }
  .fixed-grid label { font-weight: 700; color: var(--rmd-navy); padding-top: 8px; }
  .fixed-grid input, .fixed-grid textarea {
    width: 100%; border: 2px solid #ccd6dd; border-radius: 6px; padding: 7px 10px;
    font-family: var(--font); font-size: 13px;
  }
  .fixed-grid textarea { min-height: 60px; resize: vertical; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--rmd-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 2px solid #e2e8ed; }
  td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
  td input {
    width: 100%; border: 1px solid #ccd6dd; border-radius: 4px; padding: 5px 7px;
    font-family: var(--font); font-size: 13px;
  }
  td input.flagged { border-color: var(--rmd-warn); background: #fff8ec; }
  .row-email { color: var(--rmd-muted); font-size: 12px; }

  .loading { text-align: center; padding: 40px; color: var(--rmd-muted); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="admin-global-tools.html" title="Back to Global Tools" style="display:flex;align-items:center;"><img src="assets/rmd-logo.png" alt="RMD"></a>
  <div class="top-bar-title">Visitor Request Export</div>
  <button onclick="loadAll()" style="background:rgba(255,255,255,0.15);border:none;color:white;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;">↻ Refresh</button>
</div>

<div class="content" id="pageContent">
  <div class="loading">Loading…</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
/*
 * ══════════════════════════════════════════════════════════════════════════
 * VISITOR REQUEST EXPORT — built 2026-08-27
 * ══════════════════════════════════════════════════════════════════════════
 * Purpose: UoB requires a "Visiting Personnel Request" form (Microsoft
 * Forms, https://forms.cloud.microsoft/...) submitted PER PERSON for anyone
 * without a UoB ID who needs premises access. RMD Senior Faculty who are not
 * otherwise UoB staff/students need this annually for the whole academic
 * year (1 Oct – 30 Sep), separately from Instructor Weekend-only visitors
 * (who are a different, smaller list Jon compiles by hand — not sourced
 * from here).
 *
 * Source of truth: Jon specified "from MoU" explicitly (2026-08-27), so this
 * reads mou_roster (role === "RMD Senior Faculty", same roleBucket() logic
 * as admin-mou-dashboard.html — kept identical on purpose, don't diverge)
 * joined to mou_responses for CURRENT_MOU_YEAR to pick up each person's
 * self-declared nationality from their MOU submission.
 *
 * NOTE — there is a SEPARATE "faculty roster" (admin-faculty-roster.html)
 * that feeds the public faculty pages and admin-senior-faculty-review.html.
 * It is not guaranteed to have the same membership as mou_roster's "RMD
 * Senior Faculty" tag (one is MOU self-declaration, the other is Jon's
 * organisational role assignment). This tool deliberately uses mou_roster
 * per Jon's instruction — if the two ever need reconciling, that's a
 * separate conversation, not a bug in this file.
 *
 * Known gaps, by design, not oversights:
 *   - Nationality is blank for anyone who hasn't submitted this year's MOU
 *     yet (mou_responses has no doc for them). Flagged in the table (orange
 *     border) and counted in the warning banner. Chase via the MOU
 *     Dashboard's "Outstanding" tab before filing the visitor form for them.
 *   - "Full Name (as per passport)" is pre-filled from mou_roster's `name`
 *     field, which is whatever name they registered under — NOT verified
 *     against an actual passport. Editable per-row so Jon (or whoever fills
 *     the UoB form) can correct it before export.
 *   - "Purpose of Visit" and the date range are fixed text shared by the
 *     whole group, editable in the Fixed Details card so this doesn't need
 *     a code change if wording or dates shift.
 *
 * ── ADDENDUM 2026-08-27: Instructor Weekend external-instructor section ──
 * Added a second, separate group below: confirmed faculty_responses
 * (attendanceStatus === "confirmed") whose email does NOT appear anywhere
 * in mou_roster — i.e. people attending the Instructor Weekend who are not
 * expected RMD Birmingham members ("external instructors": faculty visiting
 * from another RMD site, or genuinely outside RMD). This is the list Jon
 * previously compiled by hand for the IW-only visitor group; it is now
 * generated from faculty_responses + mou_roster instead. Nationality here
 * comes from faculty-form.html's new Nationality field (added 2026-08-27,
 * UK Citizen / Other only) — NOT a full country, so rows marked "Other"
 * may need Jon to ask the person their actual nationality before filing the
 * UoB form, same as the passport-name caveat above. Uses its own fixed
 * details (IW weekend dates, IW-specific purpose text) and its own CSV
 * export, kept separate from the senior-faculty group above rather than
 * merged, since the two groups have different sourcing, different fixed
 * details, and different renewal cadence (annual vs per-weekend).
 * ══════════════════════════════════════════════════════════════════════════
 */

initFirebase();

let roster = [];         // mou_roster docs
let submissions = [];    // mou_responses for CURRENT_MOU_YEAR
let overrides = {};      // id -> { name, nationality } edits made on this page
let facultyResponses = []; // faculty_responses docs (Instructor Weekend faculty submissions)
let facultyRosterDocs = []; // faculty_roster docs (Birmingham student/senior faculty — name/group, mostly no email)
let iwOverrides = {};      // id -> { name, nationality, include } edits for the IW review table

window.addEventListener("load", () => {
  requireDirector("timetable.html").then(() => {
    loadAll();
  });
});

async function loadAll() {
  document.getElementById("pageContent").innerHTML = `<div class="loading">Loading…</div>`;
  const [rosterSnap, subSnap, facultySnap, facRosterSnap] = await Promise.all([
    db.collection(COLLECTIONS.mouRoster).get(),
    db.collection(COLLECTIONS.mouResponses).where("academicYear", "==", CURRENT_MOU_YEAR).get(),
    db.collection("faculty_responses").get(),
    db.collection(COLLECTIONS.facultyRoster).get()
  ]);
  roster = rosterSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  submissions = subSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  facultyResponses = facultySnap.docs.map(d => ({ id: d.id, ...d.data() }));
  facultyRosterDocs = facRosterSnap.docs.map(d => d.data());
  overrides = {};
  iwOverrides = {};
  render();
}

// Identical to admin-mou-dashboard.html's roleBucket() — kept in sync on purpose.
function roleBucket(role) {
  const r = (role || "").trim().toLowerCase();
  if (r === "rmd student faculty") return "student";
  if (r === "rmd senior faculty") return "senior";
  return "other";
}

function seniorFaculty() {
  return roster.filter(m => roleBucket(m.role) === "senior");
}

function submissionFor(email) {
  const e = (email || "").trim().toLowerCase();
  return submissions.find(s => (s.email || "").trim().toLowerCase() === e) || null;
}

// Derive the visit-year window from CURRENT_MOU_YEAR ("2026/27" -> 1 Oct 2026
// to 30 Sep 2027) so this doesn't need editing every year just for the dates.
// Still shown as editable text in case the actual window ever needs to differ.
function defaultDateRange() {
  const m = CURRENT_MOU_YEAR.match(/^(\d{4})\/(\d{2})$/);
  if (!m) return { from: "", to: "" };
  const startYear = parseInt(m[1], 10);
  const endYear = startYear + 1;
  return { from: `1 October ${startYear}`, to: `30 September ${endYear}` };
}

let fixedDetails = null;   // set on first render, then left alone across re-renders unless reset
let iwFixedDetails = null; // same, for the IW external-instructor group below

function defaultFixedDetails() {
  const { from, to } = defaultDateRange();
  return {
    department: "Birmingham Medical School",
    applicant: "Jonathan Hulme",
    purpose: "Basic life support training: this person is an instructor for the UoB life support course.",
    from, to
  };
}

function esc(v) { return (v == null ? "" : String(v)).replace(/"/g, "&quot;"); }

function toCsv(headers, rows) {
  const q = v => `"${(v == null ? "" : String(v)).replace(/"/g, '""')}"`;
  return [headers.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\n");
}

function downloadCsv(filename, csv) {
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
}

// 2026-08-31: prefer the self-submitted passport name from this year's mou_responses
// (mou-form.html asks explicitly for "full name as per passport") over mou_roster's
// hand-maintained name, since the roster entry is "whatever name they registered
// under" and was never verified against a passport. Falls back to the roster name
// for anyone who hasn't submitted this year's MOU yet.
function currentRows() {
  return seniorFaculty().map(m => {
    const sub = submissionFor(m.email);
    const ov = overrides[m.id] || {};
    const passportName = (sub && sub.name) ? sub.name : (m.name || "");
    return {
      id: m.id,
      email: m.email || "",
      name: ov.name != null ? ov.name : passportName,
      nationality: ov.nationality != null ? ov.nationality : (sub ? (sub.nationality || "") : ""),
      hasSubmission: !!sub
    };
  });
}

function updateField(id, field, value) {
  overrides[id] = overrides[id] || {};
  overrides[id][field] = value;
}

// ── Instructor Weekend visitor-request review list (added 2026-08-27, ─────
// revised same day after Jon flagged the first cut as wrong) ──────────────
// First version excluded anyone whose faculty-form email matched mou_roster.
// Jon reported real senior faculty (Ben Stanley, Chesca Harper, Cameron
// Parkes, Naveed Kordmahalleh, Amith Shibu, Nick Coffin, and others) were
// showing up as "external" anyway. Checked live data: they ARE on mou_roster
// and/or faculty_roster, just under a different email (personal Gmail/NHS
// address on the faculty form vs whatever's on the roster) or a nickname
// (Becca/Rebecca Everitt, Tom/Thomas Burton, Rosie/Rosanna Lilwall,
// Chesca/Francesca Harper) that a name match alone won't reliably catch
// either. Automatic exclusion isn't safe here — a false "not external" would
// mean a genuinely external instructor never gets a visitor request filed,
// which is the actual compliance risk.
//
// New approach: show EVERY confirmed IW faculty response, each with a
// checkbox defaulting on ("needs visitor request") only when no match is
// found at all — by email against mou_roster, or by exact name against
// mou_roster or faculty_roster. A same-surname hit against either roster
// that isn't already an exact match is shown as a soft "check — possible
// nickname match" flag rather than used to auto-uncheck, since surname
// alone isn't reliable enough to suppress a row outright (common surnames
// would false-negative). Jon reviews and ticks/unticks before exporting —
// same "over-include and let Jon check" philosophy already used by
// admin-erc-export.html's people-linkage (see [[rmd-sync-to-people-automation]]).
function mouRosterEmailSet() {
  return new Set(roster.map(m => (m.email || "").trim().toLowerCase()).filter(Boolean));
}

function normName(s) {
  return (s || "").toLowerCase().trim().replace(/\s+/g, " ").replace(/[().]/g, "");
}

function surnameOf(name) {
  const parts = normName(name).split(" ").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "";
}

function fullName(f) {
  return [f.firstName, f.middleName, f.lastName].filter(Boolean).join(" ");
}

function iwMatchInfo(name, email) {
  const n = normName(name);
  const e = (email || "").trim().toLowerCase();
  const mouEmails = mouRosterEmailSet();
  const mouNames = new Set(roster.map(m => normName(m.name)));
  const facNames = new Set(facultyRosterDocs.map(m => normName(m.name)));

  if (e && mouEmails.has(e)) return { status: "match", label: "✓ email match (mou_roster)" };
  if (n && mouNames.has(n)) return { status: "match", label: "✓ name match (mou_roster)" };
  if (n && facNames.has(n)) return { status: "match", label: "✓ name match (faculty_roster)" };

  const surname = surnameOf(name);
  if (surname && surname.length > 2) {
    const rosterSurnames = new Set([...roster, ...facultyRosterDocs].map(m => surnameOf(m.name)));
    if (rosterSurnames.has(surname)) return { status: "check", label: "⚠ check — possible nickname match (same surname on a roster)" };
  }
  return { status: "none", label: "no match on either roster" };
}

function allConfirmedIwRows() {
  return facultyResponses
    .filter(f => f.attendanceStatus === "confirmed")
    .map(f => {
      const ov = iwOverrides[f.id] || {};
      const name = ov.name != null ? ov.name : fullName(f);
      const match = iwMatchInfo(name, f.email);
      const defaultInclude = match.status !== "match";
      return {
        id: f.id,
        email: f.email || "",
        role: f.role || "",
        name,
        nationality: ov.nationality != null ? ov.nationality : (f.nationality || ""),
        matchLabel: match.label,
        matchStatus: match.status,
        include: ov.include != null ? ov.include : defaultInclude
      };
    })
    .sort((a, b) => {
      if (a.include !== b.include) return a.include ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
}

function updateIwField(id, field, value) {
  iwOverrides[id] = iwOverrides[id] || {};
  iwOverrides[id][field] = value;
  render();
}

function toggleIwInclude(id, checked) {
  iwOverrides[id] = iwOverrides[id] || {};
  iwOverrides[id].include = checked;
  render();
}

function defaultIwFixedDetails() {
  return {
    department: "Birmingham Medical School",
    applicant: "Jonathan Hulme",
    purpose: "Basic life support training: this person is an external instructor attending the RMD Instructor Weekend.",
    from: "9 October 2026",
    to: "11 October 2026"
  };
}

function readIwFixedDetailsFromForm() {
  iwFixedDetails = {
    department: document.getElementById("iwfd-department").value,
    applicant: document.getElementById("iwfd-applicant").value,
    purpose: document.getElementById("iwfd-purpose").value,
    from: document.getElementById("iwfd-from").value,
    to: document.getElementById("iwfd-to").value
  };
}

function copyIwFixedDetails() {
  readIwFixedDetailsFromForm();
  const text = [
    `Which department will the visitor be based in? ${iwFixedDetails.department}`,
    `Application made by: ${iwFixedDetails.applicant}`,
    `Purpose of Visit: ${iwFixedDetails.purpose}`,
    `Proposed Date of Visit from: ${iwFixedDetails.from}`,
    `Proposed Date of visit to: ${iwFixedDetails.to}`
  ].join("\n");
  navigator.clipboard.writeText(text).then(() => alert("Fixed details copied."));
}

function exportIwCsv() {
  readIwFixedDetailsFromForm();
  const rows = allConfirmedIwRows().filter(r => r.include);
  if (!rows.length) { alert("No rows are ticked for the visitor request — tick at least one row in the table below."); return; }
  const headers = [
    "Full Name of Visitor (as per passport)",
    "Visitor's email address",
    "Visitor's Nationality",
    "Which department will the visitor be based in?",
    "Application made by",
    "Purpose of Visit",
    "Proposed Date of Visit from",
    "Proposed Date of visit to"
  ];
  const csvRows = rows.map(r => [
    r.name, r.email, r.nationality,
    iwFixedDetails.department, iwFixedDetails.applicant, iwFixedDetails.purpose, iwFixedDetails.from, iwFixedDetails.to
  ]);
  downloadCsv(`rmd-iw-external-instructors-visitor-request-2026.csv`, toCsv(headers, csvRows));
}

async function copyIwCsvToClipboard() {
  const rows = allConfirmedIwRows().filter(r => r.include);
  if (!rows.length) { alert("No rows are ticked for the visitor request — tick at least one row in the table below."); return; }
  const headers = ["Full Name of Visitor (as per passport)", "Visitor's email address", "Visitor's Nationality"];
  const csv = toCsv(headers, rows.map(r => [r.name, r.email, r.nationality]));
  await navigator.clipboard.writeText(csv);
  alert(`Copied ${rows.length} row(s) — name, email, nationality only. Fixed details (department, purpose, dates) are the same for every row, use the copy button on that card instead.`);
}

function readFixedDetailsFromForm() {
  fixedDetails = {
    department: document.getElementById("fd-department").value,
    applicant: document.getElementById("fd-applicant").value,
    purpose: document.getElementById("fd-purpose").value,
    from: document.getElementById("fd-from").value,
    to: document.getElementById("fd-to").value
  };
}

function copyFixedDetails() {
  readFixedDetailsFromForm();
  const text = [
    `Which department will the visitor be based in? ${fixedDetails.department}`,
    `Application made by: ${fixedDetails.applicant}`,
    `Purpose of Visit: ${fixedDetails.purpose}`,
    `Proposed Date of Visit from: ${fixedDetails.from}`,
    `Proposed Date of visit to: ${fixedDetails.to}`
  ].join("\n");
  navigator.clipboard.writeText(text).then(() => alert("Fixed details copied."));
}

function exportCsv() {
  readFixedDetailsFromForm();
  const rows = currentRows();
  if (!rows.length) { alert("No RMD Senior Faculty found on the current roster."); return; }
  const headers = [
    "Full Name of Visitor (as per passport)",
    "Visitor's email address",
    "Visitor's Nationality",
    "Which department will the visitor be based in?",
    "Application made by",
    "Purpose of Visit",
    "Proposed Date of Visit from",
    "Proposed Date of visit to"
  ];
  const csvRows = rows.map(r => [
    r.name, r.email, r.nationality,
    fixedDetails.department, fixedDetails.applicant, fixedDetails.purpose, fixedDetails.from, fixedDetails.to
  ]);
  downloadCsv(`rmd-senior-faculty-visitor-request-${CURRENT_MOU_YEAR.replace("/", "-")}.csv`, toCsv(headers, csvRows));
}

async function copyCsvToClipboard() {
  readFixedDetailsFromForm();
  const rows = currentRows();
  const headers = ["Full Name of Visitor (as per passport)", "Visitor's email address", "Visitor's Nationality"];
  const csv = toCsv(headers, rows.map(r => [r.name, r.email, r.nationality]));
  await navigator.clipboard.writeText(csv);
  alert(`Copied ${rows.length} row(s) — name, email, nationality only. Fixed details (department, purpose, dates) are the same for every row, use the copy button on that card instead.`);
}

function render() {
  const rows = currentRows();
  const missingNationality = rows.filter(r => !r.nationality);
  const fd = fixedDetails || defaultFixedDetails();

  const iwAllRows = allConfirmedIwRows();
  const iwSelected = iwAllRows.filter(r => r.include);
  const iwMissingNationality = iwSelected.filter(r => !r.nationality);
  const iwOtherNationality = iwSelected.filter(r => r.nationality === "Other");
  const iwfd = iwFixedDetails || defaultIwFixedDetails();

  document.getElementById("pageContent").innerHTML = `
    <div class="warn-banner">
      <strong>RMD Senior Faculty only — from the MOU roster (${CURRENT_MOU_YEAR})</strong>
      This covers the "all year" visitor group (people tagged "RMD Senior Faculty" on the MOU
      roster). It does NOT cover Instructor Weekend-only visitors — see the separate "External
      instructors" group further down this page, generated automatically from confirmed faculty
      submissions. "Full Name" comes from this year's MOU submission (self-declared passport
      name) where one exists; for anyone who hasn't submitted yet it falls back to the roster
      name, which is not a verified passport name — check/edit those rows before submitting.
      Nationality only populates once someone has submitted this year's MOU (via the MOU
      Dashboard) — rows with none are outlined orange below.
    </div>

    <div class="card">
      <div class="card-title">Fixed details — same for every submission this group needs</div>
      <div class="card-sub">Pre-filled from what Jon specified 2026-08-27. Edit here if it changes; edits are used by both the copy and CSV export buttons below.</div>
      <div class="fixed-grid">
        <label>Department</label><input id="fd-department" value="${esc(fd.department)}">
        <label>Application made by</label><input id="fd-applicant" value="${esc(fd.applicant)}">
        <label>Purpose of Visit</label><textarea id="fd-purpose">${esc(fd.purpose)}</textarea>
        <label>Proposed Date of Visit from</label><input id="fd-from" value="${esc(fd.from)}">
        <label>Proposed Date of visit to</label><input id="fd-to" value="${esc(fd.to)}">
      </div>
      <div style="margin-top:12px;"><button class="btn-action secondary" onclick="copyFixedDetails()">📋 Copy fixed details</button></div>
    </div>

    <div class="card">
      <div class="card-title">RMD Senior Faculty visitor details</div>
      <div class="card-counts"><b>${rows.length}</b> senior faculty on roster${missingNationality.length ? ` · <b style="color:var(--rmd-warn);">${missingNationality.length}</b> missing nationality (MOU not yet submitted)` : ""}</div>
      ${rows.length ? `
      <table>
        <thead><tr><th>Full Name (as per passport)</th><th>Email</th><th>Nationality</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><input value="${esc(r.name)}" onchange="updateField('${r.id}','name',this.value)"></td>
              <td class="row-email">${esc(r.email)}</td>
              <td><input class="${r.nationality ? "" : "flagged"}" value="${esc(r.nationality)}" placeholder="${r.hasSubmission ? "" : "MOU not submitted"}" onchange="updateField('${r.id}','nationality',this.value)"></td>
            </tr>`).join("")}
        </tbody>
      </table>
      ` : `<div style="color:var(--rmd-muted);font-size:13px;">No one tagged "RMD Senior Faculty" found on the current mou_roster. Check the MOU Dashboard's "Manage roster" tab.</div>`}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-action" onclick="exportCsv()">⬇ Download CSV (all 8 form fields)</button>
        <button class="btn-action secondary" onclick="copyCsvToClipboard()">📋 Copy name/email/nationality only</button>
      </div>
    </div>

    <div class="warn-banner">
      <strong>Instructor Weekend visitor-request review — every confirmed faculty response</strong>
      Every confirmed IW faculty submission is listed below, with "Needs visitor request" pre-ticked
      only when no match was found against mou_roster or faculty_roster (by email or exact name).
      Faculty-form emails are often personal (Gmail, NHS) rather than what's on a roster, and
      nicknames (Becca/Rebecca, Tom/Thomas, Chesca/Francesca…) don't match exactly either — so this
      is a starting point, not a verdict. Check the match column, untick anyone you recognise as
      already a Birmingham member, tick anyone the matching missed, then export. Nationality comes
      from the faculty form's UK Citizen / Other question, not a full country — rows marked "Other"
      need the actual country confirmed before filing the UoB form.
    </div>

    <div class="card">
      <div class="card-title">Fixed details — Instructor Weekend group</div>
      <div class="card-sub">Separate from the senior-faculty fixed details above since the dates and purpose differ. Edit here if wording or dates shift.</div>
      <div class="fixed-grid">
        <label>Department</label><input id="iwfd-department" value="${esc(iwfd.department)}">
        <label>Application made by</label><input id="iwfd-applicant" value="${esc(iwfd.applicant)}">
        <label>Purpose of Visit</label><textarea id="iwfd-purpose">${esc(iwfd.purpose)}</textarea>
        <label>Proposed Date of Visit from</label><input id="iwfd-from" value="${esc(iwfd.from)}">
        <label>Proposed Date of visit to</label><input id="iwfd-to" value="${esc(iwfd.to)}">
      </div>
      <div style="margin-top:12px;"><button class="btn-action secondary" onclick="copyIwFixedDetails()">📋 Copy fixed details</button></div>
    </div>

    <div class="card">
      <div class="card-title">Confirmed IW faculty — review &amp; select for visitor request</div>
      <div class="card-counts">
        <b>${iwSelected.length}</b> of <b>${iwAllRows.length}</b> confirmed faculty ticked for the visitor request
        ${iwMissingNationality.length ? ` · <b style="color:var(--rmd-warn);">${iwMissingNationality.length}</b> ticked with no nationality` : ""}
        ${iwOtherNationality.length ? ` · <b style="color:var(--rmd-warn);">${iwOtherNationality.length}</b> ticked "Other" — confirm actual country before filing` : ""}
      </div>
      ${iwAllRows.length ? `
      <table>
        <thead><tr><th></th><th>Full Name (as per passport)</th><th>Email</th><th>Role</th><th>Nationality</th><th>Roster match</th></tr></thead>
        <tbody>
          ${iwAllRows.map(r => `
            <tr>
              <td><input type="checkbox" ${r.include ? "checked" : ""} onchange="toggleIwInclude('${r.id}', this.checked)"></td>
              <td><input value="${esc(r.name)}" onchange="updateIwField('${r.id}','name',this.value)" ${r.include ? "" : "disabled"}></td>
              <td class="row-email">${esc(r.email)}</td>
              <td class="row-email">${esc(r.role)}</td>
              <td><input class="${r.nationality ? "" : "flagged"}" value="${esc(r.nationality)}" placeholder="not set" onchange="updateIwField('${r.id}','nationality',this.value)" ${r.include ? "" : "disabled"}></td>
              <td style="font-size:11px;color:${r.matchStatus === 'match' ? 'var(--rmd-muted)' : r.matchStatus === 'check' ? 'var(--rmd-warn)' : 'var(--rmd-navy)'};">${esc(r.matchLabel)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      ` : `<div style="color:var(--rmd-muted);font-size:13px;">No confirmed Instructor Weekend faculty responses yet.</div>`}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-action" onclick="exportIwCsv()">⬇ Download CSV — ticked rows (all 8 form fields)</button>
        <button class="btn-action secondary" onclick="copyIwCsvToClipboard()">📋 Copy ticked — name/email/nationality only</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
