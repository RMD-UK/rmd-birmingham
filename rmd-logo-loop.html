<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMD Logo Loop</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body.dark{background:#04132b}
  svg{width:100vw;height:100vh;display:block}
  body.idle{cursor:none}
  #hint{position:fixed;left:12px;bottom:10px;font:12px Arial,sans-serif;color:#8a97ad;opacity:.0;transition:opacity .6s}
  body:not(.idle) #hint{opacity:.8}
  #back{position:fixed;left:12px;top:10px;font:13px/1 Arial,sans-serif;font-weight:700;color:#fff;background:rgba(6,48,106,.85);padding:7px 13px;border-radius:5px;text-decoration:none;opacity:0;transition:opacity .6s}
  body:not(.idle) #back{opacity:.9}
  body.fs #back{display:none}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 750 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clipL"><rect x="-200" y="0" width="576" height="900"/></clipPath>
    <clipPath id="clipR"><rect x="374" y="0" width="600" height="900"/></clipPath>
    <path id="heartPath" d="M375,552 C300,512 200,432 200,330 C200,285 235,258 275,258 C312,258 346,272 375,296 C404,272 438,258 475,258 C515,258 550,285 550,330 C550,432 450,512 375,552 Z"/>
  </defs>

  <g id="world">
    <!-- outer segments: arc + word -->
    <g id="seg0"><path class="arc"/><g class="letters"></g></g>
    <g id="seg1"><path class="arc"/><g class="letters"></g></g>
    <g id="seg2"><path class="arc"/><g class="letters"></g></g>

    <!-- inner badge (twists as one) -->
    <g id="inner">
      <g id="halfL"><use href="#heartPath" fill="#06306a" clip-path="url(#clipL)"/></g>
      <g id="halfR"><use href="#heartPath" fill="#06306a" clip-path="url(#clipR)"/></g>
      <g id="vee">
        <line id="v1" x1="283" y1="383" x2="373" y2="550" stroke-width="3.2" stroke-linecap="round"/>
        <line id="v2" x1="467" y1="383" x2="373" y2="550" stroke-width="3.2" stroke-linecap="round"/>
      </g>
      <g id="head">
        <ellipse cx="374" cy="280" rx="67" ry="74" fill="#06306a" stroke="#ffffff" stroke-width="3"/>
      </g>
      <g id="mini">
        <path id="miniHeart" d="M0,22 C-30,0 -28,-24 -12,-24 C-4,-24 0,-18 0,-14 C0,-18 4,-24 12,-24 C28,-24 30,0 0,22Z"/>
      </g>
    </g>
  </g>
</svg>
<a id="back" href="member-menu.html">&larr; Menu</a>
<div id="hint">Click or F: full screen &nbsp; B: background &nbsp; Space: pause &nbsp; Esc: exit full screen &nbsp;&middot;&nbsp; <span id="awake">Keeping screen awake...</span></div>

<script>
(function(){
  const NAVY = [6,48,106], WHITE = [255,255,255];
  const CX = 375, CY = 375;
  const RING_R = 313, RING_W = 18, BASE_R = 221;
  const T = 18;

  // ---- outer segments -------------------------------------------------
  // angles in degrees clockwise from 12 o'clock
  const segs = [
    { word:'Resuscitation', a0:-47, a1:48,  arc0:-60,  arc1:62 },
    { word:'Mentorship',    a0:78,  a1:158, arc0:62,   arc1:175 },
    { word:'Development',  a0:192, a1:287, arc0:175,  arc1:300 }
  ];
  const rad = d => d*Math.PI/180;
  const pt = (r,deg) => [CX + r*Math.sin(rad(deg)), CY - r*Math.cos(rad(deg))];

  const cv = document.createElement('canvas').getContext('2d');
  const FS = 54, BIG = 1.32;
  function buildLetters(seg, g){
    const word = seg.word;
    const widths = [];
    for (let i=0;i<word.length;i++){
      const fs = i===0 ? FS*BIG : FS;
      cv.font = 'bold ' + fs + 'px Arial, Helvetica, sans-serif';
      widths.push(cv.measureText(word[i]).width);
    }
    const W = widths.reduce((a,b)=>a+b,0);
    const L = rad(seg.a1 - seg.a0) * BASE_R;
    const k = L / W;
    let cum = 0;
    for (let i=0;i<word.length;i++){
      const centre = (cum + widths[i]/2) * k;
      cum += widths[i];
      const ang = seg.a0 + (centre / BASE_R) * 180/Math.PI;
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.textContent = word[i];
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family','Arial, Helvetica, sans-serif');
      t.setAttribute('font-weight','700');
      t.setAttribute('font-size', i===0 ? FS*BIG : FS);
      t.setAttribute('fill','#06306a');
      t.setAttribute('transform', `translate(${CX} ${CY}) rotate(${ang}) translate(0 ${-BASE_R})`);
      g.appendChild(t);
    }
  }
  segs.forEach((s,i)=>{
    const g = document.getElementById('seg'+i);
    const arc = g.querySelector('.arc');
    const [x0,y0] = pt(RING_R, s.arc0 - 0.4);
    const [x1,y1] = pt(RING_R, s.arc1 + 0.4);
    const large = ((s.arc1 - s.arc0) > 180) ? 1 : 0;
    arc.setAttribute('d', `M${x0},${y0} A${RING_R},${RING_R} 0 ${large} 1 ${x1},${y1}`);
    arc.setAttribute('fill','none');
    arc.setAttribute('stroke','#06306a');
    arc.setAttribute('stroke-width', RING_W);
    buildLetters(s, g.querySelector('.letters'));
    const mid = (s.arc0 + s.arc1)/2;
    s.mid = mid;
    s.pivot = pt(RING_R-30, mid);
    s.el = g;
  });

  // ---- easing + keyframes --------------------------------------------
  const E = {
    io: u => u<.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2,
    out: u => 1 - Math.pow(1-u,3),
    back: u => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(u-1,3) + c1*Math.pow(u-1,2); },
    lin: u => u
  };
  // keyframes: [time, value, easingName?]  easing applies to the segment ARRIVING at this key
  function K(kfs, t){
    if (t <= kfs[0][0]) return kfs[0][1];
    for (let i=0;i<kfs.length-1;i++){
      const a = kfs[i], b = kfs[i+1];
      if (t >= a[0] && t <= b[0]){
        const u = (t-a[0])/(b[0]-a[0]);
        const e = E[b[2] || 'io'](u);
        return a[1] + (b[1]-a[1])*e;
      }
    }
    return kfs[kfs.length-1][1];
  }

  // global
  const G_SCALE = [[0,1],[5,1],[8,.68],[12,.68],[16,1],[T,1]];
  // twist of the inner badge (degrees, two full flips)
  const TWIST   = [[0,0],[1.5,0],[5,720],[T,720]];
  const TWIST_DIP = [[0,0],[1.5,0],[3.25,.12,'io'],[5,0],[T,0]];
  // outer segments
  const ORBIT   = [[0,0],[1.5,0],[5,360],[8,420],[12,600],[16,720],[T,720]];
  const RADIAL  = [[0,0],[5,0],[8,100],[12,100],[16,0],[T,0]];
  const SPIN = d => [[0,0],[5,0],[8,180*d],[12,360*d],[16,720*d],[T,720*d]];
  const spins = [1,-1,1];

  // inner pieces
  const HL_DX  = [[0,0],[5,0],[8,-135],[12,-135],[16,0],[T,0]];
  const HL_DY  = [[0,0],[5,0],[8,40],[10,70],[12,40],[16,0],[T,0]];
  const HL_ROT = [[0,0],[5,0],[8,-30],[12,-80],[16,0],[T,0]];
  const HEAD_DY= [[0,0],[5,0],[8,-205],[10,-225],[12,-205],[16,0],[T,0]];
  const HEAD_S = [[0,1],[5,1],[8,1],[10,1.22],[12,1],[T,1]];
  const VEE_DY = [[0,0],[5,0],[8,185],[10,165],[12,185],[16,0],[T,0]];
  const VEE_ROT= [[0,0],[5,0],[8,0],[12,180],[16,360],[T,360]];
  const MINI_DX= [[0,0],[5,0],[8,-37],[16,0],[T,0]];
  const MINI_DY= [[0,0],[5,0],[8,-20],[16,0],[T,0]];
  const MINI_S = [[0,1],[5,1],[8,2.4],[9,2.0],[10.2,2.7],[11.2,2.0],[12,2.4],[16,1],
                  [16.5,1.25],[16.9,1],[17.25,1.2],[17.7,1],[T,1]];

  const $ = id => document.getElementById(id);
  const world = $('world'), inner = $('inner'), halfL=$('halfL'), halfR=$('halfR'),
        vee=$('vee'), head=$('head'), mini=$('mini'), v1=$('v1'), v2=$('v2'), mh=$('miniHeart');

  function mix(a,b,u){ return a.map((x,i)=>Math.round(x+(b[i]-x)*u)); }
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  function render(t){
    const gs = K(G_SCALE, t);
    world.setAttribute('transform', `translate(${CX} ${CY}) scale(${gs}) translate(${-CX} ${-CY})`);

    // outer segments
    const o = K(ORBIT,t), r = K(RADIAL,t);
    segs.forEach((s,i)=>{
      const sp = K(SPIN(spins[i]), t);
      const tx = Math.sin(rad(s.mid))*r, ty = -Math.cos(rad(s.mid))*r;
      s.el.setAttribute('transform',
        `rotate(${o} ${CX} ${CY}) translate(${tx} ${ty}) rotate(${sp} ${s.pivot[0]} ${s.pivot[1]})`);
    });

    // inner twist
    const phi = K(TWIST,t), dip = K(TWIST_DIP,t);
    const sx = Math.cos(rad(phi)) * (1-dip);
    inner.setAttribute('transform', `translate(${CX} 0) scale(${sx} ${1-dip*.5}) translate(${-CX} 0)`.replace('scale('+sx+' ', 'scale('+(Math.abs(sx)<0.002?0.002*Math.sign(sx||1):sx)+' '));

    // heart halves
    const hx = K(HL_DX,t), hy = K(HL_DY,t), hr = K(HL_ROT,t);
    halfL.setAttribute('transform', `translate(${hx} ${hy}) rotate(${hr} 290 410)`);
    halfR.setAttribute('transform', `translate(${-hx} ${hy}) rotate(${-hr} 460 410)`);

    // head
    const hs = K(HEAD_S,t);
    head.setAttribute('transform',
      `translate(0 ${K(HEAD_DY,t)}) translate(374 280) scale(${hs}) translate(-374 -280)`);

    // V lines
    vee.setAttribute('transform', `translate(0 ${K(VEE_DY,t)}) rotate(${K(VEE_ROT,t)} 375 470)`);
    const detach = Math.min(1, Math.max(0, r/100));
    const veeCol = rgb(mix(WHITE, NAVY, E.io(Math.min(1, detach*2.5))));
    v1.setAttribute('stroke', veeCol); v2.setAttribute('stroke', veeCol);

    // small heart
    const ms = K(MINI_S,t);
    mini.setAttribute('transform', `translate(${412 + K(MINI_DX,t)} ${395 + K(MINI_DY,t)}) scale(${ms})`);
    mh.setAttribute('fill', veeCol);
  }

  // ---- loop / controls ------------------------------------------------
  let paused = false, t0 = performance.now(), tPause = 0;
  window.__render = render;           // for testing
  function frame(now){
    if (!paused) render(((now - t0)/1000) % T);
    requestAnimationFrame(frame);
  }
  if (!window.__noLoop) requestAnimationFrame(frame);

  // Full screen: browsers only allow it from a click or key press, so the
  // first click anywhere (or F) switches it on; click again or Esc to leave.
  function toggleFs(){
    const el = document.documentElement;
    if (!document.fullscreenElement) { el.requestFullscreen && el.requestFullscreen().catch(()=>{}); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  }
  document.addEventListener('fullscreenchange', ()=> document.body.classList.toggle('fs', !!document.fullscreenElement));
  document.addEventListener('click', e=>{ if (e.target.closest && e.target.closest('#back')) return; toggleFs(); });
  document.addEventListener('keydown', e=>{
    if (e.key==='b'||e.key==='B'){ document.body.classList.toggle('dark'); }
    if (e.key==='f'||e.key==='F'){ toggleFs(); }
    if (e.key===' '){ e.preventDefault();
      if (!paused){ paused = true; tPause = performance.now(); }
      else { paused = false; t0 += performance.now() - tPause; } }
  });
  let idleTimer;
  function wake(){ document.body.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>document.body.classList.add('idle'), 2500); }
  document.addEventListener('mousemove', wake); wake();

  // ---- keep the screen awake -------------------------------------------
  // Screen Wake Lock: stops the display dimming or sleeping while this page
  // is open and visible. The browser drops it when the tab is hidden, so it
  // is asked for again whenever the page comes back (or on a click / key).
  let lock = null;
  const awakeEl = $('awake');
  function showAwake(){
    awakeEl.textContent = lock ? 'Screen will stay awake'
      : ('wakeLock' in navigator ? 'Screen may sleep: click to retry' : 'This browser cannot stop the screen sleeping');
  }
  async function keepAwake(){
    if (!('wakeLock' in navigator) || lock || document.visibilityState !== 'visible') { showAwake(); return; }
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', ()=>{ lock = null; showAwake(); });
    } catch (e) { lock = null; }
    showAwake();
  }
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible') keepAwake(); });
  ['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, keepAwake, {passive:true}));
  keepAwake();
})();
</script>
</body>
</html>
