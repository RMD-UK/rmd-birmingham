name: Deploy to Firebase Hosting

# Runs whenever main is pushed (e.g. via GitHub Desktop) and publishes the
# site to Firebase Hosting — this replaces GitHub Pages' "push = live"
# behaviour once rmd.uk.com's DNS points at Firebase instead of GitHub.
#
# Requires one repo secret, added under Settings > Secrets and variables >
# Actions on GitHub.com (has to be done there, not from this workflow file):
#   FIREBASE_SERVICE_ACCOUNT_RMD_INSTRUCTOR_WEEKEND
#     — a Firebase service account key (JSON) for the rmd-instructor-weekend
#       project, with the "Firebase Hosting Admin" role.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stop the deploy if a merge conflict was left in a page or function file
      # (raw <<<<<<< markers on a live page, as happened on 2026-10-10 and
      # nearly again on 2026-10-13). The deploy only runs if this passes.
      - name: Check for leftover merge conflict markers
        run: |
          if grep -rEn '^(<<<<<<<|>>>>>>>) ' --include='*.html' --include='*.js' --include='*.json' --include='*.rules' --include='*.yml' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Merge conflict markers found in the files above. Fix them and push again. Nothing was deployed."
            exit 1
          fi
          echo "No conflict markers found."

      # Writes version.json so version.html can show what is live and when.
      - name: Write version stamp
        run: |
          printf '{"sha":"%s","message":%s,"builtAt":"%s","run":"%s"}\n' \
            "${GITHUB_SHA}" \
            "$(git log -1 --pretty=%s | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_RUN_NUMBER}" > version.json
          cat version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RMD_INSTRUCTOR_WEEKEND }}'
          projectId: rmd-instructor-weekend
          channelId: live
