<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <img src="assets/rmd-logo.png" alt="RMD logo" class="login-logo">
    <h1 class="login-title">RMD Birmingham</h1>
    <p class="login-subtitle">Reset your password</p>

    <div id="checkingView">
      <p style="text-align:center;color:var(--rmd-muted);">Checking your link…</p>
    </div>

    <div id="errorView" style="display:none;">
      <p style="color:var(--rmd-warn);font-size:14px;text-align:center;" id="errorMessage"></p>
      <p style="text-align:center;margin-top:12px;">
        <a href="signin.html" style="font-size:13px;color:var(--rmd-blue);text-decoration:underline;">Back to sign in</a>
      </p>
    </div>

    <div id="formView" style="display:none;">
      <p style="text-align:center;font-size:13px;color:var(--rmd-muted);margin-bottom:14px;" id="forEmail"></p>
      <form class="login-form" onsubmit="submitNewPassword(event)">
        <input class="form-input" type="password" id="newPassword" placeholder="New password" required autocomplete="new-password" minlength="6">
        <input class="form-input" type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn-login" id="submitBtn">Set new password</button>
      </form>
      <p id="formError" style="color:var(--rmd-warn);font-size:13px;margin-top:10px;display:none;"></p>
    </div>

    <div id="successView" style="display:none;">
      <p style="text-align:center;color:#1a6e31;font-size:14px;">Password updated — you can sign in now.</p>
      <p style="text-align:center;margin-top:14px;">
        <a href="signin.html" class="btn-login" style="display:inline-block;text-decoration:none;">Go to sign in</a>
      </p>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // This page exists because Firebase's own default password-reset action
  // handler embeds whatever API key was registered against this project's
  // Web App at the time, and that value has been stuck on a long-deleted
  // key since the 2026-09-21 incident (confirmed 2026-09-27 — Firebase
  // Console → Project Settings → General still shows the dead original
  // key, with no edit control there to change it). Reset emails now point
  // here instead (set via Firebase Console → Authentication → Templates →
  // Password reset → Customize action URL), and this page performs the
  // actual reset itself via a direct REST call using whatever key is
  // currently live in js/firebase-config.js — the one we can actually
  // rotate and keep working, rather than the one Firebase bakes into its
  // own links.

  const params  = new URLSearchParams(window.location.search);
  const mode    = params.get("mode");
  const oobCode = params.get("oobCode");

  const checkingView = document.getElementById("checkingView");
  const errorView    = document.getElementById("errorView");
  const formView     = document.getElementById("formView");
  const successView  = document.getElementById("successView");
  const errorMessage = document.getElementById("errorMessage");
  const forEmail     = document.getElementById("forEmail");
  const formError    = document.getElementById("formError");

  function showOnly(view) {
    [checkingView, errorView, formView, successView].forEach(v => {
      v.style.display = (v === view ? "block" : "none");
    });
  }

  function friendlyError(code) {
    switch (code) {
      case "EXPIRED_OOB_CODE": return "This reset link has expired — request a new one from the sign-in page.";
      case "INVALID_OOB_CODE": return "This reset link is invalid or has already been used — request a new one from the sign-in page.";
      case "USER_DISABLED":    return "This account has been disabled — contact RMD directly.";
      case "WEAK_PASSWORD":    return "Please choose a password of at least 6 characters.";
      default:                 return "Something went wrong — try requesting a new reset link, or contact RMD directly.";
    }
  }

  async function verifyCode() {
    if (mode !== "resetPassword" || !oobCode) {
      errorMessage.textContent = "This link is missing some information — request a new reset link from the sign-in page.";
      showOnly(errorView);
      return;
    }
    try {
      const res = await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=${FIREBASE_CONFIG.apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oobCode })
        }
      );
      const data = await res.json();
      if (data.error) {
        errorMessage.textContent = friendlyError(data.error.message);
        showOnly(errorView);
        return;
      }
      forEmail.textContent = `Setting a new password for ${data.email}`;
      showOnly(formView);
    } catch (err) {
      errorMessage.textContent = "Something went wrong checking your link — try again, or contact RMD directly.";
      showOnly(errorView);
    }
  }

  async function submitNewPassword(e) {
    e.preventDefault();
    const pw  = document.getElementById("newPassword").value;
    const pw2 = document.getElementById("confirmPassword").value;
    formError.style.display = "none";

    if (pw.length < 6) {
      formError.textContent = "Password must be at least 6 characters.";
      formError.style.display = "block";
      return;
    }
    if (pw !== pw2) {
      formError.textContent = "Passwords don't match.";
      formError.style.display = "block";
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const res = await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=${FIREBASE_CONFIG.apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oobCode, newPassword: pw })
        }
      );
      const data = await res.json();
      if (data.error) {
        formError.textContent = friendlyError(data.error.message);
        formError.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Set new password";
        return;
      }
      showOnly(successView);
    } catch (err) {
      formError.textContent = "Something went wrong — try again, or contact RMD directly.";
      formError.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Set new password";
    }
  }

  verifyCode();
</script>

</body>
</html>
