<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <img src="assets/rmd-logo.png" alt="RMD logo" class="login-logo">
    <h1 class="login-title">RMD Birmingham</h1>
    <p class="login-subtitle">Reset your password</p>

    <div id="checkingView">
      <p style="text-align:center;color:var(--rmd-muted);">Checking your link…</p>
    </div>

    <div id="errorView" style="display:none;">
      <p style="color:var(--rmd-warn);font-size:14px;text-align:center;" id="errorMessage"></p>
      <p style="text-align:center;margin-top:12px;">
        <a href="signin.html" style="font-size:13px;color:var(--rmd-blue);text-decoration:underline;">Back to sign in</a>
      </p>
    </div>

    <div id="formView" style="display:none;">
      <p style="text-align:center;font-size:13px;color:var(--rmd-muted);margin-bottom:14px;" id="forEmail"></p>
      <form class="login-form" onsubmit="submitNewPassword(event)">
        <input class="form-input" type="password" id="newPassword" placeholder="New password" required autocomplete="new-password" minlength="6">
        <input class="form-input" type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn-login" id="submitBtn">Set new password</button>
      </form>
      <p id="formError" style="color:var(--rmd-warn);font-size:13px;margin-top:10px;display:none;"></p>
    </div>

    <div id="successView" style="display:none;">
      <p style="text-align:center;color:#1a6e31;font-size:14px;">Password updated — you can sign in now.</p>
      <p style="text-align:center;margin-top:14px;">
        <a href="signin.html" class="btn-login" style="display:inline-block;text-decoration:none;">Go to sign in</a>
      </p>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // This page exists because Firebase's own password-reset link system
  // (both the client REST sendOobCode flow AND admin.auth()
  // .generatePasswordResetLink()) bakes in this project's "default" Web
  // API Key -- a value stuck on a key deleted 2026-09-21, with no fix
  // available anywhere in Firebase Console (confirmed 2026-09-27: no edit
  // control on Project Settings -> General's Web API Key field, and
  // Authentication -> Templates -> Password reset -> Customize action URL
  // fails to save with a generic error, across browsers). So this page
  // doesn't use Firebase's oobCode mechanism at all -- it reads a token
  // minted by our own requestSelfServiceResetLink Cloud Function (see
  // functions/index.js) and verifies/confirms via our own
  // verifySelfServiceResetToken / confirmSelfServiceResetToken callables,
  // which set the password directly through the Admin SDK.

  initFirebase();
  const fns = firebase.functions();

  const params = new URLSearchParams(window.location.search);
  const token  = params.get("token");

  const checkingView = document.getElementById("checkingView");
  const errorView    = document.getElementById("errorView");
  const formView     = document.getElementById("formView");
  const successView  = document.getElementById("successView");
  const errorMessage = document.getElementById("errorMessage");
  const forEmail     = document.getElementById("forEmail");
  const formError    = document.getElementById("formError");

  function showOnly(view) {
    [checkingView, errorView, formView, successView].forEach(v => {
      v.style.display = (v === view ? "block" : "none");
    });
  }

  function friendlyError(err) {
    const code = (err && err.message) || (err && err.code) || "";
    switch (code) {
      case "TOKEN_EXPIRED":       return "This reset link has expired — request a new one from the sign-in page.";
      case "TOKEN_ALREADY_USED":  return "This reset link has already been used — request a new one from the sign-in page.";
      case "INVALID_TOKEN":       return "This reset link is invalid — request a new one from the sign-in page.";
      default:                    return "Something went wrong — try requesting a new reset link, or contact RMD directly.";
    }
  }

  async function verifyToken() {
    if (!token) {
      errorMessage.textContent = "This link is missing some information — request a new reset link from the sign-in page.";
      showOnly(errorView);
      return;
    }
    try {
      const res = await fns.httpsCallable("verifySelfServiceResetToken")({ token });
      forEmail.textContent = `Setting a new password for ${res.data.email}`;
      showOnly(formView);
    } catch (err) {
      errorMessage.textContent = friendlyError(err);
      showOnly(errorView);
    }
  }

  async function submitNewPassword(e) {
    e.preventDefault();
    const pw  = document.getElementById("newPassword").value;
    const pw2 = document.getElementById("confirmPassword").value;
    formError.style.display = "none";

    if (pw.length < 6) {
      formError.textContent = "Password must be at least 6 characters.";
      formError.style.display = "block";
      return;
    }
    if (pw !== pw2) {
      formError.textContent = "Passwords don't match.";
      formError.style.display = "block";
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      await fns.httpsCallable("confirmSelfServiceResetToken")({ token, newPassword: pw });
      showOnly(successView);
    } catch (err) {
      formError.textContent = friendlyError(err);
      formError.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Set new password";
    }
  }

  verifyToken();
</script>

</body>
</html>
