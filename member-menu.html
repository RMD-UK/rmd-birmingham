<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #F5F7FA; font-family: var(--font); margin: 0; padding: 0 0 70px; color: var(--rmd-text); }

    /* ── Top bar (matches site-info.html) ── */
    .top-bar {
      background: var(--rmd-navy); color: white; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .top-bar img { height: 32px; border-radius: 50%; background: white; }
    .top-bar-title { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.2; }
    .top-bar-sub   { font-size: 11px; font-weight: 400; opacity: 0.7; display: block; }
    .role-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.18); color: white; letter-spacing: 0.02em;
    }
    .top-bar-signout {
      background: none; border: 1px solid rgba(255,255,255,0.35); color: white;
      font-size: 12px; font-family: var(--font); padding: 5px 10px; border-radius: 6px; cursor: pointer;
    }
    .top-bar-signout:hover { background: rgba(255,255,255,0.12); }

    /* ── Welcome banner ── */
    .welcome-banner {
      background: linear-gradient(135deg, var(--rmd-navy) 0%, var(--rmd-blue) 100%);
      color: white; padding: 20px 16px 24px;
    }
    .welcome-inner { max-width: 760px; margin: 0 auto; }
    .welcome-name { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
    .welcome-sub  { font-size: 13px; opacity: 0.78; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 0; }
    .hidden { display: none !important; }

    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--rmd-muted); margin: 22px 0 8px;
    }
    .section-label:first-child { margin-top: 4px; }
    .subhead { font-size: 12px; font-weight: 800; color: var(--rmd-muted); margin: 18px 0 8px; }

    /* ── This week strip ── */
    .strip {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--rmd-light); border-radius: 12px; padding: 12px 14px; margin: 0 0 6px;
      text-decoration: none; color: var(--rmd-text);
    }
    .strip b { color: var(--rmd-navy); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; }
    .strip span { font-size: 14px; font-weight: 600; }
    .strip:hover { box-shadow: 0 3px 10px rgba(68,36,124,0.15); }

    /* ── Cards ── */
    .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card {
      background: white; border: 1px solid #E2E8ED; border-radius: 14px;
      display: flex; align-items: stretch; gap: 0; position: relative;
    }
    .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
    .card-main {
      flex: 1; display: flex; align-items: center; gap: 14px; padding: 16px; text-decoration: none; color: inherit;
      min-width: 0; border-radius: 14px;
    }
    .card-icon  { font-size: 26px; flex-shrink: 0; }
    .card-text  { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 800; color: var(--rmd-navy); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-sub   { font-size: 12px; color: var(--rmd-muted); margin-top: 2px; }
    .card-arrow { font-size: 20px; color: var(--rmd-muted); }
    .card.pin { border: 2px solid var(--rmd-navy); }
    .card.pin .card-icon { font-size: 30px; }
    .card-side {
      align-self: center; margin-right: 10px; font-size: 12px; font-weight: 700; color: var(--rmd-blue);
      text-decoration: none; padding: 6px 10px; border: 1px solid #D5DEE8; border-radius: 8px; white-space: nowrap;
    }
    .card-side:hover { background: #F2F6FA; }
    .tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; background: var(--rmd-light); color: var(--rmd-navy); padding: 2px 7px; border-radius: 99px; }
    .count { font-size: 11px; font-weight: 800; background: var(--rmd-warn); color: #fff; padding: 2px 8px; border-radius: 99px; }

    /* Director / faculty tools use a filled variant to stand apart visually */
    .card.is-admin { background: var(--rmd-navy); border-color: var(--rmd-navy); }
    .card.is-admin .card-title { color: white; }
    .card.is-admin .card-sub   { color: rgba(255,255,255,0.72); }
    .card.is-admin .card-arrow { color: rgba(255,255,255,0.5); }
    .card.is-admin .tag { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── Group tiles on Home ── */
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .tile {
      background: white; border: 1px solid #E2E8ED; border-radius: 16px; padding: 18px 16px;
      text-align: left; font-family: var(--font); cursor: pointer; display: block; color: inherit; text-decoration: none;
      min-height: 92px;
    }
    .tile:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.08); border-color: #CBB9E8; }
    .tile em { font-style: normal; }
    .tile b { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 17px; font-weight: 800; color: var(--rmd-navy); }
    .tile span { display: block; font-size: 13px; color: var(--rmd-muted); margin-top: 4px; }
    .tile .n { font-size: 12px; font-weight: 700; color: var(--rmd-muted); }
    .tile.me { background: var(--rmd-light); border: 2px solid var(--rmd-navy); }
    .tile.me span { color: var(--rmd-text); }
    .tile.is-admin { background: var(--rmd-navy); border-color: var(--rmd-navy); }
    .tile.is-admin b { color: #fff; }
    .tile.is-admin span, .tile.is-admin .n { color: rgba(255,255,255,0.72); }

    /* ── Group page ── */
    .crumb { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
    .crumb h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--rmd-navy); }
    .back {
      border: 1.5px solid #D5DEE8; background: #fff; border-radius: 10px; padding: 8px 12px;
      font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--rmd-navy); cursor: pointer; white-space: nowrap;
    }
    .back:hover { background: #F2F6FA; }
    .group-line { color: var(--rmd-muted); font-size: 13px; margin: 0 0 14px; }
    .foot { margin: 28px 0 0; padding-top: 14px; border-top: 1px solid var(--rmd-border); font-size: 13px; }
    .foot a { color: var(--rmd-blue); font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--rmd-blue); outline-offset: 2px; }

    /* Screen saver link, bottom right (2026-10-08, per Jon) */
    .screensaver-btn {
      position: fixed; right: 14px; bottom: 14px; z-index: 90;
      background: var(--rmd-navy); color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px;
      box-shadow: 0 3px 10px rgba(0,0,0,.3); opacity: .92;
    }
    .screensaver-btn:hover, .screensaver-btn:focus-visible { opacity: 1; background: var(--rmd-blue); }
  </style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="top-bar">
  <img src="assets/rmd-logo.png" alt="RMD logo">
  <div class="top-bar-title">
    RMD Birmingham
    <span class="top-bar-sub">Members</span>
  </div>
  <span class="role-pill" id="rolePill">Loading…</span>
  <button class="top-bar-signout" onclick="handleSignOut()">Sign out</button>
</div>

<!-- ── Welcome banner ── -->
<div class="welcome-banner">
  <div class="welcome-inner">
    <div class="welcome-name" id="welcomeName">Welcome</div>
    <div class="welcome-sub">Your quick links are below.</div>
  </div>
</div>

<div class="wrap" id="view"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  initFirebase();

  // Mirrors ROLE_LABELS in timetable.html / attendance.html / site-info.html —
  // kept in sync manually since it isn't shared via firebase-config.js.
  // Role taxonomy finalised 2026-07-11 (Jon) — see the longer comment in
  // site-info.html for the two-track (instructor / assessor) explanation.
  // 2026-10-28 (Jon): outside the Instructor Weekend pages, "Instructor Candidate" is just "Instructor".
  const ROLE_LABELS = {
    director:            "Course Director",
    faculty:             "Faculty",
    "full-instructor":   "Instructor Trainer",
    instructor:          "Instructor",
    assessor:            "Assessor / Senior Instructor",
    "assessor-faculty":  "Assessor Faculty",
    itc:                 "Instructor Trainer Candidate"
  };

  /* ────────────────────────────────────────────────────────────────────────
     Menu layout, 28 Oct 2026 (Jon): Home plus drill-down.
     Home shows a "this week" line, the two most used cards, and a tile per
     group. A tile opens its own group page (#evening, #people ...) so the
     phone Back button works. Every card keeps the visibility rule it had in
     the old single-list menu; the only new rule is menuAssessor (below).
     ──────────────────────────────────────────────────────────────────────── */
  const GROUPS = [
    { id: "me",        name: "Me",                 line: "Your account, your forms and site feedback" },   // first tile and highlighted (Jon, 28 Oct 2026)
    { id: "evening",   name: "Evening courses",    line: "Teaching nights and assessment night" },
    { id: "people",    name: "People and faculty", line: "Directory and instructor development" },
    { id: "resources", name: "Resources",          line: "Guidelines, videos and guides" },
    { id: "tools",     name: "Director tools",     line: "Directors only" }   // renamed "Faculty tools" for non-Directors
  ];

  // c = { role, studentFac, seniorFac, menuAssessor }
  const isDir  = c => c.role === "director";
  const isSF   = c => c.studentFac || c.seniorFac;
  const isFacultyTools = c => isDir(c) || c.role === "faculty" || c.role === "assessor-faculty";

  const CARDS = [
    // ── Evening courses ──
    { id: "phase1HubLink", g: "evening", pin: true, admin: true, icon: "✅", title: "Monday Night Hub",
      text: "Register, assessment night, retests and the results",
      href: () => "phase1.html", show: () => true },
    { id: "courseRostersLink", g: "evening", pin: true, icon: "🚪", title: "Current course",
      text: c => (isDir(c) || isSF(c)) ? "Who is in which room, instructor teams and assessments. You can edit" : "Who is in which room, instructor teams and assessments. View only, find anyone by name",
      href: c => (isDir(c) || isSF(c)) ? "course-roster-edit.html" : "course-roster-view.html",
      side: c => (isDir(c) || isSF(c)) ? { label: "View only", href: "course-roster-view.html" } : null,
      tag: c => (isDir(c) || isSF(c)) ? "Edit" : "",
      show: () => true },
    { id: "opisRatingLink", g: "evening", icon: "📝", title: "OPIS candidate rating",
      text: "Score a candidate you've taught on Communication, Attitude, Feedback and Punctuality",
      href: () => "opis-rating.html",
      // Assessors do not teach the Monday sessions, so no OPIS card (Jon, 28 Oct 2026). Directors and
      // Student/Senior Faculty always keep it. Not set = shown, so nobody loses it by mistake.
      show: c => !(c.menuAssessor && !(isDir(c) || isSF(c))) },
    { id: "assessmentResultsLink", g: "evening", icon: "📊", title: "Assessment results",
      text: "Pass rates, retests and who has passed. Directors and Senior Faculty also see assessor comments",
      href: () => "assessment-results.html", show: c => isDir(c) || isSF(c) },
    { id: "commsLink", g: "evening", icon: "✉", title: "Comms",
      text: "Email a group: first year candidates by course, assessors, instructors, faculty",
      href: () => "admin-comms.html", show: c => isDir(c) || isSF(c) },

    // ── People and faculty ──
    { id: "facultyDirLink", g: "people", icon: "👥", title: "Faculty directory",
      text: "RMD Student Faculty and Senior Faculty, in two tabs",
      href: () => "faculty.html?group=student&from=members", show: () => true },
    { id: "sfrLink", g: "people", icon: "📝", title: "Senior Faculty review and future plans",
      text: "Annual reflection and plans for next academic year",
      href: () => "senior-faculty-review.html", show: c => isDir(c) && c.sfrOpen },   // Director only, and only while the review window is open (config/senior_faculty_review_window)
    { id: "instructorReviewLink", g: "people", icon: "🔎", title: "Instructor potential review",
      text: "EOI details, OPIS scores and assessment outcome together, per candidate",
      href: () => "admin-instructor-review.html", show: isDir },
    { id: "ipFormsLink", g: "people", icon: "📄", title: "Instructor potential forms",
      text: "Fill RCUK's IP form in bulk for candidates who passed",
      href: () => "admin-ip-forms.html", show: isDir },

    // ── Resources ──
    { id: "resourcesLink", g: "resources", icon: "📚", title: "Resources",
      text: "QCPR app, guidelines, RCUK Lifesaver, videos, provider courses",
      href: () => "member-resources.html", show: () => true },
    { id: "nightGuideLink", g: "resources", icon: "✅", title: "Assessment night guide",
      text: "Who does what on the assessment evening",
      href: () => "resources/instructor-guide/2-assessment-evening-roles.html", show: () => true },
    { id: "instructorGuideLink", g: "resources", icon: "🗓", title: "Instructor guide",
      text: "Timeline, teaching structure, admin, support and FAQs",
      href: () => "resources/instructor-guide/1-timeline-teaching-structure.html", show: () => true },

    // ── Me ──
    { id: "myAccountLink", g: "me", icon: "🪪", title: "My account",
      text: "Preferred name and legal (passport) name",
      href: () => "my-account.html", show: () => true },
    { id: "mouLink", g: "me", icon: "📜", title: "Memorandum of Understanding",
      text: "Submit or review your annual MOU", href: () => "mou-form.html", show: () => true },
    { id: "siteFeedbackLink", g: "me", icon: "💬", title: "Site feedback",
      text: "Something broken, awkward or missing? Tell us in four taps",
      href: () => "feedback.html", show: () => true },

    // ── Director / faculty tools (Courses and admin first, Instructor Weekend last: Jon, 28 Oct 2026) ──
    { id: "courseAllocationLink", g: "tools", sub: "Courses and admin", admin: true, icon: "🔀", title: "Course allocation",
      text: "Move people to a new course, check eligibility and rooms",
      href: () => "course-allocation.html", show: isDir },
    { id: "stage1CandidatesLink", g: "tools", sub: "Courses and admin", admin: true, icon: "🧑‍🎓", title: "First year candidates",
      text: "Add and edit candidate records",
      href: () => "admin-stage1-candidates.html", show: isDir },
    { id: "globalToolsLink", g: "tools", sub: "Courses and admin", admin: true, icon: "🌐", title: "Global admin tools",
      text: "MOU, bulk accounts, account reminders, faculty roster",
      href: () => "admin-global-tools.html", show: isDir },
    { id: "feedbackInboxLink", g: "tools", sub: "Courses and admin", admin: true, icon: "📥", title: "Site feedback inbox",
      text: "Read, sort and tick off what the team has sent",
      href: () => "admin-feedback.html", count: true, show: isDir },
    { id: "badgeTemplatesLink", g: "tools", sub: "Instructor Weekend", admin: true, icon: "🪪", title: "Print badge templates",
      text: "Blank Candidate / Faculty name badges, no roster needed",
      href: () => "iw-badges.html", show: isFacultyTools },
    { id: "checkinPosterLink", g: "tools", sub: "Instructor Weekend", admin: true, icon: "📱", title: "Check-in poster",
      text: "QR poster for self-service attendee check-in",
      href: () => "iw-checkin-poster.html", target: "_blank", show: isFacultyTools },
    { id: "iwDirLink", g: "tools", sub: "Instructor Weekend", admin: true, icon: "📋", title: "RMD Instructor Weekend",
      text: "Course info, timetable and session guides",
      href: () => "site-info.html?role=director", show: isDir },
    { id: "cdDashboardLink", g: "tools", sub: "Instructor Weekend", admin: true, icon: "🛠", title: "Course Director dashboard",
      text: "Instructor Weekend 2026: registrations, rooms, assessments",
      href: () => "cd-dashboard.html", show: isDir }
  ];

  const ctx = { role: null, studentFac: false, seniorFac: false, menuAssessor: false, sfrOpen: false };
  let weekEvent = null;      // { diff, dt, label, name } or null
  let feedbackNew = null;    // number or null

  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const val = (v, c) => typeof v === "function" ? v(c) : v;
  const cardsFor = gid => CARDS.filter(k => k.g === gid && k.show(ctx));
  const visibleGroups = () => GROUPS.filter(g => cardsFor(g.id).length);
  const groupName = g => (g.id === "tools" && !isDir(ctx)) ? "Faculty tools" : g.name;
  const groupLine = g => (g.id === "tools" && !isDir(ctx)) ? "Tools for Instructor Weekend faculty" : g.line;
  const countText = () => feedbackNew == null || feedbackNew === 0 ? "" : (feedbackNew >= 100 ? "99+" : String(feedbackNew));

  function cardHtml(k) {
    const side = k.side ? k.side(ctx) : null;
    const tag = k.tag ? k.tag(ctx) : "";
    const cnt = k.count ? countText() : "";
    return `<div class="card${k.admin ? " is-admin" : ""}${k.pin ? " pin" : ""}" id="${k.id}">
      <a class="card-main" href="${esc(k.href(ctx))}"${k.target ? ` target="${k.target}" rel="noopener"` : ""}>
        <div class="card-icon">${k.icon}</div>
        <div class="card-text">
          <div class="card-title">${esc(k.title)}${tag ? ` <span class="tag">${esc(tag)}</span>` : ""}${cnt ? ` <span class="count" data-count="1">${cnt} new</span>` : ""}</div>
          <div class="card-sub">${esc(val(k.text, ctx))}</div>
        </div>
        <div class="card-arrow">›</div>
      </a>${side ? `<a class="card-side" href="${esc(side.href)}">${esc(side.label)}</a>` : ""}
    </div>`;
  }

  function cardsBlock(list) {
    if (!list.some(k => k.sub)) return `<div class="cards">${list.map(cardHtml).join("")}</div>`;
    const subs = []; list.forEach(k => { if (!subs.includes(k.sub)) subs.push(k.sub); });
    return subs.map(s => `<p class="subhead">${esc(s)}</p><div class="cards">${list.filter(k => k.sub === s).map(cardHtml).join("")}</div>`).join("");
  }

  const footHtml = `<div class="foot"><a href="mailto:colmds-c-rmdbirmingham@adf.bham.ac.uk">Contact RMD Birmingham</a> &middot; general enquiries, monitored year-round</div>`;

  function stripHtml() {
    if (!weekEvent) return "";
    const e = weekEvent;
    const when = e.diff === 0 ? "Tonight" : e.diff === 1 ? "Tomorrow"
      : e.dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
    return `<a class="strip" id="weekStrip" href="phase1.html"><b>This week</b><span>${esc(when)}: ${esc(e.name)}, ${esc(e.label)}</span></a>`;
  }

  function nextEvent(courses) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let best = null;
    (courses || []).forEach(c => {
      if (!c || !c.name || !c.date || /^test/i.test(c.name)) return;   // real and test never mix
      const p = String(c.date).split("-").map(Number);
      if (p.length !== 3 || !p[0]) return;
      // The stored date is the assessment night. Teaching nights are 14 and 7 days earlier.
      [[-14, "first teaching night"], [-7, "second teaching night"], [0, "assessment night"]].forEach(([off, label]) => {
        const dt = new Date(p[0], p[1] - 1, p[2] + off);
        const diff = Math.round((dt - today) / 86400000);
        if (diff >= 0 && diff <= 7 && (!best || diff < best.diff)) best = { diff, dt, label, name: c.name };
      });
    });
    return best;
  }

  function render() {
    const root = document.getElementById("view");
    if (!ctx.role) { root.innerHTML = ""; return; }
    const vis = visibleGroups();
    const key = (location.hash || "").replace(/^#/, "");
    const g = vis.find(x => x.id === key);
    if (!g) {
      const pins = CARDS.filter(k => k.pin && k.show(ctx));
      root.innerHTML = `${stripHtml()}
        <div class="section-label">Use most</div>
        <div class="cards">${pins.map(cardHtml).join("")}</div>
        <div class="section-label">Everything else</div>
        <div class="tiles">${vis.map(x => {
          const n = cardsFor(x.id).length;
          const cnt = x.id === "tools" && countText() ? ` <span class="count" data-count="1">${countText()} new</span>` : "";
          return `<a class="tile${x.id === "tools" ? " is-admin" : x.id === "me" ? " me" : ""}" href="#${x.id}" id="tile-${x.id}"><b><em>${esc(groupName(x))}${cnt}</em><small class="n">${n}</small></b><span>${esc(groupLine(x))}</span></a>`;
        }).join("")}</div>
        ${footHtml}`;
      return;
    }
    root.innerHTML = `<div class="crumb"><button type="button" class="back" id="backBtn">&lsaquo; Menu</button><h2>${esc(groupName(g))}</h2></div>
      <p class="group-line">${esc(groupLine(g))}</p>${cardsBlock(cardsFor(g.id))}${footHtml}`;
    document.getElementById("backBtn").onclick = () => { location.hash = ""; };
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  auth.onAuthStateChanged(async function (user) {
    if (!user) {
      window.location.href = "signin.html";
      return;
    }

    let role = "instructor";
    let studentFac = false;
    let seniorFac = false;
    try {
      const email = user.email || "";
      const [resolvedRole, sf, snf] = await Promise.all([
        resolveRole(user.uid, email),
        isStudentFaculty(email),
        isSeniorFaculty(email)
      ]);
      role = resolvedRole || role;
      studentFac = sf;
      seniorFac = snf;
    } catch (e) { /* fall back to default role */ }

    let roleLabel = null;
    let menuAssessor = false;
    try {
      const snap = await db.collection(COLLECTIONS.people).doc(user.uid).get();
      if (snap.exists) {
        const data = snap.data();
        if (data.name) {
          document.getElementById("welcomeName").textContent = `Welcome, ${data.name.split(" ")[0]}`;
        }
        if (data.roleLabel) roleLabel = data.roleLabel;
        menuAssessor = data.menuAssessor === true;   // set by a Director; hides the OPIS card only
      }
    } catch (e) { /* keep generic welcome */ }

    ctx.role = role; ctx.studentFac = studentFac; ctx.seniorFac = seniorFac; ctx.menuAssessor = menuAssessor;
    document.getElementById("rolePill").textContent =
      customRoleLabel(roleLabel) || (menuAssessor && !isDir(ctx) && !isSF(ctx) ? "Assessor" : null) || ROLE_LABELS[role] || role;
    render();

    // Loaded after the menu is on screen so they never slow it down.
    try {
      const snap = await db.collection("config").doc("stage1_course_dates").get();
      weekEvent = nextEvent(snap.exists ? (snap.data().courses || []) : []);
      if (weekEvent) render();
    } catch (e) { /* no strip */ }
    if (isDir(ctx)) {
      try {
        const w = await db.collection("config").doc("senior_faculty_review_window").get();
        const d = w.exists ? w.data() : {}, today = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/London" });
        if (d.open && d.close && today >= d.open && today <= d.close) { ctx.sfrOpen = true; render(); }
      } catch (e) { /* link stays hidden */ }
      try {
        const s = await db.collection("site_feedback").where("status", "==", "new").limit(100).get();
        feedbackNew = s.size;
        if (feedbackNew) render();
      } catch (e) { /* no count */ }
    }
  });

  function handleSignOut() {
    auth.signOut().then(() => { window.location.href = "index.html"; });
  }
</script>
