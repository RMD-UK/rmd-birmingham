<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tuesday Screen - RMD Birmingham</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--font:'Inter','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f4f6fb;color:#18212f;font-size:15px}
.hidden{display:none!important}
.gate{max-width:560px;margin:80px auto;padding:20px;font-weight:600}
.top{background:#2e1856;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800;margin-right:auto}.top a{color:#d9cff0;font-size:13px;font-weight:700}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #dfe5ef}
.bar select,.btn{border:2px solid #dfe5ef;border-radius:10px;background:#fff;padding:8px 12px;font-family:inherit;font-size:15px;font-weight:700}
.evrow{display:flex;align-items:center;gap:8px;width:100%;min-width:0}.evlbl{font-weight:700;color:#667389}.ribbon{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:1;min-width:0;scrollbar-width:thin}.ribbon button{flex:none;border:2px solid #dfe5ef;border-radius:10px;background:#fff;padding:7px 12px;font-family:inherit;font-size:14px;font-weight:700;color:#18212f;cursor:pointer;white-space:nowrap}.ribbon button small{display:block;font-size:11px;font-weight:600;color:#667389}.ribbon button.on{background:#43237c;border-color:#43237c;color:#fff}.ribbon button.on small{color:#d9cff0}.ribbon button.today{border-color:#43237c}
.seg{display:flex;border:2px solid #dfe5ef;border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:8px 14px;font-weight:700;font-family:inherit;font-size:15px}.seg button.on{background:#eee8f9;color:#43237c}
main{max-width:1500px;margin:0 auto;padding:16px}
.screen{background:#2E1856;color:#fff;border-radius:16px;padding:22px}
.screen .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.screen h2{font-size:22px;font-weight:800}
.screen .clock{font-size:14px;color:#D9CFF0;font-variant-numeric:tabular-nums}
.big{display:flex;align-items:baseline;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
.big .n{font-size:96px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big .of{font-size:24px;color:#D9CFF0;font-weight:700}
.sbar{height:22px;border-radius:11px;background:rgba(255,255,255,.15);overflow:hidden;display:flex;margin-bottom:6px}
.sbar i{display:block;height:100%;transition:width .6s}
.sbar .h{background:#58C07F}.sbar .l{background:#F49001}.sbar .a{background:#E5484D}.sbar .p{background:#58C07F}.sbar .f{background:#E5484D}
.legend{font-size:13px;color:#D9CFF0;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.dotk{display:inline-block;width:11px;height:11px;border-radius:50%;background:#F49001;vertical-align:-1px;margin-right:5px}.dotk.red{background:#E5484D}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.sroom{background:#fff;color:#1A2233;border-radius:14px;padding:14px 14px 12px;min-height:130px;border:3px solid transparent}
.sroom b{display:block;font-size:20px;font-weight:800;color:#44247C;letter-spacing:-.2px}
.sroom .v{margin-top:2px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.sroom .v .hv{font-size:44px;font-weight:800;color:#1A2233}.sroom .v .tv{font-size:24px;font-weight:700;color:#6B7C93;margin-left:2px}
.sroom small{display:block;color:#6B7C93;font-size:13px;font-weight:600;margin-top:2px}
.sroom.done{border-color:#58C07F}.sroom.done .hv{color:#1E8449}.sroom.low{border-color:#F49001}.sroom.low .hv{color:#B35F00}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:14px}
.dots i{display:block;width:14px;height:14px;border-radius:50%;background:#F49001;box-shadow:0 0 0 2px rgba(0,0,0,.08)}.dots i.ab{background:#E5484D}.dots i.gd{background:#58C07F}.dots span{font-size:12px;font-weight:800;color:#B35F00}
.exitfull{display:none;position:fixed;top:14px;right:14px;z-index:20;border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}body.isfull .exitfull{display:block}
.bsn{text-align:center;font-size:14px;opacity:.7;margin-top:16px}
.screen.full{position:fixed;inset:0;z-index:10;overflow:auto;border-radius:0;padding:28px}
.screen.full .big .n{font-size:min(22vw,200px)}
@media(max-width:600px){.big .n{font-size:68px}.big .of{font-size:20px}.sgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sroom{padding:10px;min-height:0}.sroom .v .hv{font-size:32px}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="gate" id="gate"><div id="authMsg">Checking access...</div></div>
<div id="app" class="hidden">
 <div class="top"><h1>Tuesday screen</h1><a href="tuesday.html">Back to the Tuesday hub</a></div>
 <div class="bar"><div class="evrow"><span class="evlbl">Evening</span><div class="ribbon" id="dateRib"></div></div>
  <div class="seg" id="modeSeg"><button type="button" data-m="register" class="on">Register</button><button type="button" data-m="results">Assessment results</button></div>
  <button type="button" class="btn" id="fullBtn">Full screen</button></div>
 <main><div id="msgs"></div><div class="screen" id="screen"></div><button type="button" class="exitfull" id="exitFull">Exit full screen (Esc)</button>
 <div style="font-size:13px;color:#667389;margin-top:8px">Counts only, no names. Updates by itself as each room marks people in.</div></main>
</div>
<script>
initFirebase();
const TROOMS=["CM02","CM03","CM04","CM06","CM07"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const S={mode:"register",date:null,nurses:[],rooms:{},err:"",unsubs:[]};
const $=id=>document.getElementById(id);
const esc=v=>(v==null?"":String(v)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function londonNow(){const p={};new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>{p[x.type]=x.value});return{date:p.year+"-"+p.month+"-"+p.day,hm:p.hour+":"+p.minute}}
function nice(iso){if(iso==="TEST")return"Test evening";const d=new Date(iso+"T12:00:00Z");return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]+" "+d.getUTCDate()+" "+MN[d.getUTCMonth()]+" "+d.getUTCFullYear()}
const att=n=>n.st==="here"||n.st==="late";
function roomC(r){const L=S.nurses.filter(n=>n.room===r),c={exp:L.length,here:0,late:0,not:0,as:0,pass:0};L.forEach(n=>{if(n.st==="here")c.here++;else if(n.st==="late")c.late++;else if(!n.st)c.not++;if(n.bls&&n.fa){c.as++;if(n.bls==="pass"&&n.fa==="pass")c.pass++}});return c}
function tot(){const c={exp:S.nurses.length,here:0,late:0,not:0,abs:0,as:0,pass:0,ny:0};S.nurses.forEach(n=>{if(n.st==="here")c.here++;else if(n.st==="late")c.late++;else if(n.st==="absent")c.abs++;else c.not++;if(n.bls&&n.fa){c.as++;if(n.bls==="pass"&&n.fa==="pass")c.pass++;else c.ny++}});return c}
function dotsHtml(late,abs){const sh=Math.min(late,12),sa=Math.min(abs,Math.max(0,12-sh));return(late||abs)?'<div class="dots" title="'+late+' late, '+abs+' absent">'+"<i></i>".repeat(sh)+'<i class="ab"></i>'.repeat(sa)+((late+abs)>(sh+sa)?'<span>+'+(late+abs-sh-sa)+'</span>':"")+'</div>':'<div class="dots"></div>'}
function dotsRes(p,f){const sp=Math.min(p,12),sf=Math.min(f,Math.max(0,12-sp));return(p||f)?'<div class="dots" title="'+p+' passed, '+f+' not passed">'+'<i class="gd"></i>'.repeat(sp)+'<i class="ab"></i>'.repeat(sf)+((p+f)>(sp+sf)?'<span>+'+(p+f-sp-sf)+'</span>':'')+'</div>':'<div class="dots"></div>'}
const pc=(n,t)=>t?Math.round(n*1000/t)/10:0;
function render(){
  $("msgs").innerHTML=S.err?'<div class="msg">'+esc(S.err)+'</div>':"";
  const c=tot(),clk=londonNow().hm,head='<div class="head"><h2>Tuesday refresher &middot; '+(S.mode==="register"?"Register":"Assessment results")+' &middot; '+esc(nice(S.date))+'</h2><span class="clock">'+esc(clk)+' &middot; live</span></div>';
  let h;
  if(S.mode==="register"){
    const here=c.here+c.late,tiles=TROOMS.map(r=>{const x=roomC(r),hh=x.here+x.late,st=x.exp&&hh===x.exp?"done":(x.exp&&hh/x.exp<.4?"low":""),ab=S.nurses.filter(n=>n.room===r&&n.st==="absent").length,cf=S.rooms[r];
      const sub=(x.exp&&hh===x.exp?"All here":(x.exp-hh)+" to come"+(ab?" &middot; "+ab+" absent":""))+(cf?" &middot; register confirmed":"");
      return '<div class="sroom '+st+'"><b>'+r+'</b><div class="v"><span class="hv">'+hh+'</span><span class="tv">/'+x.exp+'</span></div><small>'+sub+'</small>'+dotsHtml(x.late,ab)+'</div>'}).join("");
    h=head+'<div class="big"><span class="n">'+here+'</span><span class="of">of '+c.exp+' here'+(c.late?" &middot; "+c.late+" late":"")+(c.abs?" &middot; "+c.abs+" absent":"")+'</span></div>'
      +'<div class="sbar"><i class="h" style="width:'+pc(c.here,c.exp)+'%"></i><i class="l" style="width:'+pc(c.late,c.exp)+'%"></i><i class="a" style="width:'+pc(c.abs,c.exp)+'%"></i></div>'
      +'<div class="legend"><span><span class="dotk"></span>one dot for each person marked late</span><span><span class="dotk red"></span>one dot for each person marked absent</span></div>'
      +'<div class="sgrid">'+tiles+'</div>';
  }else{
    const a=c.here+c.late;
    const tiles=TROOMS.map(r=>{const x=roomC(r),at=x.here+x.late,st=at&&x.as===at?"done":"";
      return '<div class="sroom '+st+'"><b>'+r+'</b><div class="v"><span class="hv">'+x.as+'</span><span class="tv">/'+at+'</span></div><small>'+(at&&x.as===at?"All assessed":(at-x.as)+" still to assess")+'</small>'+dotsRes(x.pass,x.as-x.pass)+'</div>'}).join("");
    h=head+'<div class="big"><span class="n">'+c.as+'</span><span class="of">of '+a+' assessed &middot; '+c.pass+' passed both parts'+(c.ny?" &middot; "+c.ny+" not passed":"")+'</span></div>'
      +'<div class="sbar"><i class="p" style="width:'+pc(c.pass,a)+'%"></i><i class="f" style="width:'+pc(c.ny,a)+'%"></i></div>'
      +'<div class="legend"><span><span class="dotk" style="background:#58C07F"></span>one dot for each person who passed both parts</span><span><span class="dotk red"></span>one dot for each person not passed (one or both parts)</span></div>'
      +'<div class="sgrid">'+tiles+'</div>';
  }
  $("screen").innerHTML=h+'<div class="bsn">Numbers only. No names on this screen.</div>';
}
function attach(){
  S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];S.nurses=[];S.rooms={};
  S.unsubs.push(db.collection("tuesday_nurses").where("date","==",S.date).onSnapshot(s=>{S.nurses=s.docs.map(d=>d.data());S.err="";render()},e=>{S.err="Could not read the nurses: "+e.message;render()}));
  S.unsubs.push(db.collection("tuesday_rooms").where("date","==",S.date).onSnapshot(s=>{S.rooms={};s.forEach(d=>{const x=d.data();if(x.confirmed)S.rooms[x.room]=true});render()},e=>{}));
}
auth.onAuthStateChanged(async user=>{
  if(!user){window.location.href="signin.html";return}
  try{
    const role=await resolveRole(user.uid,user.email||"");
    const stu=await isStudentFaculty(user.email||"").catch(()=>false),sen=await isSeniorFaculty(user.email||"").catch(()=>false);
    if(!(role===ROLES.DIRECTOR||stu||sen)){$("authMsg").textContent="This screen is for Directors, Student Faculty and Senior Faculty.";return}
    let cfg={start:"2026-10-20",end:"2027-02-09",evenings:{}};
    try{const d=await db.collection("tuesday_config").doc("series").get();if(d.exists)cfg=Object.assign(cfg,d.data())}catch(e){}
    const dates=[];let d=cfg.start;while(new Date(d+"T12:00:00Z").getUTCDay()!==2)d=new Date(new Date(d+"T12:00:00Z").getTime()+864e5).toISOString().slice(0,10);
    while(d<=cfg.end){if((cfg.evenings||{})[d]!=="no")dates.push(d);d=new Date(new Date(d+"T12:00:00Z").getTime()+7*864e5).toISOString().slice(0,10)}
    const today=londonNow().date;
    const opts=dates.concat(["TEST"]);
    const sh=x=>{if(x==="TEST")return["Test","evening"];const t=new Date(x+"T12:00:00Z");return[t.getUTCDate()+" "+t.toLocaleDateString("en-GB",{month:"short",timeZone:"UTC"}),x===today?"today":"Tue"]};
    const drawRib=()=>{$("dateRib").innerHTML=opts.map(x=>{const l=sh(x);return '<button type="button" data-d="'+x+'" class="'+(x===S.date?"on ":"")+(x===today?"today":"")+'">'+l[0]+'<small>'+l[1]+'</small></button>'}).join("");const on=$("dateRib").querySelector(".on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})};
    $("dateRib").onclick=e=>{const b=e.target.closest("button[data-d]");if(!b)return;S.date=b.dataset.d;drawRib();attach();render()};
    const q=new URLSearchParams(location.search);const want=q.get("date");
    S.date=want&&opts.indexOf(want)>-1?want:(dates.find(x=>x>=today)||dates[dates.length-1]||"TEST");
    if(q.get("mode")==="results")S.mode="results";
    drawRib();
    $("modeSeg").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.m===S.mode);b.onclick=()=>{S.mode=b.dataset.m;$("modeSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));render()}});
    const setFull=on=>{$("screen").classList.toggle("full",on);document.body.classList.toggle("isfull",on)};$("fullBtn").onclick=()=>setFull(!$("screen").classList.contains("full"));$("exitFull").onclick=()=>setFull(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")setFull(false)});$("screen").addEventListener("dblclick",()=>{if($("screen").classList.contains("full"))setFull(false)});
    $("gate").classList.add("hidden");$("app").classList.remove("hidden");
    attach();render();setInterval(render,30000);
  }catch(err){console.error(err);$("authMsg").textContent="Could not open this page: "+(err.message||err)}
});
</script>
</body>
</html>
