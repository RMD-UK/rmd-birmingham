  const STOPWORDS = new Set(["a","an","the","to","in","is","do","i","im","my","me","be","it","of","on","at","for","how","what","when","where","who","does","did","can","should","need","want","if","and","or","with","about","up"]);

  function tokenize(str) {
    return str.toLowerCase().split(/[^a-z0-9']+/).filter(w => w.length > 2 && !STOPWORDS.has(w));
  }

  function runResourceSearch(query) {
    const resultsEl = document.getElementById("searchResults");
    const browseEl = document.getElementById("hubHome");
    const words = tokenize(query);

    if (!query.trim()) {
      resultsEl.innerHTML = "";
      browseEl.classList.remove("hidden");
      return;
    }
    browseEl.classList.add("hidden");

    if (words.length === 0) {
      resultsEl.innerHTML = '<div class="search-empty">Keep typing — that\'s too short or common a word to search on.</div>';
      return;
    }

    const scored = SEARCH_INDEX.map(entry => {
      const titleWords = tokenize(entry.title);
      const keywordWords = tokenize(entry.section + " " + entry.keywords);
      let score = 0;
      for (const w of words) {
        if (titleWords.some(tw => tw.includes(w) || w.includes(tw))) score += 3;
        else if (keywordWords.some(kw => kw.includes(w) || w.includes(kw))) score += 1;
      }
      return { entry, score };
    }).filter(r => r.score > 0);

    scored.sort((a, b) => b.score - a.score || a.entry.title.length - b.entry.title.length);

    if (scored.length === 0) {
      resultsEl.innerHTML = '<div class="search-empty">No matches — try a different word, or browse the sections below.</div>';
      browseEl.classList.remove("hidden");
      return;
    }

    resultsEl.innerHTML = scored.slice(0, 6).map(r => {
      const external = /^https?:\/\//.test(r.entry.url);
      const attrs = external ? ' target="_blank" rel="noopener"' : "";
      return '<a class="search-result" href="' + r.entry.url + '"' + attrs + '>'
        + '<div class="search-result-title">' + r.entry.title + '</div>'
        + '<div class="search-result-section">' + r.entry.section + '</div>'
        + '</a>';
    }).join("");
  }


  function bindSearch(root) {
    const box = document.getElementById("resourceSearch");
    if (box) box.addEventListener("input", () => runResourceSearch(box.value));
  }

  auth.onAuthStateChanged(async function (user) {
    if (!user) { window.location.href = "signin.html"; return; }
    let role = "instructor";
    try { role = (await resolveRole(user.uid, user.email || "")) || role; } catch (e) { /* fall back to default role */ }
    ctx.staff = STAFF_TAB_ROLES.has(role);
    HUB.start({
      root: document.getElementById("view"), groups: GROUPS, items: ITEMS, ctx, backLabel: "Resources", homeLabel: "Browse",

      onHome: bindSearch
    });
  });
