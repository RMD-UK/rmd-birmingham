<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Admin Tools — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body class="hub">

<div class="top-bar">
  <a href="member-menu.html" title="Back to the members menu" style="display:flex;align-items:center;"><img src="assets/rmd-logo.png" alt="RMD"></a>
  <div class="top-bar-title">Global admin tools<span class="top-bar-sub">Year-round, not tied to one event &middot; Directors only</span></div>
  <a class="top-link" href="member-menu.html#tools">Menu</a>
</div>

<div class="banner"><div class="banner-inner">
  <div class="banner-title">Global admin tools</div>
  <div class="banner-sub">Access, people, first year courses, annual processes and the open and close switches.</div>
</div></div>

<div class="wrap" id="view"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/hub.js"></script>
<script>
initFirebase();

/* Layout, 28 Oct 2026 (Jon): the same home-and-drill-down pattern as the members menu. Nothing was removed.
   Every link and switch from the old page is here. The old "First year candidates, rooms and settings" box repeated three cards that
   were already listed, so it is gone and its Settings link is now a card in First year courses. The three open and close switches
   (CPD certificate, Instructor Expression of Interest, Senior Faculty review dates) now sit together under Switches and dates. */

const GROUPS = [
  { id: "access",    name: "Access and roles",     line: "Who can do what, and the record of who held which role" },
  { id: "people",    name: "People and accounts",  line: "Onboarding, MOU, logins, clean-up and reminders" },
  { id: "firstyear", name: "First year courses",   line: "Candidates, course and room allocation, settings" },
  { id: "annual",    name: "Annual processes",     line: "Once-a-year reviews, rosters and confirmations" },
  { id: "switches",  name: "Switches and dates",   line: "Open and close the certificate, the Expression of Interest form and the Senior Faculty review" }
];

const chip = (id, on, onTxt, offTxt) => `<span class="chip ${on == null ? "" : on ? "on" : "off"}" id="${id}">${on == null ? "Checking..." : on ? onTxt : offTxt}</span>`;
const setChip = (id, on, onTxt, offTxt) => { const e = document.getElementById(id); if (e) { e.className = "chip " + (on ? "on" : "off"); e.textContent = on ? onTxt : offTxt; } };
const todayLondon = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/London" });

async function loadCpdSettings() {
  try {
    const snap = await db.collection("config").doc("cpd_certificate").get();
    const d = snap.exists ? snap.data() : {};
    document.getElementById("cpdYearInput").value = d.year || "";
    document.getElementById("cpdOpenCheckbox").checked = !!d.open;
    setChip("cpdChip", !!d.open, "Open", "Closed");
  } catch (err) {
    document.getElementById("cpdAdminStatus").textContent = "Couldn't load the current setting — reload and try again.";
  }
}
async function saveCpdSettings() {
  const year = (document.getElementById("cpdYearInput").value || "").trim();
  const open = document.getElementById("cpdOpenCheckbox").checked;
  const statusEl = document.getElementById("cpdAdminStatus");
  if (!/^\d{4}\/\d{2}$/.test(year)) { statusEl.textContent = 'Enter the year as "YYYY/YY", e.g. 2026/27.'; return; }
  try {
    await db.collection("config").doc("cpd_certificate").set({ year, open });
    setChip("cpdChip", open, "Open", "Closed");
    statusEl.textContent = open ? `Saved — ${year} certificates are downloadable now.` : `Saved — ${year} certificates are hidden until you reopen this.`;
  } catch (err) {
    statusEl.textContent = "Couldn't save that — this needs super-user access, not just director, check with whoever set up your account if this keeps failing.";
  }
}

async function loadEoiSettings() {
  try {
    const snap = await db.collection("config").doc("instructor_eoi").get();
    const d = snap.exists ? snap.data() : {};
    document.getElementById("eoiOpenCheckbox").checked = d.open !== false;
    setChip("eoiChip", d.open !== false, "Open", "Closed");
  } catch (err) {
    document.getElementById("eoiAdminStatus").textContent = "Couldn't load the current setting — reload and try again.";
  }
}
async function saveEoiSettings() {
  const open = document.getElementById("eoiOpenCheckbox").checked;
  const statusEl = document.getElementById("eoiAdminStatus");
  try {
    await db.collection("config").doc("instructor_eoi").set({ open: open }, { merge: true });
    setChip("eoiChip", open, "Open", "Closed");
    statusEl.textContent = open
      ? "Saved — the Instructor Expression of Interest form is accepting submissions now."
      : "Saved — the Instructor Expression of Interest form is showing a closed message until you reopen this.";
  } catch (err) {
    statusEl.textContent = "Couldn't save that — this needs super-user access, not just director, check with whoever set up your account if this keeps failing.";
  }
}

async function loadSfrWindow() {
  const st = document.getElementById("sfrWindowStatus");
  try {
    const s = await db.collection("config").doc("senior_faculty_review_window").get();
    const d = s.exists ? s.data() : {};
    document.getElementById("sfrOpenDate").value = d.open || "";
    document.getElementById("sfrCloseDate").value = d.close || "";
    const t = todayLondon(), on = !!(d.open && d.close && t >= d.open && t <= d.close);
    setChip("sfrChip", on, "Open now", "Closed");
    st.textContent = d.open && d.close ? "Currently set: open " + d.open + " to " + d.close + "." : "No dates set, so the review is closed.";
  } catch (err) { st.textContent = "Couldn't load the current dates, reload and try again."; }
}
async function saveSfrWindow() {
  const o = document.getElementById("sfrOpenDate").value, c = document.getElementById("sfrCloseDate").value, st = document.getElementById("sfrWindowStatus");
  if ((o && !c) || (!o && c)) { st.textContent = "Set both dates, or clear both to close the review."; return; }
  if (o && c && c < o) { st.textContent = "The close date is before the open date."; return; }
  try {
    await db.collection("config").doc("senior_faculty_review_window").set({ open: o || null, close: c || null });
    const t = todayLondon(); setChip("sfrChip", !!(o && c && t >= o && t <= c), "Open now", "Closed");
    st.textContent = o ? "Saved. Open " + o + " to " + c + "." : "Saved. The review is closed.";
  } catch (err) { st.textContent = "Couldn't save that. This needs super-user access, not just director."; }
}

const ITEMS = [
  // Access and roles
  { id: "directorAccess", g: "access", icon: "🔑", title: "Director & Access Management", text: "Grant or remove director-level access across all RMD Student and Senior Faculty. Separate from the Instructor Weekend Course Director tag.", href: () => "admin-director-access.html" },
  { id: "menuAssessors", g: "access", icon: "🎯", title: "Menu assessors", text: "Mark who is an Assessor so their member menu hides the OPIS rating card", href: () => "admin-menu-assessors.html" },
  { id: "roleHistory", g: "access", icon: "🕰️", title: "Role History", text: "Dated role periods per person, feeding the eligibility shortlist and CPD certificate eligibility", href: () => "admin-role-history.html" },

  // People and accounts
  { id: "onboarding", g: "people", icon: "🧭", title: "Faculty Onboarding Wizard", text: "New applicant, login account, IW registration, step by step in one place", href: () => "admin-faculty-onboarding.html" },
  { id: "mou", g: "people", icon: "📑", title: "MOU Dashboard", text: "Annual Memorandum of Understanding: roster status, submissions, reminders", href: () => "admin-mou-dashboard.html" },
  { id: "bulkUsers", g: "people", icon: "👥", title: "Bulk User Setup", text: "Create Firebase login accounts for faculty or MOU roster members", href: () => "admin-bulk-users.html" },
  { id: "dedupe", g: "people", icon: "🧹", title: "Duplicate People & Account Cleanup", text: "Find and remove duplicate records in the People collection (attendance, room allocation, etc.)", href: () => "admin-dedupe-people.html" },
  { id: "reminders", g: "people", icon: "🔔", title: "Reminder Hub", text: "See everyone outstanding across account sign-in, MOU, senior faculty review, IW RSVP and the faculty form. Bulk-send a whole category, or look up one person and send just what's needed.", href: () => "admin-reminder-hub.html" },
  { id: "visitors", g: "people", icon: "🛂", title: "Visitor Request Export", text: "RMD Senior Faculty (annual) and external Instructor Weekend faculty, formatted for UoB's Visiting Personnel form", href: () => "admin-visitor-request-export.html" },

  // First year courses
  { id: "fyCands", g: "firstyear", icon: "🎓", title: "First year candidates", text: "Taught first-year records: bulk import, duplicate flagging, promote to Instructor", href: () => "admin-stage1-candidates.html" },
  { id: "fyRealloc", g: "firstyear", icon: "🔀", title: "Re-allocate a candidate to another course", text: "One screen: search for a person, move them to another course or room (with the voluntary override for deadline or placement clashes), place everyone waiting, and email people about changes", href: () => "course-allocation.html" },
  { id: "fyRooms", g: "firstyear", icon: "🏫", title: "Course Room & Instructor Allocation", text: "Allocate a first year evening course's candidates and instructor teams into teaching rooms", href: () => "admin-course-room-allocation.html" },
  { id: "fySettings", g: "firstyear", icon: "⚙️", title: "First year settings", text: "This year's programme deadlines and course session dates", href: () => "admin-stage1-settings.html" },

  // Annual processes
  { id: "sfrDash", g: "annual", icon: "📊", title: "Senior Faculty Review Dashboard", text: "Roster status, responses, and reminder emails", href: () => "admin-senior-faculty-review.html" },
  { id: "iwPass", g: "annual", icon: "🎓", title: "Instructor Weekend: Pass Confirmation", text: "Confirm which Instructor Candidates passed, at the end of the weekend", href: () => "admin-iw-pass-confirmation.html" },
  { id: "facRoster", g: "annual", icon: "📇", title: "Faculty Roster: Bulk Upload", text: "Annual paste that populates the public faculty pages and the senior review roster", href: () => "admin-faculty-roster.html" },

  // Switches and dates
  { id: "pSfr", g: "switches", panel: () => `<div class="panel"><h3>Senior Faculty review: open and close dates ${chip("sfrChip", null)}</h3>
      <p class="hint">The <a href="senior-faculty-review.html">Senior Faculty review</a> form and its link on the Director menu are only available between these two dates (both days included). Outside them Senior Faculty see a "not open" message, and Directors can still view the form. With no dates set it is closed.</p>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;"><label>Opens<br><input type="date" id="sfrOpenDate"></label><label>Closes<br><input type="date" id="sfrCloseDate"></label></div>
      <button class="btn-primary" type="button" onclick="saveSfrWindow()">Save</button><div class="hint" id="sfrWindowStatus"></div></div>`, mount: loadSfrWindow },
  { id: "pEoi", g: "switches", panel: () => `<div class="panel"><h3>Instructor Expression of Interest ${chip("eoiChip", null)}</h3>
      <p class="hint">This is the one place the <a href="instructor-eoi.html">Instructor Expression of Interest</a> form is switched on or off for everyone. Closing it shows visitors a "not accepting right now" message instead of the form, and stops new submissions being written even if someone bypasses that message. There's no per-person override.</p>
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;"><input type="checkbox" id="eoiOpenCheckbox" style="width:auto;"> Open: accepting expressions of interest now</label>
      <button class="btn-primary" type="button" onclick="saveEoiSettings()">Save</button><div class="hint" id="eoiAdminStatus"></div></div>`, mount: loadEoiSettings },
  { id: "pCpd", g: "switches", panel: () => `<div class="panel"><h3>CPD certificate ${chip("cpdChip", null)}</h3>
      <p class="hint">This is the one place the "Download your CPD certificate" link on everyone's My Account page is switched on or off. Set the academic year it's for, then tick Open once you're confident <a href="admin-role-history.html">Role History</a> is accurate for everyone who delivered that year. Closing it again hides the download for everyone until you reopen it. There's no per-person override: if someone left or didn't do the job, delete their account instead, which already removes them from eligibility.</p>
      <label style="display:block;font-weight:700;color:var(--rmd-navy);margin-bottom:4px;">Academic year</label>
      <input type="text" id="cpdYearInput" placeholder="e.g. 2026/27" style="max-width:160px;">
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;"><input type="checkbox" id="cpdOpenCheckbox" style="width:auto;"> Open: this year's certificates are downloadable now</label>
      <button class="btn-primary" type="button" onclick="saveCpdSettings()">Save</button><div class="hint" id="cpdAdminStatus"></div></div>`, mount: loadCpdSettings }
];

requireDirector("member-menu.html").then(() => {
  HUB.start({
    root: document.getElementById("view"), groups: GROUPS, items: ITEMS, ctx: {}, backLabel: "Global tools", homeLabel: "Choose an area",
    homeTop: () => `<div class="note">These tools apply across the whole platform, not just Instructor Weekend 2026. MOU membership, account creation and annual reviews all run independently of any single event's dates. For Instructor Weekend tools (registrations, room allocation, assessments) use the <a href="cd-dashboard.html">Course Director Dashboard</a> instead.</div>`
  });
});
</script>
</body>
</html>
