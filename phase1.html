// ── Assessment form ─────────────────────────────────────────────────────────
function openForm(id) {
  const c = N.cands.find(x => x.id === id); if (!c) return;
  const att = formAttemptOf(c), chk = canAssessCandidate(c, att);
  const existing = nattempts(id)[att] || null;
  const prevKeys = Object.keys(nattempts(id)).filter(k => Number(k) !== att).sort((a, b) => a - b);
  const req = requiredComps(id, att);
  const p1 = nattempts(id)["1"];
  const noHistory = att === 2 && !(p1 && p1.components);    // attempt 1 was on an earlier course: let the assessor leave a part out
  const qs = Array.isArray(N.form.questions) ? N.form.questions : [];
  const url = /^https:\/\//i.test(N.form.formUrl || "") ? N.form.formUrl : "";
  N.formOpen = true;
  const hist = prevKeys.map(k => { const a = nattempts(id)[k]; return `<div class="hist">Attempt ${esc(k)}: <b>${esc(outcomeLabel(a.outcome, Number(k)))}</b>${a.assessorName ? " by " + esc(a.assessorName) : ""}${compsText(a) ? ` <small>${esc(compsText(a))}</small>` : ""}${a.comment ? ` <small>${esc(a.comment)}</small>` : ""}</div>`; }).join("");
  const state = { marks: {}, reasons: { bls: new Set(), rec: new Set() }, answers: Object.assign({}, existing && existing.answers ? existing.answers : {}) };
  if (existing && existing.components) {
    req.forEach(k => { if (existing.components[k]) state.marks[k] = existing.components[k]; });
    COMPS.forEach(x => ((existing.reasons || {})[x.k] || []).forEach(r => state.reasons[x.k].add(r)));
  }
  const cmpHtml = COMPS.map(x => {
    if (!req.includes(x.k)) return `<div class="cmp off"><b>${esc(x.label)}</b> <span class="nchip pass">Passed at attempt 1</span></div>`;
    let lastCode = "";
    const steps = stepsFor(x.k).map((t, i) => {
      const m = /^(\d[a-z])\s+(.*)$/.exec(t), code = m ? m[1] : "";
      let head = "";
      if (code && code !== lastCode) { head = `<div class="stphead"><b>${esc(code)}</b> ${esc(CODE_NAMES[code] || "")}</div>`; lastCode = code; }
      return head + `<button type="button" class="stp" data-stp="${x.k}" data-i="${i}"><span class="sn">${i + 1}</span>${esc(m ? m[2] : t)}</button>`;
    }).join("");
    return `<div class="cmp" data-cmp="${x.k}"><b>${esc(x.label)}</b><div class="fqo" style="margin-top:8px">` +
      `<button type="button" class="fqb out pass" data-mk="${x.k}" data-m="pass"${chk.ok ? "" : " disabled"}>Pass</button>` +
      `<button type="button" class="fqb out refer" data-mk="${x.k}" data-m="fail"${chk.ok ? "" : " disabled"}>Not yet</button>` +
      (noHistory ? `<button type="button" class="fqb" data-mk="${x.k}" data-m="skip"${chk.ok ? "" : " disabled"}>Not retested</button>` : "") +
      `</div><div class="why2 hidden" data-why="${x.k}"><div class="hint" style="margin:10px 0 6px">Tap what was missed or done wrongly, in the order of the sequence:</div><div class="stps">${steps}</div></div></div>`;
  }).join("");
  const qHtml = qs.map(q => {
    const val = existing && existing.answers ? existing.answers[q.id] : "";
    if (q.type === "choice" || q.type === "yesno") {
      const opts = q.type === "yesno" ? ["Yes", "No"] : (q.options || []);
      return `<div class="fq"><label>${esc(q.label)}</label><div class="fqo">${opts.map(o => `<button type="button" class="fqb${val === o ? " on" : ""}" data-q="${esc(q.id)}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
    }
    return `<div class="fq"><label>${esc(q.label)}</label><input type="text" data-qt="${esc(q.id)}" value="${esc(val || "")}"></div>`;
  }).join("");
  $("overlay").innerHTML = `<div class="modalbg" id="fbg"><div class="modal" role="dialog" aria-modal="true">` +
    `<h3>${esc(c.name)} ${c.rap ? RAPSVG : ""} ${attBadge(att)}</h3><div class="sub">${esc(S.course)} · ${esc(c.degree || "")}${c.assessmentRoom ? " · " + esc(c.assessmentRoom) + " at " + esc(c.assessmentSlot) : ""} · attempt ${att}</div>` +
    `<div class="hint" style="margin:0 0 4px">Single-rescuer scenario. Assess BLS + AED first, then the recovery position.${att === 2 && req.length < COMPS.length ? " This is a retest of the part not passed at attempt 1." : ""}</div>` +
    hist +
    (chk.ok ? "" : `<div class="msg err">${esc(chk.why)}</div>`) +
    (existing ? `<div class="msg warn">Already recorded: ${esc(outcomeLabel(existing.outcome, att))}${existing.assessorName ? " by " + esc(existing.assessorName) : ""}. Saving again will amend it.</div>` : "") +
    cmpHtml + qHtml +
    `<div class="fq"><label>Comments</label><textarea id="fComment" style="min-height:80px;font-family:inherit" ${chk.ok ? "" : "disabled"}>${esc(existing ? existing.comment || "" : "")}</textarea></div>` +
    `<div class="resline" id="fRes">Mark each part to see the result.</div>` +
    (url ? `<div class="hint" style="margin:6px 0"><a href="${esc(url)}" target="_blank" rel="noopener">Open the Google Form instead</a> (fallback if this page has a problem).</div>` : "") +
    `<div class="row2"><button type="button" class="btn pri" id="fSave" disabled>Save result</button><button type="button" class="btn" id="fCancel">Cancel</button><span class="hint" id="fMsg"></span></div>` +
    `</div></div>`;
  const close = () => { $("overlay").innerHTML = ""; N.formOpen = false; };
  const refresh = () => {
    req.forEach(k => {
      $("overlay").querySelectorAll('[data-mk="' + k + '"]').forEach(b => b.classList.toggle("on", state.marks[k] === b.dataset.m));
      const w = $("overlay").querySelector('[data-why="' + k + '"]'); if (w) w.classList.toggle("hidden", state.marks[k] !== "fail");
      $("overlay").querySelectorAll('[data-stp="' + k + '"]').forEach(b => b.classList.toggle("on", state.reasons[k].has(stepsFor(k)[Number(b.dataset.i)])));
    });
    const o = outcomeFor(state.marks, req);
    $("fRes").className = "resline" + (o === "pass" ? " pass" : o ? " refer" : "");
    $("fRes").textContent = o ? "Result: " + outcomeLabel(o, att) : "Mark each part to see the result.";
    $("fSave").textContent = o ? "Save: " + outcomeShort(o, att) : "Save result";
    $("fSave").disabled = !o || !chk.ok;
  };
  $("fCancel").onclick = close;
  $("fbg").onclick = e => { if (e.target.id === "fbg") close(); };
  $("overlay").querySelectorAll("[data-mk]").forEach(b => b.onclick = () => { state.marks[b.dataset.mk] = b.dataset.m; refresh(); });
  $("overlay").querySelectorAll("[data-stp]").forEach(b => b.onclick = () => {
    const k = b.dataset.stp, t = stepsFor(k)[Number(b.dataset.i)];
    if (state.reasons[k].has(t)) state.reasons[k].delete(t); else state.reasons[k].add(t);
    refresh();
  });
  $("overlay").querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    state.answers[b.dataset.q] = b.dataset.v;
    $("overlay").querySelectorAll('[data-q="' + b.dataset.q + '"]').forEach(x => x.classList.toggle("on", x === b));
  });
  refresh();
  $("fSave").onclick = async () => {
    const out = outcomeFor(state.marks, req); if (!out) return;
    const comment = $("fComment").value.trim();
    for (const k of req) { if (state.marks[k] === "fail" && !state.reasons[k].size && !comment) { $("fMsg").textContent = "Tap at least one reason for " + compLabel(k) + " (or add a comment)."; return; } }
    for (const q of qs) { if (q.required && !(state.answers[q.id] || ($("overlay").querySelector('[data-qt="' + q.id + '"]') || {}).value)) { $("fMsg").textContent = "Please answer: " + q.label; return; } }
    $("overlay").querySelectorAll("[data-qt]").forEach(i => { state.answers[i.dataset.qt] = i.value.trim(); });
    const components = {}, reasons = {};
    req.forEach(k => { components[k] = state.marks[k]; if (state.marks[k] === "fail") reasons[k] = stepsFor(k).filter(t => state.reasons[k].has(t)); });
    $("fSave").disabled = true;
    try {
      await saveResult(c, att, out, { comment, answers: state.answers, components, reasons }, !!existing);
      close();
    } catch (err) {
      $("fSave").disabled = false;
      $("fMsg").textContent = "Not saved: " + (err.code === "permission-denied" ? "you do not have permission (rules not deployed yet?)" : err.message);
    }
  };
}
async function saveResult(c, att, outcome, d, amend) {
  const entry = { outcome, assessorUid: S.user.uid, assessorName: S.myName, room: c.assessmentRoom || null, slot: c.assessmentSlot || null, comment: d.comment || "", answers: d.answers || {}, components: d.components || {}, reasons: d.reasons || {}, at: new Date().toISOString() };
  if (amend) entry.amended = true;
  await db.collection("stage1_assessments").doc(c.id).set({
    course: S.course, candidateName: c.name || "", claim: null, notThere: null,
    attempts: { [String(att)]: entry },
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
  if (outcome === "pass") toast("Saved: " + c.name + " passed.");
  else if (att <= 1) toast(c.name + " is referred and now in the retest pool (attempt 2).");
  else toast("Saved: " + c.name + " - " + outcomeShort(outcome, att).toLowerCase() + ". Listed for the team on the Retest pool page.");
}

// ── Follow-up for the team (not passed at attempt 2 or above) ───────────────
function afterTonight() {
  const out = { retrain: [], leads: [], final: [] };
  N.cands.forEach(c => {
    if (passedAtKey(c.id)) return;
    const a = nattempts(c.id), keys = Object.keys(a).filter(k => a[k] && a[k].outcome === "refer").map(Number);
    if (!keys.length) return;
    const k = Math.max.apply(null, keys);
    if (k === 2) out.retrain.push({ c, k });
    else if (k === 3) out.leads.push({ c, k });
    else if (k >= 4) out.final.push({ c, k });
  });
  Object.keys(out).forEach(g => out[g].sort((x, y) => String(x.c.name).localeCompare(String(y.c.name))));
  return out;
}
const NEXT_STEPS = {
  2: "Next steps: a member of Student Faculty meets the candidate to explain the next steps. They attend a further BLS course in full (all 3 evenings), in a different teaching room (different instructors) from their first course, then sit attempt 3 with Senior Faculty on both BLS/AED and first aid.",
  3: "Next steps: a member of Senior Faculty meets the candidate to discuss progress, barriers to performance and any extra support. The programme lead is emailed so they know the additional requirements. The candidate attends a further course in full (all 3 evenings) and sits attempt 4 with Senior Faculty on both BLS/AED and first aid.",
  4: "Final attempt not passed: the candidate has not completed the course and cannot gain the ERC qualification. Tell the programme lead. The effect on their degree programme is decided by the programme lead."
};
function noteFor(c, k) {
  const a = nattempts(c.id), last = a[String(k)] || {};
  const lines = Object.keys(a).sort((x, y) => x - y).map(n => `  Attempt ${n}${a[n].assessorName ? " (" + a[n].assessorName + ")" : ""}: ${outcomeShort(a[n].outcome, Number(n))}${compsText(a[n]) ? ". " + compsText(a[n]) : ""}${a[n].comment ? ". Comment: " + a[n].comment : ""}`);
  return `${c.name} (${c.degree || "degree not recorded"}), ${S.course}\n${outcomeLabel(last.outcome, k)}\n` + lines.join("\n") + (NEXT_STEPS[k] ? "\n" + NEXT_STEPS[k] : "");
}
function copyTxt(t) {
  const fb = () => { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); };
  try { return navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).catch(fb) : Promise.resolve(fb()); } catch (e) { fb(); return Promise.resolve(); }
}
function teamCard(af) {
  const groups = [
    { key: "retrain", title: "Awaiting retraining (referred at attempt 2)", hint: "Not retested tonight. A Student Faculty member meets them, then they repeat all 3 evenings in a different room (different instructors) before attempt 3 with Senior Faculty." },
    { key: "leads", title: "Referred back to degree leads (attempt 3)", hint: "A Senior Faculty member meets them to discuss progress and support, and the programme lead is told. Further course in full, then attempt 4." },
    { key: "final", title: "Not passed - final attempt (attempt 4)", hint: "Course not completed. Refer back to the degree leads, inform the candidate they have not passed, and tell the programme lead." }
  ];
  const any = groups.some(g => af[g.key].length);
  let h = `<div class="card"><h3><span class="stepno">2</span>For the team</h3><div class="hint" style="margin:0 0 8px">Nothing is emailed from here. Copy the note and send it yourself.</div>`;
  if (!any) return h + '<div class="hint">Nobody yet. People who are not passed at attempt 2 or above are listed here with their reasons.</div></div>';
  groups.forEach(g => {
    const l = af[g.key]; if (!l.length) return;
    h += `<div class="tgroup"><div class="tghead"><b>${esc(g.title)} (${l.length})</b><button type="button" class="btn sm" data-copygroup="${g.key}">Copy all</button></div><div class="hint" style="margin:2px 0 6px">${esc(g.hint)}</div>`;
    h += l.map(x => `<div class="lrow"><span class="nm">${esc(x.c.name)}${attBadge(x.k)}</span><small>${esc(x.c.degree || "")}</small><small style="flex-basis:100%">${esc(compsText(nattempts(x.c.id)[String(x.k)]))}</small><span class="pact"><button type="button" class="btn sm" data-copyone="${esc(x.c.id)}" data-k="${x.k}">Copy note</button></span></div>`).join("");
    h += `</div>`;
  });
  return h + `</div>`;
}

// ── Retest pool page (organising team) ──────────────────────────────────────
function staleAttempts() {
  // candidates whose recorded results imply a higher attempt than the number saved on them
  return N.cands.filter(c => !c.absent && derivedAttempt(c.id) > (c.attempt || 1));
}
// Attempts overview (2026-10-13, Jon): everyone on this course who has a result
// or is on attempt 2 or above, in one collapsed list, so the team can see at a
// glance where each person stands. Collapsed by default.
function attemptStatus(c) {
  const p = passedAtKey(c.id);
  if (p) return { cls: "pass", text: "Passed at attempt " + p };
  if (c.absent) return { cls: "bad", text: "Not there" };
  if (inPool(c)) return { cls: "bad", text: "In the retest pool" };
  const a = nattempts(c.id), ks = Object.keys(a).filter(k => a[k] && a[k].outcome === "refer").map(Number);
  const k = ks.length ? Math.max.apply(null, ks) : 0;
  if (k === 1) return { cls: "bad", text: "Referred, due a retest tonight" };
  if (k === 2) return { cls: "", text: "Awaiting retraining (attempt 3 on a later course)" };
  if (k === 3) return { cls: "", text: "Back to degree leads" };
  if (k >= 4) return { cls: "bad", text: "Not passed (final)" };
  return { cls: "", text: "Not yet assessed" };
}
function attemptsOverview() {
  const list = N.cands.filter(c => effAttempt(c) >= 2 || isDoneN(c))
    .sort((a, b) => effAttempt(b) - effAttempt(a) || String(a.name).localeCompare(String(b.name)));
  const body = list.length
    ? list.map(c => {
        const st = attemptStatus(c), a = nattempts(c.id);
        const hist = Object.keys(a).sort((x, y) => x - y).map(k => "A" + k + " " + outcomeShort(a[k].outcome, Number(k))).join(" · ");
        return `<div class="lrow"><span class="nm">${esc(c.name)} ${c.rap ? RAPSVG : ""}${attBadge(effAttempt(c))}</span><small>${esc(c.degree || "")}</small>` +
          `<small style="flex-basis:100%">${hist ? esc(hist) + " · " : ""}<span class="nchip ${st.cls}">${esc(st.text)}</span></small></div>`;
      }).join("")
    : '<div class="hint">Nobody has a result or a retest yet.</div>';
  return `<details class="card" id="attDetails"><summary style="cursor:pointer;font-weight:700;color:var(--pur)">All attempts on this course (${list.length})</summary><div style="margin-top:8px">${body}</div></details>`;
}
function renderRetest() {
  if (!S.course || !S.full) return;
  const d = assessDate(), pool = poolList(), stale = staleAttempts();
  const waiting = pool.filter(c => !(nres(c.id).claim && nres(c.id).claim.uid));
  const withA = pool.length - waiting.length;
  const passedRetest = N.cands.filter(c => passedAtKey(c.id) && Number(passedAtKey(c.id)) >= 2).length;
  $("msgs").innerHTML = nightBanner();
  const af = afterTonight();
  $("plain").innerHTML = '<span class="lbl">Retest pool</span>' +
    `<b>${esc(S.course)}.</b> Assessment night is ${d ? nice(d) : "not set"}. <b>${pool.length}</b> ${pool.length === 1 ? "person is" : "people are"} waiting for their next attempt tonight. ` +
    `They are never given a slot automatically: an assessor takes each one on from the Assessor view. Attempt 2 is Student or Senior Faculty and a different assessor from attempt 1; attempt 3 and above is Senior Faculty or the extra named assessors. ` +
    `Anyone not passed at attempt 2 or above is not retested tonight: they appear under <b>For the team</b> below.`;
  let h = `<div class="sumstrip">${nightTile(pool.length, "In the pool")}${nightTile(waiting.length, "Waiting for an assessor", waiting.length > 0)}${nightTile(withA, "With an assessor")}${nightTile(passedRetest, "Passed a retest")}` +
    `${nightTile(af.retrain.length, "Awaiting retraining")}${nightTile(af.leads.length, "Back to degree leads")}${nightTile(af.final.length, "Not passed (final)", af.final.length > 0)}</div>`;
  if (stale.length) {
    h += `<div class="card" style="border-color:var(--org)"><h3>Update attempt numbers</h3><div class="hint" style="margin:0 0 8px"><b>${stale.length}</b> ${stale.length === 1 ? "candidate was" : "candidates were"} referred on the night, so their saved attempt number is out of date: ${stale.slice(0, 6).map(c => esc(c.name)).join(", ")}${stale.length > 6 ? " and others" : ""}. Updating also keeps the Master sheet column in step.</div><button type="button" class="btn pri" id="syncAtt">Update ${stale.length} attempt number${stale.length === 1 ? "" : "s"}</button></div>`;
  }
  const prow = c => {
    const att = effAttempt(c), prev = nattempts(c.id)["1"], cl = nres(c.id).claim;
    const hist = Object.keys(nattempts(c.id)).sort((a, b) => a - b).map(k => { const a = nattempts(c.id)[k]; return `Attempt ${esc(k)}: ${esc(outcomeLabel(a.outcome, Number(k)))}${a.assessorName ? " (" + esc(a.assessorName) + ")" : ""}${compsText(a) ? " - " + esc(compsText(a)) : ""}`; }).join(" · ");
    const rule = att === 2 ? (prev && prev.assessorName ? "Not " + esc(prev.assessorName) : "Different assessor from attempt 1") + (prev && prev.components ? " · retest " + requiredComps(c.id, 2).map(compLabel).join(" + ") + (failCodes(c.id) ? " (failed " + failCodes(c.id) + ")" : "") : "") : "Senior Faculty or extra named assessor";
    return `<div class="lrow"><span class="nm">${esc(c.name)} ${c.rap ? RAPSVG : ""}${attBadge(att)}</span><small>${esc(c.degree || "")}</small>` +
      `<small style="flex-basis:100%">${rule}${hist ? " · " + hist : " · no result recorded on the site yet"}</small>` +
      `<span class="pact">${cl && cl.name ? `<span class="nchip claim">With ${esc(cl.name)}</span><button type="button" class="btn sm" data-prelease="${esc(c.id)}">Release</button>` : '<span class="nchip bad">Waiting</span>'}` +
      `<span class="stepper"><button type="button" data-patt="${esc(c.id)}" data-d="-1" aria-label="Lower attempt">-</button><button type="button" data-patt="${esc(c.id)}" data-d="1" aria-label="Raise attempt">+</button></span></span></div>`;
  };
  h += `<div class="card"><h3><span class="stepno">1</span>Who is in the pool</h3>` + (pool.length ? pool.map(prow).join("") : '<div class="hint">Nobody yet. People appear as soon as an assessor refers them, or when you set their attempt to 2 or more.</div>') + `</div>`;
  h += attemptsOverview();
  h += teamCard(af);
  if (S.isDirector) {
    h += `<div class="card"><h3><span class="stepno">3</span>Night settings</h3>` +
      `<div class="hint" style="margin:0 0 6px"><b>Assessment night team.</b> People who may open the assessment night and record first sits, in addition to Directors, Student and Senior Faculty, Faculty and Assessor Faculty. Add Senior Instructors here. Email addresses only, one per line (the email they sign in with).</div>` +
      `<textarea id="teamTxt" placeholder="Email, one per line">${esc((N.team || []).join("\n"))}</textarea>` +
      `<div class="tools" style="margin:6px 0 14px"><button type="button" class="btn sm" id="pickAssessors">Add everyone whose role is Assessor</button><span class="hint" id="pickMsg"></span></div>` +
      `<div class="hint" style="margin:0 0 6px"><b>Extra named assessors</b> for later retests (attempt 3 and above, on top of Senior Faculty). One per line. Use their email so they can also open the assessment night; a name alone only works if they already have access another way.</div>` +
      `<textarea id="namedTxt" placeholder="Name or email, one per line">${esc((N.named || []).join("\n"))}</textarea>` +
      COMPS.map(x => `<div class="hint" style="margin:12px 0 4px"><b>${esc(x.label)}</b> mark sheet steps, one per line, in the order they should appear (the ERC / Resuscitation Council UK 2025 lay-rescuer sequence is the default). Start each line with its code (1a, 1b, 1c for BLS + AED; 2a for recovery position) to match the Google Form. Assessors tap the ones missed.</div><textarea id="steps_${x.k}" style="min-height:150px">${esc(stepsFor(x.k).join("\n"))}</textarea>`).join("") +
      `<div class="hint" style="margin:10px 0 4px">Google Form link (shown on the assessment form as a fallback; leave blank to hide).</div>` +
      `<input type="text" id="formUrl" placeholder="https://forms.gle/..." value="${esc(N.form.formUrl || "")}">` +
      `<div class="tools" style="margin:10px 0 0"><button type="button" class="btn pri" id="saveNight">Save settings</button><span class="hint" id="nightMsg"></span></div>` +
      `<div class="hint">Saving needs a super-user account, the same as the other site settings.</div></div>`;
  }
  const wasOpen = !!($("attDetails") && $("attDetails").open);
  $("viewRetest").innerHTML = h;
  if (wasOpen && $("attDetails")) $("attDetails").open = true;
  const sy = $("syncAtt"); if (sy) sy.onclick = syncAttempts;
  $("viewRetest").querySelectorAll("[data-prelease]").forEach(b => b.onclick = () => releaseCand(b.dataset.prelease));
  $("viewRetest").querySelectorAll("[data-patt]").forEach(b => b.onclick = () => {
    const c = S.cands.find(x => x.id === b.dataset.patt), n = N.cands.find(x => x.id === b.dataset.patt);
    if (!c || !n) { toast("Reload the page and try again.", true); return; }
    setAttempt(c, effAttempt(n) + Number(b.dataset.d)).then(() => { n.attempt = attemptOf(c); renderRetest(); });
  });
  const sv = $("saveNight"); if (sv) sv.onclick = saveNightSettings;
  const pk = $("pickAssessors"); if (pk) pk.onclick = pickAssessors;
  $("viewRetest").querySelectorAll("[data-copyone]").forEach(b => b.onclick = () => {
    const c = N.cands.find(x => x.id === b.dataset.copyone); if (!c) return;
    copyTxt(noteFor(c, Number(b.dataset.k))).then(() => toast("Note copied for " + c.name));
  });
  $("viewRetest").querySelectorAll("[data-copygroup]").forEach(b => b.onclick = () => {
    const l = af[b.dataset.copygroup] || [];
    copyTxt(l.map(x => noteFor(x.c, x.k)).join("\n\n")).then(() => toast("Copied " + l.length + " note" + (l.length === 1 ? "" : "s")));
  });
}
async function syncAttempts() {
  const list = staleAttempts(); if (!list.length) return;
  try {
    for (let i = 0; i < list.length; i += 400) {
      const batch = db.batch();
      list.slice(i, i + 400).forEach(c => {
        const n = derivedAttempt(c.id);
        batch.update(db.collection(COLLECTIONS.stage1Candidates).doc(c.id), { assessmentAttempt: n, twoPlusAssessments: n >= 2 });
      });
      await batch.commit();
    }
    list.forEach(c => { const n = derivedAttempt(c.id); c.attempt = n; const sc = S.cands.find(x => x.id === c.id); if (sc) { sc.assessmentAttempt = n; sc.twoPlusAssessments = n >= 2; } });
    toast("Updated " + list.length + " attempt number" + (list.length === 1 ? "" : "s") + ".");
  } catch (err) { toast("Not saved: " + (err.code === "permission-denied" ? "you do not have permission (rules not deployed yet?)" : err.message), true); }
  renderRetest();
}
async function pickAssessors() {
  const box = $("teamTxt"), msg = $("pickMsg");
  msg.textContent = "Looking…";
  try {
    const snap = await db.collection(COLLECTIONS.people).where("role", "==", "assessor").get();
    const have = new Set(box.value.split(/\r?\n/).map(s => s.trim().toLowerCase()).filter(Boolean));
    const add = [];
    snap.forEach(d => { const e = String((d.data() || {}).email || "").trim().toLowerCase(); if (e && e.includes("@") && !have.has(e)) { have.add(e); add.push(e); } });
    if (add.length) box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + add.join("\n");
    msg.textContent = add.length ? "Added " + add.length + ". Remove anyone who should not assess, then press Save settings." : "Nobody new found.";
  } catch (err) { msg.textContent = "Could not look: " + err.message; }
}
async function saveNightSettings() {
  const team = $("teamTxt").value.split(/\r?\n/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const badTeam = team.filter(t => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t));
  if (badTeam.length) { $("nightMsg").textContent = "The assessment night team needs email addresses only. Check: " + badTeam.slice(0, 3).join(", "); return; }
  const names = $("namedTxt").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const namedEmails = names.filter(n => n.includes("@")).map(n => n.toLowerCase());
  const url = $("formUrl").value.trim();
  if (url && !/^https:\/\//i.test(url)) { $("nightMsg").textContent = "The form link must start with https://"; return; }
  const markSheet = {};
  COMPS.forEach(x => {
    const lines = ($("steps_" + x.k).value || "").split(/\r?\n/).map(t => t.trim()).filter(Boolean);
    markSheet[x.k] = JSON.stringify(lines) === JSON.stringify(DEFAULT_STEPS[x.k]) ? [] : lines;
  });
  $("saveNight").disabled = true;
  try {
    await db.collection("config").doc("stage1_named_assessors").set({ names, emails: namedEmails }, { merge: true });
    await db.collection("config").doc("stage1_assessors").set({ emails: team }, { merge: true });
    await db.collection("config").doc("stage1_assessment_form").set({ formUrl: url, markSheet }, { merge: true });
    N.named = names; N.team = team; N.form = Object.assign({}, N.form, { formUrl: url, markSheet });
    $("nightMsg").textContent = "Saved.";
  } catch (err) {
    $("nightMsg").textContent = "Not saved: " + (err.code === "permission-denied" ? "this needs a super-user account." : err.message);
  }
  $("saveNight").disabled = false;
}

</script>
