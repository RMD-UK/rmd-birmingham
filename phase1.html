<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Phase 1 Evening Management - RMD Birmingham</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#1A2233; --mut:#6B7C93; --line:#E3E8EF; --bg:#F5F7FA; --card:#fff;
  --pur:#44247C; --pur2:#2E1856; --purtint:#EFEAF8; --blu:#0067A4; --org:#F49001;
  --ok:#1E8449; --okbg:#E3F3E8; --bad:#B3261E; --badbg:#FCE8E6; --warn:#8A5200; --warnbg:#FFF1D6;
  --font:'Inter','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
.gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-weight:700;color:var(--pur)}
.top{background:var(--pur);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px}
.top .grow{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px;opacity:.85}
.seg button.on{background:#fff;color:var(--pur);opacity:1}
.seg button .nowdot{display:inline-block;background:var(--ok);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}
.tbtn:hover{background:rgba(255,255,255,.26)}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
.main>*{min-width:0}
.steps{max-width:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:58px;min-height:calc(100vh - 58px)}
.side .lab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.steps{display:flex;flex-direction:column;gap:8px}
.stepcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;line-height:1.25}
.stepcard .no{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:#C9D1DE;color:#fff;font-size:14px;font-weight:800}
.stepcard b{display:block;font-size:15px;font-weight:800}
.stepcard small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;font-weight:500}
.stepcard.on{border-color:var(--pur);background:var(--purtint)}
.stepcard.on .no{background:var(--pur)}
.stepcard.on b{color:var(--pur)}
.stepcard.link:hover{border-color:var(--blu)}
.stepcard.link .no{background:var(--blu)}
.stepcard.soon{opacity:.55;cursor:default}
.pane{padding:16px 20px 90px;min-width:0}
.plain{background:#fff;border:1px solid var(--line);border-left:6px solid var(--pur);border-radius:14px;padding:14px 18px;margin-bottom:14px;font-size:17px;line-height:1.55}
.plain .lbl{display:block;font-size:11px;font-weight:800;color:var(--pur);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.plain .mut{color:var(--mut)}
.msg{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.err{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools select{padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.btn{border:2px solid var(--pur);background:#fff;color:var(--pur);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px}
.btn.pri{background:var(--pur);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.tg{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.tg input{width:18px;height:18px;accent-color:var(--pur)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-bottom:14px}
.rooms .r{background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;color:var(--ink)}
.rooms .r b{font-size:14px;display:block}
.rooms .r small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rooms .r.on{border-color:var(--pur);background:var(--purtint)}
.rooms .r.mine{box-shadow:inset 4px 0 0 var(--org)}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:130px}
.tile .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.tile.warn .n{color:var(--bad)}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.wk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wk h3{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk .when{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px}
.when.today{background:var(--okbg);color:var(--ok)}
.when.past{background:#EEF1F6;color:var(--mut)}
.when.future{background:var(--purtint);color:var(--pur)}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tm{border:2px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--mut)}
.tm.in{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.tm.me{box-shadow:0 0 0 2px var(--purtint)}
.wk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.wk .hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.sched{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rowhead,.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px}
.rowhead{background:#F8F9FC;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row{border-top:1px solid #F0F3F8}
.row .nm b{display:flex;gap:6px;align-items:center;font-size:15px}
.row .nm small{color:var(--mut);font-size:12.5px}
.cell{display:flex;gap:5px;flex-wrap:wrap}
.cb{border:2px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;font-size:13px;color:var(--mut);min-width:48px}
.cb.here.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cb.late.on{background:var(--org);border-color:var(--org);color:#fff}
.cb.abs.on{background:var(--bad);border-color:var(--bad);color:#fff}
.cb:hover:not(.on){border-color:var(--pur);color:var(--pur)}
.chip{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px}
.chip.here{background:var(--okbg);color:var(--ok)}
.chip.late{background:var(--warnbg);color:var(--warn)}
.chip.abs{background:var(--badbg);color:var(--bad)}
.chip.none{background:#EEF1F6;color:var(--mut);font-weight:700}
.chip.fut{background:#F6F2FC;color:#8E7BB5;font-weight:700}
.rap{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#fde8ea;flex:none}
.sheetbg{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 20px 26px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--mut);margin-bottom:14px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .two button{padding:14px;border-radius:12px;font-weight:800;font-size:16px;border:2px solid var(--pur);background:#fff;color:var(--pur)}
.sheet .two button.pri{background:var(--org);border-color:var(--org);color:#fff}
.sheet .cancel{display:block;width:100%;margin-top:10px;border:0;background:none;color:var(--mut);font-weight:700;padding:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;max-width:90vw}
.toast.err{background:var(--bad)}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .stepcard{min-width:210px}
  .weeks{grid-template-columns:1fr}
  .pane{padding:12px 12px 90px}
  .rowhead{display:none}
  .row{grid-template-columns:1fr 1fr}
  .row .nm{grid-column:1 / -1}
  .row .cell::before{content:attr(data-wk);flex:0 0 100%;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
}
.modal{background:#fff;width:min(760px,96vw);max-height:92vh;overflow:auto;border-radius:16px;padding:20px 22px;margin:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--mut);font-size:13.5px;margin-bottom:12px}
.modal textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.modal .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.modal table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.modal th{text-align:left;background:#F8F9FC;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 8px}
.modal td{border-top:1px solid #F0F3F8;padding:5px 8px}
.modalbg{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:60;display:flex;padding:10px}
</style>
</head>
<body>
<div class="gate" id="gate"><div id="authMsg">Checking access...</div></div>

<div class="hidden" id="app">
  <div class="top">
    <h1>Phase 1 Evening Management</h1>
    <div class="seg" id="courseTabs" role="tablist" aria-label="Course"></div>
    <div class="grow"></div>
    <a class="tbtn dir-only" href="admin-stage1-candidates.html">Stage 1 Candidates</a>
    <a class="tbtn dir-only" href="admin-comms.html">Comms</a>
  </div>

  <div class="main">
    <aside class="side">
      <div class="lab">Pick a job</div>
      <div class="steps" id="steps"></div>
    </aside>

    <section class="pane" id="pane">
      <div class="plain" id="plain"></div>
      <div id="msgs"></div>
      <div class="tools" id="tools"></div>
      <div class="rooms" id="rooms"></div>
      <div class="sumstrip" id="sum"></div>
      <div class="weeks" id="weeks"></div>
      <div class="sched hidden" id="schedWrap">
        <div class="rowhead"><div>Candidate</div><div id="h1"></div><div id="h2"></div></div>
        <div id="rows"></div>
      </div>
    </section>
  </div>
</div>
<div id="overlay"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
// ────────────────────────────────────────────────────────────────────────────
// Phase 1 Evening Management hub (2026-10-13, Jon).
// One page for running a Stage 1 evening course. This first release holds the
// WEEKLY REGISTER. Other jobs (people, assessment allocation, retest pool,
// assessment night, comms) are listed on the left; those that already exist
// open their current page, the rest are marked "coming" and move in here later.
//
// Register rules (Jon, 12 Oct 2026):
//  - Instructors are always in the same room. They mark themselves as arrived
//    and mark which of their candidates have arrived.
//  - After 18:45 (London) a "Here" tap asks "was this person late?".
//  - Week 1 and Week 2 sit side by side. Buttons only work on the date of that
//    week. The other week is view only. A Director can switch on "edit any
//    date" to correct or backfill a past week.
//
// Data: stage1_register/{candidateId} = {course, room, w1:{status,time,by,byName,at}, w2:{...}, updatedAt}
//       stage1_register_staff/{course}__w{1|2}__{uid} = {course, week, room, uid, name, time, at}
//       config/stage1_register = {lateAfter:"HH:MM"}  (optional, default 18:45)
// status is "here" | "late" | "absent".
// ────────────────────────────────────────────────────────────────────────────
initFirebase();

const ROOMS = STAGE1_TEACHING_ROOMS;
const DEFAULT_LATE_AFTER = "18:45";
const S = {
  user: null, role: null, isDirector: false, full: false, myName: "",
  courseDates: [],            // [{name,date}]
  mine: [],                   // candidates whose room team includes me (any course)
  course: null, room: null,
  cands: [],                  // candidates of the selected course I can see
  reg: {}, staff: {},         // live registers (by candidate id / by doc id)
  lateAfter: DEFAULT_LATE_AFTER, editAny: false,
  unsubs: []
};
const $ = id => document.getElementById(id);
function esc(v) { return (v == null ? "" : String(v)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── London date/time ────────────────────────────────────────────────────────
function londonNow() {
  const p = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { date: p.year + "-" + p.month + "-" + p.day, hm: p.hour + ":" + p.minute };
}
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function nice(iso) {
  return new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).replace(",", "");
}
// A course's three Mondays: week 1, week 2, assessment evening (the assessment date is the stored date)
function weekDates(courseName) {
  const c = S.courseDates.find(x => x.name === courseName);
  if (!c || !c.date) return null;
  return [addDays(c.date, -14), addDays(c.date, -7), c.date];
}
function weekState(iso) { const t = londonNow().date; return iso === t ? "today" : (iso < t ? "past" : "future"); }
function canEditWeek(n) {
  const d = weekDates(S.course); if (!d) return false;
  return S.editAny || weekState(d[n - 1]) === "today";
}

// ── Access ──────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = "signin.html"; return; }
  try {
    S.user = user;
    S.role = await resolveRole(user.uid, user.email || "");
    S.isDirector = S.role === ROLES.DIRECTOR;
    const stu = await isStudentFaculty(user.email || "").catch(() => false);
    const sen = await isSeniorFaculty(user.email || "").catch(() => false);
    S.full = S.isDirector || stu || sen;
    S.myName = user.displayName || (user.email || "").split("@")[0];
    try {
      const me = await db.collection(COLLECTIONS.people).doc(user.uid).get();
      if (me.exists && me.data().name) S.myName = me.data().preferredName ? me.data().name : me.data().name;
    } catch (e) {}

    const snap = await db.collection(COLLECTIONS.stage1Candidates).where("instructorTeamUids", "array-contains", user.uid).get();
    S.mine = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

    if (!S.full && !S.mine.length) {
      $("authMsg").textContent = "This page is for instructors with a room on a Phase 1 course. You are not on a room team yet. Ask the Course Director if this looks wrong.";
      return;
    }
    const cfg = await db.collection("config").doc("stage1_course_dates").get();
    S.courseDates = ((cfg.exists && cfg.data().courses) || []).filter(c => c.name && c.date).sort((a, b) => a.date < b.date ? -1 : 1);
    try {
      const lc = await db.collection("config").doc("stage1_register").get();
      if (lc.exists && lc.data().lateAfter) S.lateAfter = lc.data().lateAfter;
    } catch (e) {}

    document.querySelectorAll(".dir-only").forEach(el => { if (!S.full) el.classList.add("hidden"); });
    $("gate").classList.add("hidden");
    $("app").classList.remove("hidden");
    renderSteps();
    renderCourseTabs();
    // default course: first whose assessment date is today or later, else the last
    const today = londonNow().date;
    let first = S.courseDates.find(c => c.date >= today) || S.courseDates[S.courseDates.length - 1];
    if (!S.full) { // instructors: only courses where they have candidates
      const mineCourses = new Set(S.mine.map(c => c.course));
      first = S.courseDates.find(c => mineCourses.has(c.name) && c.date >= today) || S.courseDates.find(c => mineCourses.has(c.name)) || first;
    }
    if (first) selectCourse(first.name);
    else $("plain").innerHTML = '<span class="lbl">Nothing set up yet</span>No course dates are set. A Director can add them on Stage 1 Settings.';
  } catch (err) {
    console.error(err);
    $("authMsg").textContent = "Could not open this page: " + (err && err.message ? err.message : err);
  }
});

// ── Left-hand list of jobs ──────────────────────────────────────────────────
function renderSteps() {
  const jobs = [
    { no: 1, t: "People", s: "Add, remove, move, tags", href: "admin-stage1-candidates.html", dir: true },
    { no: 2, t: "Assessment allocation", s: "Rooms and time slots for assessment night", href: "admin-stage1-assessment-allocation.html", dir: true },
    { no: 3, t: "Retest pool and reallocation", s: "Coming: attempt 2 and above, managed by the team", soon: true },
    { no: 4, t: "Assessment night", s: "Coming: runner view, assessor view, assessment form", soon: true },
    { no: 5, t: "Register", s: "Who arrived in weeks 1 and 2", on: true },
    { no: 6, t: "Comms", s: "Bulk emails, copy addresses, log", href: "admin-comms.html", dir: true }
  ];
  $("steps").innerHTML = jobs.filter(j => !(j.dir && !S.full)).map(j => {
    if (j.on) return `<div class="stepcard on"><span class="no">${j.no}</span><span><b>${esc(j.t)}</b><small>${esc(j.s)}</small></span></div>`;
    if (j.soon) return `<div class="stepcard soon"><span class="no">${j.no}</span><span><b>${esc(j.t)}</b><small>${esc(j.s)}</small></span></div>`;
    return `<a class="stepcard link" href="${j.href}"><span class="no">${j.no}</span><span><b>${esc(j.t)}</b><small>${esc(j.s)} (opens current page)</small></span></a>`;
  }).join("");
}

function renderCourseTabs() {
  const today = londonNow().date;
  let list = S.courseDates;
  if (!S.full) { const set = new Set(S.mine.map(c => c.course)); list = list.filter(c => set.has(c.name)); }
  const live = list.find(c => c.date >= today);
  $("courseTabs").innerHTML = list.map(c =>
    `<button type="button" data-course="${esc(c.name)}" class="${c.name === S.course ? "on" : ""}">${esc(c.name)}${live && live.name === c.name ? '<span class="nowdot">next</span>' : ""}</button>`
  ).join("");
  $("courseTabs").querySelectorAll("button").forEach(b => b.onclick = () => selectCourse(b.dataset.course));
}

// ── Loading a course ────────────────────────────────────────────────────────
function detach() { S.unsubs.forEach(u => { try { u(); } catch (e) {} }); S.unsubs = []; }
async function selectCourse(name) {
  detach();
  S.course = name; S.reg = {}; S.staff = {}; S.cands = [];
  renderCourseTabs();
  $("plain").innerHTML = '<span class="lbl">Loading</span>Opening ' + esc(name) + '...';
  try {
    if (S.full) {
      const snap = await db.collection(COLLECTIONS.stage1Candidates).where("course", "==", name).get();
      S.cands = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    } else {
      S.cands = S.mine.filter(c => c.course === name);
    }
  } catch (err) {
    $("plain").innerHTML = '<span class="lbl">Could not load</span>' + esc(err.message || err);
    return;
  }
  // pick a room: mine first
  const myRooms = [...new Set(S.mine.filter(c => c.course === name).map(c => c.room).filter(Boolean))];
  const present = roomList();
  S.room = (S.room && present.includes(S.room) && (S.full || myRooms.includes(S.room))) ? S.room : (myRooms[0] || present[0] || null);
  attachListeners();
  render();
}
function roomList() {
  const set = new Set(S.cands.map(c => c.room).filter(Boolean));
  return ROOMS.filter(r => set.has(r)).concat([...set].filter(r => !ROOMS.includes(r)).sort());
}
function attachListeners() {

// ── Helpers on the data ─────────────────────────────────────────────────────
function roomCands() {

function statusOf(cid, n) { const r = S.reg[cid]; return r && r["w" + n] ? r["w" + n].status : null; }
function entryOf(cid, n) { const r = S.reg[cid]; return r && r["w" + n] ? r["w" + n] : null; }
function counts(list, n) {
  let here = 0, late = 0, absent = 0;
  list.forEach(c => { const s = statusOf(c.id, n); if (s === "here") here++; else if (s === "late") late++; else if (s === "absent") absent++; });

function teamOf(list) {

  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 6000 : 2200);

function candById(id) { return S.cands.find(c => c.id === id); }

function onTap(cid, n, wanted) {

// ── Backfill from a spreadsheet paste (Director, any course, week 1 or 2) ───
// Paste rows copied from a spreadsheet. A row is matched to a candidate on this
// course by email, or by name (first/last in either order, in one cell or two).
// A status cell says Here / Late / Absent (also P, L, A, Y, N, tick, cross).
// Rows with no status are left unmarked. Nothing is written until "Apply".
let bf = { week: 1, plan: null };
function normName(t) { return String(t || "").toLowerCase().replace(/[^a-z\u00c0-\u024f\s'-]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean).sort().join(" "); }
function statusToken(cell) {
  const t = String(cell || "").trim().toLowerCase();
  if (!t) return null;
  if (/^(here|present|p|y|yes|1|\u2713|\u2714|attended|in|on time|ok)$/.test(t)) return "here";
  if (/^(late|l)$/.test(t)) return "late";
  if (/^(absent|a|n|no|0|\u2717|\u2718|x|dna|did not attend|missed)$/.test(t)) return "absent";
  return null;
}
function parseBackfill(text) {
  const byEmail = new Map(), byName = new Map();
  S.cands.forEach(c => {
    if (c.email) byEmail.set(String(c.email).trim().toLowerCase(), c);
    const k = normName(c.name); if (!k) return;
    byName.set(k, byName.has(k) ? "dup" : c);
  });
  const matched = new Map(), unmatched = [], noStatus = [], dups = [], conflicts = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = line.split(line.includes("\t") ? "\t" : ",").map(x => x.trim());
    if (cells.some(x => /^(surname|last name|first name|email|e-mail|name|status|room)$/i.test(x)) && !cells.some(statusToken)) return; // header row
    let cand = null, ambiguous = false;
    const em = cells.find(x => /@/.test(x));
    if (em) cand = byEmail.get(em.toLowerCase()) || null;
    if (!cand) {
      const textCells = cells.filter(x => x && !/@/.test(x) && !statusToken(x));
      const tries = [];
      if (textCells.length >= 2) { tries.push(textCells[0] + " " + textCells[1]); }
      textCells.forEach(x => tries.push(x));
      for (const t of tries) { const hit = byName.get(normName(t)); if (hit === "dup") ambiguous = true; else if (hit) { cand = hit; break; } }
    }
    const st = cells.map(statusToken).filter(Boolean).pop() || null;
    if (!cand) { (ambiguous ? dups : unmatched).push(line); return; }
    if (!st) { noStatus.push(cand.name); return; }
    if (matched.has(cand.id) && matched.get(cand.id).status !== st) conflicts.push(cand.name);
    matched.set(cand.id, { cand, status: st });
  });
  return { matched: [...matched.values()], unmatched, noStatus, dups, conflicts };
}
function openBackfill() {
  if (!S.isDirector) return;
  bf.plan = null;
  $("overlay").innerHTML = `<div class="modalbg" id="bfbg"><div class="modal" role="dialog" aria-modal="true">` +
    `<h3>Backfill from a spreadsheet</h3>` +
    `<div class="sub">${esc(S.course)}, every room. Copy the rows from your spreadsheet and paste them below. Each row needs the candidate's <b>email or name</b> and a status of <b>Here, Late or Absent</b> (P, L, A, Y, N, a tick or a cross also work). Rows with no status are left unmarked.</div>` +
    `<div class="row2"><label class="tg">Week <select id="bfWeek"><option value="1">1 (${esc(nice((weekDates(S.course) || [])[0] || "2000-01-01"))})</option><option value="2">2 (${esc(nice((weekDates(S.course) || [])[1] || "2000-01-01"))})</option></select></label>` +
    `<label class="tg"><input type="checkbox" id="bfOver"> Replace entries that are already marked</label></div>` +
    `<textarea id="bfText" placeholder="Surname\tFirst name\temail\tstatus"></textarea>` +
    `<div class="row2"><button class="btn" id="bfCheck" type="button">Check</button><button class="btn pri" id="bfApply" type="button" disabled>Apply</button><button class="btn" id="bfClose" type="button">Close</button></div>` +
    `<div id="bfOut"></div></div></div>`;
  $("bfWeek").value = String(bf.week);
  $("bfClose").onclick = () => { $("overlay").innerHTML = ""; };
  $("bfCheck").onclick = checkBackfill;
  $("bfApply").onclick = applyBackfill;
}
function checkBackfill() {
  bf.week = +$("bfWeek").value;
  const over = $("bfOver").checked;
  const plan = parseBackfill($("bfText").value);
  const todo = plan.matched.filter(m => over || !statusOf(m.cand.id, bf.week));
  const skipped = plan.matched.length - todo.length;
  bf.plan = Object.assign({}, plan, { todo });
  const tally = k => todo.filter(m => m.status === k).length;
  let h = `<div class="msg ${todo.length ? "ok" : "warn"}">${todo.length} will be written: ${tally("here")} here, ${tally("late")} late, ${tally("absent")} absent.${skipped ? " " + skipped + " already marked, left as they are." : ""}</div>`;
  if (plan.unmatched.length) h += `<div class="msg warn">${plan.unmatched.length} row(s) did not match anyone on ${esc(S.course)}:<br>${plan.unmatched.slice(0, 8).map(esc).join("<br>")}${plan.unmatched.length > 8 ? "<br>..." : ""}</div>`;
  if (plan.dups.length) h += `<div class="msg warn">${plan.dups.length} row(s) matched two people with the same name. Use their email instead.</div>`;
  if (plan.conflicts.length) h += `<div class="msg warn">Listed twice with different statuses (last one used): ${plan.conflicts.map(esc).join(", ")}</div>`;
  if (plan.noStatus.length) h += `<div class="msg warn">${plan.noStatus.length} matched but had no status, so left unmarked.</div>`;
  const missing = S.cands.filter(c => !plan.matched.some(m => m.cand.id === c.id) && !statusOf(c.id, bf.week)).length;
  h += `<div class="hint" style="color:var(--mut);font-size:13px">${missing} people on ${esc(S.course)} will still be unmarked for week ${bf.week}.</div>`;
  h += `<table><tr><th>Candidate</th><th>Room</th><th>Will be</th></tr>${todo.slice(0, 60).map(m => `<tr><td>${esc(m.cand.name)}</td><td>${esc(m.cand.room || "")}</td><td>${m.status === "here" ? "Here" : m.status === "late" ? "Late" : "Absent"}</td></tr>`).join("")}</table>` +
    (todo.length > 60 ? `<div class="hint" style="font-size:13px;color:var(--mut)">...and ${todo.length - 60} more.</div>` : "");
  $("bfOut").innerHTML = h;
  $("bfApply").disabled = !todo.length;
}
async function applyBackfill() {
  if (!bf.plan || !bf.plan.todo.length) return;
  const n = bf.week, todo = bf.plan.todo;
  $("bfApply").disabled = true; $("bfApply").textContent = "Writing...";
  try {
    for (let i = 0; i < todo.length; i += 400) {
      const batch = db.batch();
      todo.slice(i, i + 400).forEach(m => {
        const p = { course: S.course, room: m.cand.room || null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        p["w" + n] = { status: m.status, time: null, by: S.user.uid, byName: S.myName, at: firebase.firestore.FieldValue.serverTimestamp(), backfill: true };
        batch.set(db.collection("stage1_register").doc(m.cand.id), p, { merge: true });
      });
      await batch.commit();
    }
    $("overlay").innerHTML = "";
    toast(todo.length + " entries written to week " + n + ".");
  } catch (err) {
    $("bfApply").disabled = false; $("bfApply").textContent = "Apply";
    $("bfOut").insertAdjacentHTML("afterbegin", `<div class="msg err">Not saved: ${esc(err.message || err)}</div>`);
  }
}
</script>
</body>
</html>
