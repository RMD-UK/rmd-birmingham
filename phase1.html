<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Monday Night Hub - RMD Birmingham</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#1A2233; --mut:#6B7C93; --line:#E3E8EF; --bg:#F5F7FA; --card:#fff;
  --pur:#44247C; --pur2:#2E1856; --purtint:#EFEAF8; --blu:#0067A4; --org:#F49001;
  --ok:#1E8449; --okbg:#E3F3E8; --bad:#B3261E; --badbg:#FCE8E6; --warn:#8A5200; --warnbg:#FFF1D6;
  --font:'Inter','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
.gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-weight:700;color:var(--pur)}
.top{background:var(--pur);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px}
.top .grow{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px;opacity:.85}
.seg button.on{background:#fff;color:var(--pur);opacity:1}
.seg.test{background:rgba(255,190,100,.22)}
.seg.test .tl{align-self:center;color:#ffd9a0;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0 6px 0 10px}
.seg.test button{color:#ffe9c8}
.seg.test button.on{background:#ffe3b8;color:#6a3d00}
.seg button .nowdot{display:inline-block;background:var(--ok);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}
.tbtn:hover{background:rgba(255,255,255,.26)}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
.main>*{min-width:0}
.steps{max-width:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:58px;min-height:calc(100vh - 58px)}
.side .lab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.steps{display:flex;flex-direction:column;gap:8px}
.stepcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;line-height:1.25}
.stepcard .no{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:#C9D1DE;color:#fff;font-size:14px;font-weight:800}
.stepcard b{display:block;font-size:15px;font-weight:800}
.stepcard small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;font-weight:500}
.stepcard.on{border-color:var(--pur);background:var(--purtint)}
.stepcard.on .no{background:var(--pur)}
.stepcard.on b{color:var(--pur)}
.stepcard.link:hover{border-color:var(--blu)}
.stepcard.link .no{background:var(--blu)}
.stepcard.soon{opacity:.55;cursor:default}
.pane{padding:16px 20px 90px;min-width:0}
.plain{background:#fff;border:1px solid var(--line);border-left:6px solid var(--pur);border-radius:14px;padding:14px 18px;margin-bottom:14px;font-size:17px;line-height:1.55}
.plain .lbl{display:block;font-size:11px;font-weight:800;color:var(--pur);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.plain .mut{color:var(--mut)}
.msg{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.err{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools select{padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.btn{border:2px solid var(--pur);background:#fff;color:var(--pur);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px}
.btn.pri{background:var(--pur);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.tg{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.tg input{width:18px;height:18px;accent-color:var(--pur)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-bottom:14px}
.rooms .r{background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;text-align:left;color:var(--ink)}
.rooms .r b{font-size:14px;display:block}
.rooms .r small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rooms .r.on{border-color:var(--pur);background:var(--purtint)}
.rooms .r.mine{box-shadow:inset 4px 0 0 var(--org)}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:130px}
.tile .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.tile.warn .n{color:var(--bad)}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.wk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wk h3{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk .when{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px}
.when.today{background:var(--okbg);color:var(--ok)}
.when.past{background:#EEF1F6;color:var(--mut)}
.when.future{background:var(--purtint);color:var(--pur)}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tm{border:2px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--mut)}
.tm.in{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.tm.me{box-shadow:0 0 0 2px var(--purtint)}
.wk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.wk .hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.sched{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rowhead,.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px}
.rowhead{background:#F8F9FC;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row{border-top:1px solid #F0F3F8}
.row .nm b{display:flex;gap:6px;align-items:center;font-size:15px}
.row .nm small{color:var(--mut);font-size:12.5px}
.cell{display:flex;gap:5px;flex-wrap:wrap}
.cb{border:2px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;font-size:13px;color:var(--mut);min-width:48px}
.cb.here.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cb.late.on{background:var(--org);border-color:var(--org);color:#fff}
.cb.abs.on{background:var(--bad);border-color:var(--bad);color:#fff}
.cb:hover:not(.on){border-color:var(--pur);color:var(--pur)}
.cb:disabled,.cb:disabled:hover{background:#EEF1F6;border-color:#E3E8F0;color:#B4BCC9;cursor:not-allowed}
.row .nm .fac{display:block;color:var(--warn);font-size:12.5px;font-weight:800;margin-top:2px}
.chip{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px}
.chip.here{background:var(--okbg);color:var(--ok)}
.chip.late{background:var(--warnbg);color:var(--warn)}
.chip.abs{background:var(--badbg);color:var(--bad)}
.chip.none{background:#EEF1F6;color:var(--mut);font-weight:700}
#elOv .lb{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 4px}
.row .nm .lw{display:inline-block;margin:3px 0 0 6px;font-size:11.5px;padding:3px 8px}
.sentc .srow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid #F0F3F8;padding:8px 0}
.sentc .snm small{color:var(--mut);font-size:12.5px}
.sentc .spanel{background:#F7F4FC;border:2px solid #E3DAF3;border-radius:12px;padding:10px 12px;margin:4px 0 8px;display:flex;flex-direction:column;gap:6px}
.sentc .sopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--ink)}
.sentc .sopt b{display:block;font-size:14px}.sentc .sopt small{display:block;color:var(--mut);font-size:12.5px}
.sentc .sopt.on{border-color:var(--pur);background:#EFEAF8}
.sentc .ropt.on{border-color:var(--pur);background:#EFEAF8;color:var(--pur)}
.sentc .lb{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px}
.chip.fut{background:#F6F2FC;color:#8E7BB5;font-weight:700}
.rap{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#fde8ea;flex:none}
.sheetbg{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 20px 26px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--mut);margin-bottom:14px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .two button{padding:14px;border-radius:12px;font-weight:800;font-size:16px;border:2px solid var(--pur);background:#fff;color:var(--pur)}
.sheet .two button.pri{background:var(--org);border-color:var(--org);color:#fff}
.sheet .cancel{display:block;width:100%;margin-top:10px;border:0;background:none;color:var(--mut);font-weight:700;padding:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;max-width:90vw}
.toast.err{background:var(--bad)}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .stepcard{min-width:210px}
  .weeks{grid-template-columns:1fr}
  .pane{padding:12px 12px 90px}
  .rowhead{display:none}
  .row{grid-template-columns:1fr 1fr}
  .row .nm{grid-column:1 / -1}
  .row{gap:8px;align-items:stretch}
  .row .cell{align-content:flex-start;gap:3px;padding:8px 6px 9px;border-radius:12px;border:1px solid var(--line)}
  .row .cell .cb{min-width:0;padding:8px 5px;font-size:12px;flex:0 0 auto}
  .row .cell::before{content:attr(data-wk);flex:0 0 100%;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;padding-bottom:5px;border-bottom:2px solid currentColor}
  .row .cell[data-wk^="Week 1"]{background:#EAF1FB;border-color:#C9DAF2}
  .row .cell[data-wk^="Week 1"]::before{color:#1F5AA6}
  .row .cell[data-wk^="Week 2"]{background:#F1EBFB;border-color:#D8C9F1}
  .row .cell[data-wk^="Week 2"]::before{color:#5B2A9E}
}
.modal{background:#fff;width:min(760px,96vw);max-height:92vh;overflow:auto;border-radius:16px;padding:20px 22px;margin:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--mut);font-size:13.5px;margin-bottom:12px}
.modal textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.modal .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.modal table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.modal th{text-align:left;background:#F8F9FC;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 8px}
.modal td{border-top:1px solid #F0F3F8;padding:5px 8px}
.modalbg{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:60;display:flex;padding:10px}
.att{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;background:#1E8449;flex:none}
.att.a2{background:#F49001}.att.a3{background:#B3261E}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.gt{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.gt:last-child{border-bottom:0}
.gt .gts{flex:none;min-width:48px;height:fit-content;text-align:center;font-size:11px;font-weight:800;border-radius:8px;padding:4px 6px}
.gt.ok .gts{background:var(--okbg);color:var(--ok)}.gt.warn .gts{background:var(--warnbg);color:var(--warn)}.gt.block .gts{background:var(--badbg);color:var(--bad)}
.gt .gtd{font-size:13.5px;color:var(--mut);margin-top:2px}.gt .gtd a{color:var(--pur);font-weight:700}
.gt details{margin-top:4px;font-size:13px}.gt .gtn{padding:4px 0;color:var(--ink,#1f2540)}
.stephd{display:flex;align-items:center;gap:10px;margin:16px 0 6px;padding-top:14px;border-top:2px solid var(--line)}
.stephd:first-child{margin-top:0;padding-top:0;border-top:0}
.stephd h3{margin:0;flex:1}
.stchip{font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;background:#EEF1F6;color:var(--mut)}
.stchip.ok{background:var(--okbg);color:var(--ok)}.stchip.open{background:var(--org);color:#fff}.stchip.bad{background:var(--badbg);color:var(--bad)}
.stbody.locked{opacity:.5;pointer-events:none}
.lockmsg{font-size:13.5px;color:var(--mut);font-weight:600;margin:2px 0 6px}
.card summary .stepno{margin-right:8px}
.card .stepno{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--pur);color:#fff;font-size:14px;font-weight:800}
.card .hint{font-size:13px;color:var(--mut);margin-top:6px}
.card input[type=search],.card textarea,.card input[type=text]{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px}
.card textarea{min-height:130px;font-size:14px}
.pick{border:2px solid var(--line);border-radius:10px;max-height:190px;overflow:auto;margin:8px 0}
.pick div{padding:7px 10px;border-top:1px solid #F0F3F8;cursor:pointer;font-size:14px}
.pick div:first-child{border-top:0}.pick div:hover{background:#FAFAFE}.pick small{color:var(--mut)}
.selbox{background:var(--purtint);border:2px solid var(--pur);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbox b{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.slotchip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.slotchip.on{border-color:var(--pur);background:var(--pur);color:#fff}
.slotchip:hover:not(.on){border-color:var(--pur)}
.grid{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;max-height:420px}
.grid table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;background:#F8F9FC;padding:5px 7px;font-size:11px;color:var(--mut)}
.grid td{border:1px solid #F0F3F8;padding:2px;text-align:center;min-width:46px}
.grid td.t{background:#F8F9FC;font-weight:800;position:sticky;left:0}
.gc{border:0;background:var(--okbg);color:var(--ok);border-radius:6px;padding:4px 6px;font-weight:800;font-size:11px;width:100%}
.gc.on{background:var(--pur);color:#fff}
.gx{display:block;background:#EEF1F6;color:#9AA7BA;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700}
details.lst{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.lst summary{padding:10px 14px;font-weight:800;cursor:pointer}
details.lst .in{padding:0 14px 12px}
.lrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #F0F3F8;flex-wrap:wrap}
.lrow .nm{flex:1;min-width:150px;font-weight:700;display:flex;gap:6px;align-items:center}
.lrow small{color:var(--mut);font-weight:500}
.agroup{margin:14px 0 2px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.lrow.arow2{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}.lrow.arow2 .nm{min-width:0}.lrow.arow2 .adeg{text-align:right}.lrow.arow2 .atl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.lrow.arow2 .atl i{font-style:normal;color:var(--mut)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:2px solid var(--pur);background:#fff;color:var(--pur);font-weight:800;font-size:16px;line-height:1}
.emailbox{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.log{font-size:13px;color:var(--mut);margin-top:6px}

.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.rhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;width:100%;text-align:left;border:0;background:#fff;padding:13px 16px;color:var(--ink)}
.rhead b{font-size:18px;font-weight:800;min-width:54px}
.rhead .rmeta{font-size:13.5px;color:var(--mut);font-weight:600}
.rhead .rhint{margin-left:auto;font-size:12px;color:var(--pur);font-weight:700}
.rhead{display:flex;align-items:center;gap:8px;padding:0 12px 0 0;border:0;background:#fff}
.rmain{flex:1 1 220px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;text-align:left;border:0;background:transparent;padding:13px 16px;color:var(--ink);cursor:pointer}
.racts{display:flex;gap:6px;flex:none}
.rbanner{background:#EFE9FA;border:1px solid #D9CFF0;border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:13.5px;color:#2a1655}
.rbanner b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.rbanner .tools{margin-top:8px}
.rcard.open{border-color:var(--pur)}
.rcard.open .rhead{background:var(--purtint)}
.rbody{padding:4px 8px 10px}
.bad{color:var(--bad);font-weight:800}
.rrow,.arow{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid #F0F3F8;background:#fff;padding:10px 8px;color:var(--ink)}
.rrow:hover:not(:disabled),.arow:hover{background:#FAFAFE}
.rrow.done,.arow.done{opacity:.5;background:#F6F7FA}
.rrow.flag{background:var(--badbg)}
.rrow.due{background:var(--warnbg)}
.rrow.big{padding:16px 10px;font-size:20px}
.rt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--pur)}
.rn{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-weight:700}
.rn small{flex-basis:100%;color:var(--mut);font-weight:500;font-size:12.5px}
.rs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rsep{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 2px;border-top:1px solid #F0F3F8}
.nchip{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:3px 9px;background:#EEF1F6;color:var(--mut)}
.nchip.pass{background:var(--okbg);color:var(--ok)}
.nchip.exc-chip{background:#FFF3C4;color:#6B4E00}
.exc{margin:0 0 10px}
.fqb.exc-b.on{background:#FFE08A;border-color:#B8860B;color:#4A3500}

<script>
// ────────────────────────────────────────────────────────────────────────────
// Monday Night Hub hub (2026-10-13, Jon).
// One page for running a Stage 1 evening course. This first release holds the
// WEEKLY REGISTER. Other jobs (people, assessment allocation, retest pool,
// assessment night, comms) are listed on the left; those that already exist
// open their current page, the rest are marked "coming" and move in here later.
//
// Register rules (Jon, 12 Oct 2026):
//  - Instructors are always in the same room. They mark themselves as arrived
//    and mark which of their candidates have arrived.
//  - After 18:45 (London) a "Here" tap asks "was this person late?".
//  - Week 1 and Week 2 sit side by side. Buttons only work on the date of that
//    week. The other week is view only. A Director can switch on "edit any
//    date" to correct or backfill a past week.
//
// Data: stage1_register/{candidateId} = {course, room, w1:{status,time,by,byName,at}, w2:{...}, updatedAt}
//       stage1_register_staff/{course}__w{1|2}__{uid} = {course, week, room, uid, name, time, at}
//       config/stage1_register = {lateAfter:"HH:MM"}  (optional, default 18:45)
// status is "here" | "late" | "absent".
// ────────────────────────────────────────────────────────────────────────────
initFirebase();

const ROOMS = STAGE1_TEACHING_ROOMS;
const DEFAULT_LATE_AFTER = "18:45";
const S = {
  user: null, role: null, isDirector: false, full: false, myName: "",
  courseDates: [],            // [{name,date}]
  mine: [],                   // candidates whose room team includes me (any course)
  course: null, room: null,
  cands: [],                  // candidates of the selected course I can see
  reg: {}, staff: {},         // live registers (by candidate id / by doc id)
  lateAfter: DEFAULT_LATE_AFTER, editAny: false,
  unsubs: [], view: "register"
};
const $ = id => document.getElementById(id);
function esc(v) { return (v == null ? "" : String(v)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── London date/time ────────────────────────────────────────────────────────
function londonNow() {
  const p = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { date: p.year + "-" + p.month + "-" + p.day, hm: p.hour + ":" + p.minute };
}
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function nice(iso) {
  return new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).replace(",", "");
}
// A course's three Mondays: week 1, week 2, assessment evening (the assessment date is the stored date)
// Teaching weeks only: null for the catch-up night (it has no teaching evenings), so the register screens treat it as "no register".
function teachDates(courseName) { const c = S.courseDates.find(x => x.name === courseName); return isCatchupCourse(c) ? null : weekDates(courseName); }
function weekDates(courseName) {
  const c = S.courseDates.find(x => x.name === courseName);
  if (!c || !c.date) return null;
  return [addDays(c.date, -14), addDays(c.date, -7), c.date];
}
function weekState(iso) { const t = londonNow().date; return iso === t ? "today" : (iso < t ? "past" : "future"); }
function canEditWeek(n) {
  const d = teachDates(S.course); if (!d) return false;
  return S.editAny || weekState(d[n - 1]) === "today";
}

auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = "signin.html"; return; }
  try {
    S.user = user;
    S.role = await resolveRole(user.uid, user.email || "");
    S.isDirector = S.role === ROLES.DIRECTOR;
    const stu = await isStudentFaculty(user.email || "").catch(() => false);
    const sen = await isSeniorFaculty(user.email || "").catch(() => false);
    S.sen = sen; S.stu = stu;
    S.full = S.isDirector || stu || sen;
    S.night = S.full || S.role === "faculty" || S.role === "assessor-faculty" || S.role === "assessor";   // can use the assessment night views
    if (!S.night) {
      // Assessment night team (e.g. Senior Instructors) and named extra assessors: email lists in config.
      try {
        const em = String(user.email || "").toLowerCase();
        const [tm, nm0] = await Promise.all([db.collection("config").doc("stage1_assessors").get(), db.collection("config").doc("stage1_named_assessors").get()]);
        const has = d => d.exists && (d.data().emails || []).some(x => String(x).toLowerCase() === em);
        if (em && (has(tm) || has(nm0))) S.night = true;
        S.teamOnly = !!(em && has(tm) && !has(nm0));   // 21 Oct (Jon): Senior Instructors are instructors only. On the night list for the runner view, never assessing.
      } catch (e) {}
    }
    if (S.isDirector) {
      try { const tm2 = await db.collection("config").doc("stage1_assessors").get(); N.team = tm2.exists ? (tm2.data().emails || []) : []; } catch (e) {}
    }
    S.myName = user.displayName || (user.email || "").split("@")[0];
    try {
      const me = await db.collection(COLLECTIONS.people).doc(user.uid).get();
      if (me.exists && me.data().name) S.myName = me.data().preferredName ? me.data().name : me.data().name;
    } catch (e) {}

    const snap = await db.collection(COLLECTIONS.stage1Candidates).where("instructorTeamUids", "array-contains", user.uid).get();
    S.mine = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    S.run = S.night || S.mine.length > 0;   // v26 (20 Oct): rules v25 and getAssessmentNight v25 are deployed, so room instructors can use the runner view (Collect, Not answering).

    if (!S.night && !S.mine.length) {
      $("authMsg").textContent = "This page is for instructors with a room on a Monday Night course. You are not on a room team yet. Ask the Course Director if this looks wrong.";
      return;
    }
    if (!S.full && !S.mine.length) S.view = "runner";   // assessors with no room team land on the assessment night
    // Deep links (Readiness check, Director Box): phase1.html#setup, #alloc, #retest, #runner, #assessor, #register. Only honoured if this person may use that view.
    { const hv = (location.hash || "").replace("#", "");
      if (hv === "setup" ? S.isDirector : (hv === "alloc" || hv === "retest" || hv === "plan") ? S.full : hv === "runner" ? S.run : hv === "assessor" ? (S.night && !S.teamOnly) : hv === "register") S.view = hv; }
    const cfg = await db.collection("config").doc("stage1_course_dates").get();
    S.courseDates = ((cfg.exists && cfg.data().courses) || []).filter(c => c.name && c.date).sort((a, b) => a.date < b.date ? -1 : 1);
    try {
      const lc = await db.collection("config").doc("stage1_register").get();
      if (lc.exists && lc.data().lateAfter) S.lateAfter = lc.data().lateAfter;
    } catch (e) {}

    document.querySelectorAll(".dir-only").forEach(el => { if (!S.full) el.classList.add("hidden"); });
    $("gate").classList.add("hidden");
    $("app").classList.remove("hidden");
    restoreDoor();
    showView();
    renderSteps();
    renderCourseTabs();
    // default course: first whose assessment date is today or later, else the last
    const today = londonNow().date;
    // Real courses come first; the TEST courses are only the fallback when there is nothing else.
    const realDates = S.courseDates.filter(c => !isTestCourse(c)), pool = realDates.length ? realDates : S.courseDates;
    let first = pool.find(c => c.date >= today) || pool[pool.length - 1];
    if (!S.night) { // instructors: only courses where they have candidates
      const mineCourses = new Set(S.mine.map(c => c.course));
      const mp = pool.filter(c => mineCourses.has(c.name)), ma = S.courseDates.filter(c => mineCourses.has(c.name));
      first = mp.find(c => c.date >= today) || mp[0] || ma.find(c => c.date >= today) || ma[0] || first;
    }
    { const wantC = new URLSearchParams(location.search).get("course"), wc = wantC && S.courseDates.find(c => c.name === wantC); if (wc && (S.night || S.mine.some(m => m.course === wc.name))) first = wc; }   // ?course=Course 2 from the Director Box
    if (first) selectCourse(first.name);
    else $("plain").innerHTML = '<span class="lbl">Nothing set up yet</span>No course dates are set. A Director can add them on Stage 1 Settings.';
  } catch (err) {
    console.error(err);
    $("authMsg").textContent = "Could not open this page: " + (err && err.message ? err.message : err);
  }
});

      return `<div class="cell" data-wk="Week ${n} · ${nice(d)}">` +
        `<button type="button" class="cb here${cur === "here" ? " on" : ""}" data-set="here" data-n="${n}" data-id="${esc(c.id)}"${dis}>Here</button>` +
        `<button type="button" class="cb late${cur === "late" ? " on" : ""}" data-set="late" data-n="${n}" data-id="${esc(c.id)}"${dis}>Late</button>` +
        `<button type="button" class="cb abs${cur === "absent" ? " on" : ""}" data-set="absent" data-n="${n}" data-id="${esc(c.id)}"${dis}>Absent</button></div>`;
    }
    let chip;

    else if (cur === "late") chip = `<span class="chip late">Late${en && en.time ? " " + esc(en.time) : ""}</span>`;

  $("rows").innerHTML = list.map(c =>

  ).join("") || '<div class="row"><div class="nm">No candidates in this room.</div></div>';
  $("schedWrap").classList.remove("hidden");
  $("rows").querySelectorAll("[data-set]").forEach(b => b.onclick = () => onTap(b.dataset.id, +b.dataset.n, b.dataset.set));

function toast(text, isErr) {
  const t = document.createElement("div"); t.className = "toast" + (isErr ? " err" : ""); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 6000 : 2200);
}
function candById(id) { return S.cands.find(c => c.id === id); }

function onTap(cid, n, wanted) {
  const cur = statusOf(cid, n);
  const c = candById(cid); if (!c) return;
  if (!canEditWeek(n)) { toast("That week can only be changed on its own date.", true); return; }
  if (needsFaculty(cid, n)) { toast("Absent in week 1. Send " + (c.name || "them") + " to RMD faculty.", true); return; }
  if (cur === wanted) { writeStatus(c, n, null); return; }          // tap the lit button again to clear it
  const now = londonNow();
  if (wanted === "here" && !S.editAny && weekState(teachDates(S.course)[n - 1]) === "today" && now.hm > S.lateAfter) {

async function writeStatus(c, n, status) {
  const ref = db.collection("stage1_register").doc(c.id);

    ? { status, time: londonNow().hm, by: S.user.uid, byName: S.myName, at: firebase.firestore.FieldValue.serverTimestamp() }
    : firebase.firestore.FieldValue.delete();
  try { await ref.set(payload, { merge: true }); }
  catch (err) { toast("Not saved: " + (err.code === "permission-denied" ? "you do not have permission (rules not deployed yet?)" : err.message), true); }
}
async function allHere(n) {
  if (!canEditWeek(n)) return;
  const todo = roomCands().filter(c => !statusOf(c.id, n) && !w1AbsentOpen(c.id, n));
  if (!todo.length) return;
  const now = londonNow();
  if (!S.editAny && now.hm > S.lateAfter) { toast("After " + S.lateAfter + " each person has to be marked one by one.", true); return; }
  try {
    // Small batches on purpose: for a room instructor the security rules look up
    // each candidate's room team, and Firestore allows only 20 such lookups in
    // one batched write. Eight at a time stays well inside that limit.
    for (let i = 0; i < todo.length; i += 8) {
      const batch = db.batch();
      todo.slice(i, i + 8).forEach(c => {
        const p = { course: S.course, room: c.room || null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        p["w" + n] = { status: "here", time: now.hm, by: S.user.uid, byName: S.myName, at: firebase.firestore.FieldValue.serverTimestamp() };
        batch.set(db.collection("stage1_register").doc(c.id), p, { merge: true });
      });
      await batch.commit();
    }
    toast(todo.length + " marked as here.");
  } catch (err) { toast("Not saved: " + err.message, true); }
}
async function setArrival(n, undo) {
  if (!canEditWeek(n)) return;

// ── Backfill from a spreadsheet paste (Director, any course, week 1 or 2) ───
// Paste rows copied from a spreadsheet. A row is matched to a candidate on this
// course by email, or by name (first/last in either order, in one cell or two).
// A status cell says Here / Late / Absent (also P, L, A, Y, N, tick, cross).
// Rows with no status are left unmarked. Nothing is written until "Apply".
let bf = { week: 1, plan: null };
function normName(t) { return String(t || "").toLowerCase().replace(/[^a-z\u00c0-\u024f\s'-]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean).sort().join(" "); }
function statusToken(cell) {
  const t = String(cell || "").trim().toLowerCase();
  if (!t) return null;
  if (/^(here|present|p|y|yes|1|\u2713|\u2714|attended|in|on time|ok)$/.test(t)) return "here";
  if (/^(late|l)$/.test(t)) return "late";
  if (/^(absent|a|n|no|0|\u2717|\u2718|x|dna|did not attend|missed)$/.test(t)) return "absent";
  return null;
}
function parseBackfill(text) {
  const byEmail = new Map(), byName = new Map();
  S.cands.forEach(c => {
    if (c.email) byEmail.set(String(c.email).trim().toLowerCase(), c);
    const k = normName(c.name); if (!k) return;
    byName.set(k, byName.has(k) ? "dup" : c);
  });
  const matched = new Map(), unmatched = [], noStatus = [], dups = [], conflicts = [];
  let weekCol = -1;   // when the pasted header row has "Week 1" / "Week 2" columns, read only the chosen week's column
  String(text || "").split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = line.split(line.includes("\t") ? "\t" : ",").map(x => x.trim());
    const wk = cells.findIndex(x => new RegExp("^week\\s*" + bf.week + "\\b", "i").test(x));
    if (wk >= 0 && !cells.some(statusToken)) { weekCol = wk; return; }
    if (cells.some(x => /^(surname|last name|first name|email|student email|e-mail|name|status|room|cm room\W*)$/i.test(x) || /^week\s*\d/i.test(x)) && !cells.some(statusToken)) return; // header row
    let cand = null, ambiguous = false;
    const em = cells.find(x => /@/.test(x));
    if (em) cand = byEmail.get(em.toLowerCase()) || null;
    if (!cand) {
      const textCells = cells.filter(x => x && !/@/.test(x) && !statusToken(x) && !/^(cm|room)\s*\d+[a-z]?$/i.test(x) && !/^n\/?a$/i.test(x));
      const tries = [];
      if (textCells.length >= 2) { tries.push(textCells[0] + " " + textCells[1]); }
      textCells.forEach(x => tries.push(x));
      for (const t of tries) { const hit = byName.get(normName(t)); if (hit === "dup") ambiguous = true; else if (hit) { cand = hit; break; } }
    }
    const st = weekCol >= 0 ? statusToken(cells[weekCol]) : (cells.map(statusToken).filter(Boolean).pop() || null);
    if (!cand) { (ambiguous ? dups : unmatched).push(line); return; }
    if (!st) { noStatus.push(cand.name); return; }
    if (matched.has(cand.id) && matched.get(cand.id).status !== st) conflicts.push(cand.name);
    matched.set(cand.id, { cand, status: st });
  });
  return { matched: [...matched.values()], unmatched, noStatus, dups, conflicts };
}

function openBackfill() {
  if (!dirToolsOn()) return;
  bf.plan = null;
  $("overlay").innerHTML = `<div class="modalbg" id="bfbg"><div class="modal" role="dialog" aria-modal="true">` +
    `<h3>Backfill from a spreadsheet</h3>` +

    `<div class="row2"><label class="tg">Week <select id="bfWeek"><option value="1">1 (${esc(nice((teachDates(S.course) || [])[0] || "2000-01-01"))})</option><option value="2">2 (${esc(nice((weekDates(S.course) || [])[1] || "2000-01-01"))})</option></select></label>` +
    `<label class="tg"><input type="checkbox" id="bfOver"> Replace entries that are already marked</label></div>` +
    `<textarea id="bfText" placeholder="Surname\tFirst name\temail\tstatus"></textarea>` +
    `<div class="row2"><button class="btn" id="bfCheck" type="button">Check</button><button class="btn pri" id="bfApply" type="button" disabled>Apply</button><button class="btn" id="bfClose" type="button">Close</button></div>` +
    `<div id="bfOut"></div></div></div>`;

  $("bfClose").onclick = () => { $("overlay").innerHTML = ""; };

function checkBackfill() {
  bf.week = +$("bfWeek").value;
  const over = $("bfOver").checked;
  const plan = parseBackfill($("bfText").value);
  const todo = plan.matched.filter(m => over || !statusOf(m.cand.id, bf.week));
  const skipped = plan.matched.length - todo.length;
  bf.plan = Object.assign({}, plan, { todo });
  const tally = k => todo.filter(m => m.status === k).length;
  let h = `<div class="msg ${todo.length ? "ok" : "warn"}">${todo.length} will be written: ${tally("here")} here, ${tally("late")} late, ${tally("absent")} absent.${skipped ? " " + skipped + " already marked, left as they are." : ""}</div>`;
  if (plan.unmatched.length) h += `<div class="msg warn">${plan.unmatched.length} row(s) did not match anyone on ${esc(S.course)}:<br>${plan.unmatched.slice(0, 8).map(esc).join("<br>")}${plan.unmatched.length > 8 ? "<br>..." : ""}</div>`;
  if (plan.dups.length) h += `<div class="msg warn">${plan.dups.length} row(s) matched two people with the same name. Use their email instead.</div>`;
  if (plan.conflicts.length) h += `<div class="msg warn">Listed twice with different statuses (last one used): ${plan.conflicts.map(esc).join(", ")}</div>`;
  if (plan.noStatus.length) h += `<div class="msg warn">${plan.noStatus.length} matched but had no status, so left unmarked.</div>`;
  const missing = S.cands.filter(c => !plan.matched.some(m => m.cand.id === c.id) && !statusOf(c.id, bf.week)).length;
  h += `<div class="hint" style="color:var(--mut);font-size:13px">${missing} people on ${esc(S.course)} will still be unmarked for week ${bf.week}.</div>`;
  h += `<table><tr><th>Candidate</th><th>Room</th><th>Will be</th></tr>${todo.slice(0, 60).map(m => `<tr><td>${esc(m.cand.name)}</td><td>${esc(m.cand.room || "")}</td><td>${m.status === "here" ? "Here" : m.status === "late" ? "Late" : "Absent"}</td></tr>`).join("")}</table>` +
    (todo.length > 60 ? `<div class="hint" style="font-size:13px;color:var(--mut)">...and ${todo.length - 60} more.</div>` : "");
  $("bfOut").innerHTML = h;
  $("bfApply").disabled = !todo.length;
}
async function applyBackfill() {

// ASSESSMENT ALLOCATION view (2026-10-13, Jon) - job 2 in the hub.
// Rules (Jon): the automatic allocation leaves out RAP candidates and anyone on
// attempt 2 or above (they are managed by the organising team in the retest
// pool and can be placed by hand). Slots are only ever on the assessment
// evening, so moving someone is always "same evening". The email to a
// candidate is optional everywhere (default off).
// Attempt number: stage1_candidates.assessmentAttempt (1 if not set; a
// candidate already marked "not first sit" counts as 2). The attempt circle
// replaces the old two-plus lightbulb. Instructors never see it.
// ════════════════════════════════════════════════════════════════════════════
const BLS_ADMIN_EMAIL = "colmds-c-rmdbirmingham@adf.bham.ac.uk";
const ASSESS_SLOTS = (() => {
  const out = []; let h = 18, m = 30;
  while (h < 21 || (h === 21 && m <= 30)) { out.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0")); m += 15; if (m >= 60) { m -= 60; h++; } }
  return out;
})();
// Rooms used for retests (attempt 2). Student Faculty pick from these when they confirm a retest. Empty = every assessment room is offered. Jon to confirm the list.
const DEFAULT_RETEST_ROOMS = ["CM08", "CM09", "CM10", "CM11"];   // 21 Oct, Jon: the only rooms offered for retests (every retest attempt). RAP can use any room.
const DEFAULT_ASSESS_ROOMS = ["CM01","CM02","CM03","CM04","CM06","CM11","CM12","CM13","CM14","CM15","CM16","WF38","WF38c","WS14","WS18","WF19","EF5","EF27","EF30","EF10d"];
const A = {
  rooms: [], loaded: false, sel: null, target: null, showGrid: false, busy: false, log: [],
  subject: "Your BLS assessment time - {{assessment_date}}",
  body: "Dear {{first_name}},\n\nYour BLS assessment is on {{assessment_date}}. Your time is {{assessment_time}} in room {{assessment_room}}.\n\nPlease arrive a few minutes early. If you cannot attend, email us as soon as possible at " + BLS_ADMIN_EMAIL + ".\n\nThe RMD Birmingham team"
};

function attemptOf(c) { return Number.isFinite(c.assessmentAttempt) ? c.assessmentAttempt : (c.firstTimeAssessment === false || c.twoPlusAssessments === true ? 2 : 1); }
function attBadge(n) { return '<span class="att ' + (n >= 3 ? "a3" : "a" + n) + '" title="Assessment attempt ' + n + '" aria-label="Attempt ' + n + '">' + n + "</span>"; }
function assessDate() { const d = weekDates(S.course); return d ? d[2] : null; }
function longDate(iso) { return new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }); }
function shuffleArr(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hasSlot(c) { return !!(c.assessmentRoom && c.assessmentSlot); }

async function ensureRooms() {
  if (A.loaded) return;

// ── Step 1: automatic allocation ────────────────────────────────────────────
// ── Monday order: four locked steps ─────────────────────────────────────────
// 1 Check the course is ready  ->  2 Allocate  ->  3 Check the schedule  ->  4 Email their times.

const MARKED = ["here", "late", "absent"];
function gateInfo(st) {

  const nm = list => list.map(c => c.name || "(no name)").sort((a, b) => a.localeCompare(b));
  const pop = S.cands.filter(c => c.assessmentAbsent !== true && c.rap !== true && attemptOf(c) < 2);   // first sits who would be given a slot
  const plural2 = (n, a, b) => n + " " + (n === 1 ? a : b);

  else {

    add(need > free ? "warn" : "ok", "Dates and rooms", "Assessment night is " + nice(d[2]) + ". " + free + " free slots across " + A.rooms.length + " rooms for " + need + " people." + (need > free ? " " + (need - free) + " will not fit and need placing by hand." : ""));
  }
  // placement
  const clash = pop.filter(placementClash), unchecked = pop.filter(c => !c.placementChecked && !placementClash(c));

  else if (unchecked.length) add("warn", "Placement dates", plural2(unchecked.length, "person has", "people have") + " not had placement dates checked.", nm(unchecked), 'Check them on <a href="admin-stage1-candidates.html">Stage 1 Candidates</a> (step 2).');
  else add("ok", "Placement dates", "Nobody on this course has a placement that overlaps it.");

const NIGHT_VIEWS = ["retest", "runner", "assessor", "checkin", "endnight"];
const N = {

function resitRoom(c) { const a = effAttempt(c); return a >= 2 ? String((nres(c.id).flow || {})[String(a)] && (nres(c.id).flow || {})[String(a)].room || "") : ""; }

function canAssessCandidate(c, att) {

  const cl = nres(c.id).claim;

  }

// ── Loading ─────────────────────────────────────────────────────────────────

    N.cands = d.candidates || []; N.named = d.namedAssessors || []; N.form = d.form || {}; N.err = ""; N.usingFallback = false;
  } catch (e) {

      N.cands = S.cands.map(c => ({ id: c.id, name: c.name || "", degree: c.degree || "", rap: c.rap === true, attempt: attemptOf(c), absent: c.assessmentAbsent === true, assessmentRoom: c.assessmentRoom || null, assessmentSlot: c.assessmentSlot || null }));

function slottedByRoom(forRunner) {

  N.cands.filter(c => !c.absent && ((c.assessmentRoom && c.assessmentSlot) || (forRunner && resitRoom(c)))).forEach(c => { const r = (forRunner && resitRoom(c)) || c.assessmentRoom; (by[r] = by[r] || []).push(c); });
  Object.keys(by).forEach(r => by[r].sort((x, y) => key(x) < key(y) ? -1 : key(x) > key(y) ? 1 : String(x.name).localeCompare(String(y.name))));

  N.retest = N.retest || {};
  const gate = att === 2 && chk.ok && !existing && !(N.retest[id] && N.retest[id].confirmed);   // Retest check first (Jon, 21 Oct)
  const derived = att === 2 ? derivedRetestComps(id) : null;
  const p1 = nattempts(id)["1"];
  const noHistory = att === 2 && !(p1 && p1.components);    // attempt 1 was on an earlier course: let the assessor leave a part out
  const qs = Array.isArray(N.form.questions) ? N.form.questions : [];
  const url = /^https:\/\//i.test(N.form.formUrl || "") ? N.form.formUrl : "";
  N.formOpen = true;

  const hist = att === 2 ? `<div class="hist">${p1 && p1.components ? "Attempt 1 result: " + COMPS.map(x => esc(x.label) + ": <b>" + resTxt(p1.components[x.k]) + "</b>").join(" &middot; ") : "Attempt 1 result: not recorded on this hub."}</div>` : prevKeys.map(k => { const a = nattempts(id)[k]; return `<div class="hist">Attempt ${esc(k)}: <b>${esc(outcomeLabel(a.outcome, Number(k)))}</b>${a.assessorName ? " by " + esc(a.assessorName) : ""}${compsText(a) ? ` <small>${esc(compsText(a))}</small>` : ""}${a.comment ? ` <small>${esc(a.comment)}</small>` : ""}</div>`; }).join("");
  const state = { exc: !!(existing && existing.excellent), excCrit: new Set((existing && existing.excellentCriteria) || []), cpr: { cycles: ((existing && existing.cpr && existing.cpr.cycles) || []).map(x => Object.assign({}, x)), cur: [] }, marks: {}, reasons: { bls: new Set(), rec: new Set() }, opts: { bls: new Set(), rec: new Set() }, other: {}, override: { bls: false, rec: false }, ovwhy: { bls: new Set(), rec: new Set() }, ovother: {}, confirm: { bls: false, rec: false }, answers: Object.assign({}, existing && existing.answers ? existing.answers : {}) };

function afterTonight() {
  const out = { retrain: [], leads: [], final: [] };
  N.cands.forEach(c => {
    if (passedAtKey(c.id)) return;
    const a = nattempts(c.id), keys = Object.keys(a).filter(k => a[k] && a[k].outcome === "refer").map(Number);
    if (!keys.length) return;
    const k = Math.max.apply(null, keys);
    if (k === 2) out.retrain.push({ c, k });
    else if (k === 3) out.leads.push({ c, k });
    else if (k >= 4) out.final.push({ c, k });
  });
  Object.keys(out).forEach(g => out[g].sort((x, y) => String(x.c.name).localeCompare(String(y.c.name))));
  return out;
}

const CU = { loaded: false, loading: false, rows: [], err: "", busy: null, open: false };

async function cuLoad() {

    const cands = {}; cs.forEach(d => { cands[d.id] = Object.assign({ id: d.id }, d.data()); });
    const taken = new Set();
    Object.keys(cands).forEach(id => { const c = cands[id]; if (isCatchupCourse({ name: c.course })) { if (c.linkedCandidateId) taken.add(c.linkedCandidateId); if (c.catchupFrom && c.catchupFrom.id) taken.add(c.catchupFrom.id); } });

      if (!keys.length || Object.keys(a).some(k => a[k] && a[k].outcome === "pass")) return;

// Check attempt numbers (28 Oct, Jon): attempt 2 only ever happens on the same night as attempt 1, so someone who is saved as attempt 2 but has no
// attempt 1 result on THIS course's night has a wrong number. Anyone retesting on a later course is attempt 3 or 4; a first sit here is attempt 1.
// The suggestion comes from the earlier course the record is linked to (referred at attempt k there, so k + 1, never below 3), otherwise 1.
const AC = { loading: false, key: "", rows: [], busy: false };
function oddAttempts() { return N.cands.filter(c => !c.absent && !passedAtKey(c.id) && (c.attempt || 1) === 2 && derivedAttempt(c.id) < 2 && !recordedAt(c.id, 2)); }
async function acLoad() {
  const odd = oddAttempts(), key = odd.map(c => c.id).sort().join(",");
  if (AC.loading || AC.busy || !odd.length || AC.key === key) return;
  AC.loading = true; AC.key = key;
  const rows = [];
  for (const c of odd) {
    const sc = S.cands.find(x => x.id === c.id) || {};
    let sug = 1, why = "No earlier course on file";
    if (sc.linkedCandidateId) {
      try {
        const d = await db.collection("stage1_assessments").doc(sc.linkedCandidateId).get();
        const a = (d.exists && d.data().attempts) || {};
        const k = Math.max.apply(null, [0].concat(Object.keys(a).filter(x => a[x] && a[x].outcome === "refer").map(Number)));
        if (k >= 2) { sug = Math.min(4, Math.max(3, k + 1)); why = "Referred at attempt " + k + " on an earlier course"; }
        else why = "Linked to an earlier course with no retest result";
      } catch (e) { why = "Could not read the earlier course"; }
    }
    rows.push({ c, sug, why });
  }
  AC.rows = rows; AC.loading = false; renderRetest();
}
function acCard() {
  const odd = oddAttempts(); if (!odd.length) return "";
  const rows = AC.rows.filter(r => odd.some(c => c.id === r.c.id));
  const body = (AC.loading || !rows.length) ? '<div class="hint">Looking at their earlier courses...</div>' : rows.map(r =>
    `<div class="lrow"><span class="nm">${esc(r.c.name)} ${attBadge(2)}</span><small>${esc(r.c.degree || "")} &middot; ${esc(r.why)}</small><span class="pact">${[1, 3, 4].map(k => `<button type="button" class="btn sm${k === r.sug ? " pri" : ""}" data-acset="${esc(r.c.id)}" data-acn="${k}"${AC.busy ? " disabled" : ""}>Attempt ${k}</button>`).join(" ")}</span></div>`).join("");
  return `<div class="card" style="border-color:var(--org)"><h3>Check attempt numbers (${odd.length})</h3><div class="hint" style="margin:0 0 8px">Attempt 2 only happens on the same night as attempt 1. These people are saved as attempt 2 but have no attempt 1 result on ${esc(S.course)}, so the number is probably wrong. A first sit here is attempt 1; retesting after earlier courses is attempt 3 or 4. The dark button is the suggestion. Nothing else is changed or deleted.</div>` + body +
    (rows.length && !AC.loading ? `<div class="row2" style="margin-top:8px"><button type="button" class="btn pri" id="acAll"${AC.busy ? " disabled" : ""}>Use the suggestion for all ${rows.length}</button></div>` : "") + `</div>`;
}
async function acApply(items) {
  if (AC.busy || !items.length) return;
  AC.busy = true; renderRetest();
  let ok = false;
  try {
    for (let i = 0; i < items.length; i += 200) {
      const batch = db.batch();
      items.slice(i, i + 200).forEach(x => batch.update(db.collection(COLLECTIONS.stage1Candidates).doc(x.c.id), { assessmentAttempt: x.n, twoPlusAssessments: x.n >= 2 }));
      await batch.commit();
    }
    ok = true;
    items.forEach(x => { x.c.attempt = x.n; N.cands.forEach(nc => { if (nc.id === x.c.id) nc.attempt = x.n; }); const sc = S.cands.find(y => y.id === x.c.id); if (sc) { sc.assessmentAttempt = x.n; sc.twoPlusAssessments = x.n >= 2; } });
    let logged = true;
    try {
      const at = new Date().toISOString();
      for (const x of items) await db.collection("stage1_assessments").doc(x.c.id).set({ course: S.course, candidateName: x.c.name || "", flow: { edits: { ["e" + Date.now() + x.c.id.slice(0, 4)]: { from: 2, to: x.n, by: S.user.uid, byName: S.myName, at } } }, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });

  } catch (err) { toast("Not saved: " + (err.code === "permission-denied" ? "you do not have permission" : err.message), true); }
  AC.busy = false; AC.key = ""; if (ok) AC.rows = [];
  renderRetest(); renderAlloc();
}

  try {
    const snap = await db.collection(COLLECTIONS.facultyDirectory || "faculty_directory").get();
    N.dir = snap.docs.map(d => d.data()).sort((x, y) => (Number(x.order) || 0) - (Number(y.order) || 0));
  } catch (e) { N.dir = []; }
  N.dirLoading = false;
  if (["assessor", "retest"].includes(S.view)) renderNight();
  if (S.view === "setup") renderSetup();
}
function dirNames(group) { return (N.dir || []).filter(x => x.group === group).map(x => x.name).filter(Boolean); }
function whoCanTake(att) {
  const g = [];
  if (att < 3) g.push({ label: "Student Faculty", names: dirNames("student") });
  g.push({ label: "Senior Faculty", names: dirNames("senior") });
  g.push({ label: "Extra named assessors", names: N.named || [], ed: true });
  return g;
}
function att3People() {
  const seen = new Set(), out = [];
  dirNames("senior").concat(N.named || []).forEach(n => { const k = normId(n); if (k && !seen.has(k)) { seen.add(k); out.push(n); } });
  return out;
}
function isHere(n) { return (N.present || []).some(p => normId(p) === normId(n)); }
function hereCount() { return att3People().filter(isHere).length; }
async function setPresent(list) {
  const elig = att3People().map(normId);
  const clean = list.filter(n => elig.includes(normId(n)));
  const before = N.present; N.present = clean; renderNight();
  try {
    await db.collection("stage1_night_present").doc(S.course).set({ course: S.course, present: clean, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: S.myName || "" });
  } catch (err) {
    N.present = before; renderNight();
    toast("Not saved: " + (err.code === "permission-denied" ? "you do not have permission (rules not deployed yet?)" : err.message), true);
  }
}
function hereCard(pool, no) {
  // Collapsed by default (22 Oct, Jon); opens only when someone taps it.
  const people = att3People(), open = N.hereOpen === true, n = people.filter(isHere).length;
  const wrap = inner => `<details class="card" id="hereDetails"${open ? " open" : ""}><summary style="cursor:pointer;font-weight:800;font-size:17px"><span class="stepno">${no || 1}</span>Senior assessment team: who is here tonight${people.length ? ` <span class="hint" style="margin:0 0 0 8px;font-weight:600">${n} of ${people.length} here</span>` : ""}</summary><div style="margin-top:8px">${inner}</div></details>`;
  const wait3 = pool.filter(c => effAttempt(c) >= 3 && !(nres(c.id).claim && nres(c.id).claim.uid)).length;
  let h = `<div class="hint" style="margin:0 0 6px">Tap each person here tonight. Senior Faculty and extra named assessors only. Information only.</div>`;
  if (N.dir === null || N.dir === undefined) return wrap(h + '<div class="hint">Loading the list…</div>');
  if (!people.length) return wrap(h + `<div class="hint">Nobody listed. Senior Faculty come from the faculty roster; extra assessors are added in Assessment setup.</div>`);
  if (wait3 && !n) h += `<div class="msg warn">${wait3} ${wait3 === 1 ? "person is" : "people are"} waiting for attempt 3 or later and nobody is marked as here to take them.</div>`;
  h += `<div class="hbtns">${people.map((x, i) => `<button type="button" class="hbtn${isHere(x) ? " on" : ""}" data-here="${i}" aria-pressed="${isHere(x)}">${isHere(x) ? "&#10003; " : ""}${esc(x)}</button>`).join("")}</div>` +
    `<div class="tools" style="margin:6px 0 0"><span class="hint" style="margin:0"><b>${n}</b> of ${people.length} here</span><button type="button" class="btn sm" data-hereall="1">Everyone is here</button><button type="button" class="btn sm" data-hereall="0">Nobody is here</button></div>`;
  return wrap(h);
}
function whoCanBox(pool) {
  const atts = [...new Set(pool.map(c => effAttempt(c) >= 3 ? 3 : 2))].sort();
  if (!atts.length) return "";
  const block = a => `<div class="whorow"><b>${a === 3 ? "Attempt 3 or later" : "Attempt 2"}</b>${a === 2 ? " <small>(not the same assessor as attempt 1)</small>" : ""}` +
    (a === 3 ? `<div class="names"><em>Here tonight</em>${att3People().filter(isHere).length ? att3People().filter(isHere).map(n => `<span class="here">${esc(n)}</span>`).join("") : '<span class="none">nobody marked as here yet</span>'}</div>` : "") +
    whoCanTake(a).map(g => `<div class="names"><em>${esc(g.label)}</em>${g.names.length ? g.names.map(n => `<span class="${a === 3 && isHere(n) ? "here" : (g.ed ? "ed" : "")}">${esc(n)}</span>`).join("") : '<span class="none">nobody listed</span>'}</div>`).join("") + `</div>`;
  return `<details class="whocan" id="whoDetails"${N.whoOpen ? " open" : ""}><summary>Who can take these attempts?</summary>${atts.map(block).join("")}</details>`;
}

// ── Assessment setup (Directors only) ───────────────────────────────────────
// Moved here from the Retest pool page (Jon, 14 Oct 2026). Three tabs: who can assess, mark sheets, Google Form link.
// Not re-rendered by the 30 second refresh, so nothing typed here is lost.
const SU = { tab: "who", part: "bls", draft: null, people: null, directors: null, loaded: false, teamDraft: null, namedDraft: null, urlDraft: null };
async function enterSetup() {
  $("msgs").innerHTML = "";
  if (N.course !== S.course) attachNight();
  if (!SU.loaded) {
    await Promise.all([
      loadDirectory(),
      Promise.all([db.collection(COLLECTIONS.people).where("role", "==", "faculty").get(), db.collection(COLLECTIONS.people).where("role", "==", "assessor-faculty").get()])
        .then(r => { SU.people = [].concat(r[0].docs, r[1].docs).map(d => d.data()); }).catch(() => { SU.people = null; }),
      db.collection("config").doc("platform").get().then(d => { SU.directors = d.exists && Array.isArray(d.data().directors) ? d.data().directors : []; }).catch(() => { SU.directors = []; })
    ]);
    SU.loaded = true;
  }
  await loadNight();
  renderSetup();
}
function suCapture() {
  if ($("teamTxt")) SU.teamDraft = $("teamTxt").value;
  if ($("namedTxt")) SU.namedDraft = $("namedTxt").value;
  if ($("formUrl")) SU.urlDraft = $("formUrl").value;
}
function suGroups() {
  const fac = (SU.people || []).map(p => p.name || p.email || "").filter(Boolean).sort((a, b) => a.localeCompare(b));
  return {
    dir: { label: "Directors", names: (SU.directors || []).map(String) },
    stu: { label: "Student Faculty", names: dirNames("student") },
    sen: { label: "Senior Faculty", names: dirNames("senior") },
    fac: { label: "Faculty and Assessor cohort (job roles)", names: fac },
    team: { label: "Senior Instructors on the night list (do not assess)", names: N.team || [], ed: true },
    named: { label: "Extra named assessors", names: N.named || [], ed: true }
  };
}
function renderSetup() {
  if (S.view !== "setup") return;
  suCapture();
  $("plain").innerHTML = '<span class="lbl">Assessment setup</span>Who can assess, mark sheets and the Google Form link. Applies to every course. Changes are live straight away.';
  const tabs = [["who", "Who can assess"], ["marks", "Mark sheets"], ["form", "Google Form"]];
  let h = `<div class="sutabs">${tabs.map(t => `<button type="button" data-sutab="${t[0]}" class="${SU.tab === t[0] ? "on" : ""}">${t[1]}</button>`).join("")}</div>`;
  h += SU.tab === "who" ? suWho() : SU.tab === "marks" ? suMarks() : suForm();
  $("viewSetup").innerHTML = h;
  $("viewSetup").querySelectorAll("[data-sutab]").forEach(b => b.onclick = () => { SU.tab = b.dataset.sutab; renderSetup(); });
  const pk = $("pickAssessors"); if (pk) pk.onclick = pickAssessors;
  const sw = $("saveWho"); if (sw) sw.onclick = saveWho;
  const sm = $("saveMarks"); if (sm) sm.onclick = saveMarks;
  const sf = $("saveFormUrl"); if (sf) sf.onclick = saveFormUrl;
  const st = $("suSteps"); if (st) st.oninput = () => { SU.draft[SU.part] = st.value; $("suPrev").innerHTML = stepsPreview(st.value); };
  const rs = $("suReset"); if (rs) rs.onclick = () => { SU.draft[SU.part] = DEFAULT_STEPS[SU.part].join("\n"); renderSetup(); };
  $("viewSetup").querySelectorAll("[data-supart]").forEach(b => b.onclick = () => { SU.part = b.dataset.supart; renderSetup(); });
}
function suWho() {
  const G = suGroups();
  const chip = g => `<span${g.ed ? ' class="ed"' : ""}>${esc(g.label.replace(" (job roles)", ""))} (${g.names.length})</span>`;
  const rows = [
    ["1st sit", "", [G.dir, G.stu, G.sen, G.fac, G.named]],
    ["2nd sit", "not the same assessor as the 1st sit", [G.stu, G.sen, G.named]],
    ["3rd sit and later", "", [G.sen, G.named]]
  ];
  let h = `<div class="card"><h3>Who can assess what</h3><div class="hint" style="margin:0 0 8px">Grey groups are changed elsewhere (Student and Senior Faculty: <a href="admin-faculty-roster.html">faculty roster</a>). Purple groups are edited below.</div>` +
    `<table class="suwho"><tr><th>Sit</th><th>Who can assess</th></tr>` +
    rows.map(r => `<tr><td><b>${r[0]}</b>${r[1] ? `<br><small style="color:var(--mut)">${r[1]}</small>` : ""}</td><td><div class="names">${r[2].map(chip).join("")}</div></td></tr>`).join("") +
    `</table><div class="hint" style="margin:8px 0 0">Directors take 2nd or later sits only if on the Student or Senior Faculty roster, or named below. Senior Instructors on the night list can use the runner view but do not assess at any sit.</div>`;
  h += `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:800;color:var(--pur)">Show the names in each group</summary>` +
    Object.keys(G).map(k => { const g = G[k]; return `<div class="whorow"><b>${esc(g.label)} (${g.names.length})</b><div class="names">${g.names.length ? g.names.map(n => `<span${g.ed ? ' class="ed"' : ""}>${esc(n)}</span>`).join("") : '<span class="none">nobody listed</span>'}</div></div>`; }).join("") + `</details></div>`;
  const teamV = SU.teamDraft !== null ? SU.teamDraft : (N.team || []).join("\n");
  const namedV = SU.namedDraft !== null ? SU.namedDraft : (N.named || []).join("\n");
  h += `<div class="card"><h3>Senior Instructors who can open assessment night</h3><div class="hint" style="margin:0 0 6px">Can open assessment night and use the runner view. They do not assess at any sit. One sign-in email per line.</div>` +
    `<textarea id="teamTxt" placeholder="Email, one per line">${esc(teamV)}</textarea>` +
    `</div>`;
  h += `<div class="card"><h3>Extra named assessors for retests</h3><div class="hint" style="margin:0 0 6px">Can take 2nd and later sits as well as first sits. One sign-in email per line.</div>` +
    `<textarea id="namedTxt" placeholder="Name or email, one per line">${esc(namedV)}</textarea>` +
    `<div class="tools" style="margin:10px 0 0"><button type="button" class="btn pri" id="saveWho">Save both lists</button><span class="sumsg" id="whoMsg"></span></div><div class="hint">Saving needs a super-user account, the same as the other site settings.</div></div>`;
  return h;
}
function stepsPreview(text) {
  const lines = String(text || "").split(/\r?\n/).map(t => t.trim()).filter(Boolean);
  if (!lines.length) return '<div class="hint">No steps. The default sheet will be used.</div>';
  let last = "", n = 0, out = "";
  lines.forEach((t, i) => {
    const m = /^(\d[a-z])\s+(.*)$/.exec(t), code = m ? m[1] : "";
    if (!m) n++;
    if (code && code !== last) { out += `<div class="h">${esc(code)} ${esc(CODE_NAMES[code] || "")}</div>`; last = code; }
    out += `<div class="st">${i + 1}. ${esc(m ? m[2] : t)}</div>`;
  });
  return (n ? `<div class="msg warn" style="margin:0 0 6px">${n} line${n === 1 ? " has" : "s have"} no code at the start (1a, 1b, 1c, 2a). ${n === 1 ? "It" : "They"} still show${n === 1 ? "s" : ""} to assessors, without a heading, and will not count in the "failed" codes.</div>` : "") + out;
}
function suMarks() {
  if (!SU.draft) SU.draft = { bls: stepsFor("bls").join("\n"), rec: stepsFor("rec").join("\n") };
  const x = COMPS.find(c => c.k === SU.part) || COMPS[0];
  const recorded = Object.values(N.results || {}).reduce((n, r) => n + Object.keys((r && r.attempts) || {}).length, 0);
  let h = `<div class="card"><h3>Mark sheets</h3><div class="hint" style="margin:0 0 8px">One line per step, in the order assessors see them. Start each line with its code (1a, 1b, 1c for BLS + AED; 2a for recovery position). Default: Resuscitation Council UK 2025 lay-rescuer sequence.</div>`;
  if (recorded) h += `<div class="msg warn">${recorded} result${recorded === 1 ? " has" : "s have"} already been recorded on ${esc(S.course || "this course")}. Old results still read correctly after a reword, but amending an old result will not highlight a step you have reworded. Edit between nights where you can.</div>`;
  h += `<div class="sutabs">${COMPS.map(c => `<button type="button" data-supart="${c.k}" class="${SU.part === c.k ? "on" : ""}">${esc(c.label)}</button>`).join("")}</div>` +
    `<div class="sugrid"><div><div class="hint" style="margin:0 0 4px"><b>Edit: ${esc(x.label)}</b></div><textarea id="suSteps" style="min-height:300px">${esc(SU.draft[SU.part])}</textarea>` +
    `<div class="tools" style="margin:8px 0 0"><button type="button" class="btn pri" id="saveMarks">Save both mark sheets</button><button type="button" class="btn sm" id="suReset">Reset this part to default</button><span class="sumsg" id="marksMsg"></span></div><div class="hint">Saving needs a super-user account.</div></div>` +
    `<div><div class="hint" style="margin:0 0 4px"><b>Assessors will see</b> (updates as you type)</div><div class="spv" id="suPrev">${stepsPreview(SU.draft[SU.part])}</div></div></div></div>`;
  return h;
}
function suForm() {
  const v = SU.urlDraft !== null ? SU.urlDraft : (N.form.formUrl || "");
  return `<div class="card"><h3>Google Form link</h3><div class="hint" style="margin:0 0 6px">Shown on the assessment form as a fallback if the site is not working on the night. Leave blank to hide it.</div>` +
    `<input type="text" id="formUrl" placeholder="https://forms.gle/..." value="${esc(v)}"><div class="tools" style="margin:10px 0 0"><button type="button" class="btn pri" id="saveFormUrl">Save link</button><span class="sumsg" id="formMsg"></span></div><div class="hint">Saving needs a super-user account.</div></div>`;
}
function saveErr(err) { return "Not saved: " + (err && err.code === "permission-denied" ? "this needs a super-user account." : (err && err.message) || err); }
async function saveWho() {
  const team = $("teamTxt").value.split(/\r?\n/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const badTeam = team.filter(t => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t));
  const msg = $("whoMsg");
  if (badTeam.length) { msg.textContent = "The night list needs email addresses only. Check: " + badTeam.slice(0, 3).join(", "); return; }
  const names = $("namedTxt").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const namedEmails = names.filter(n => n.includes("@")).map(n => n.toLowerCase());
  $("saveWho").disabled = true;
  try {
    await db.collection("config").doc("stage1_named_assessors").set({ names, emails: namedEmails }, { merge: true });
    await db.collection("config").doc("stage1_assessors").set({ emails: team }, { merge: true });
    N.named = names; N.team = team; SU.teamDraft = null; SU.namedDraft = null;
    renderSetup();
    $("whoMsg").textContent = "Saved.";
    return;
  } catch (err) { msg.textContent = saveErr(err); }
  $("saveWho").disabled = false;
}
async function saveMarks() {
  const markSheet = {};
  COMPS.forEach(x => {
    const lines = String(SU.draft[x.k] || "").split(/\r?\n/).map(t => t.trim()).filter(Boolean);
    markSheet[x.k] = JSON.stringify(lines) === JSON.stringify(DEFAULT_STEPS[x.k]) ? [] : lines;
  });
  $("saveMarks").disabled = true;
  try {
    await db.collection("config").doc("stage1_assessment_form").set({ markSheet }, { merge: true });
    N.form = Object.assign({}, N.form, { markSheet });
    $("marksMsg").textContent = "Saved. Assessors get the new steps the next time they open a candidate.";
  } catch (err) { $("marksMsg").textContent = saveErr(err); }
  $("saveMarks").disabled = false;
}
async function saveFormUrl() {
  const url = $("formUrl").value.trim();
  if (url && !/^https:\/\//i.test(url)) { $("formMsg").textContent = "The form link must start with https://"; return; }
  $("saveFormUrl").disabled = true;
  try {
    await db.collection("config").doc("stage1_assessment_form").set({ formUrl: url }, { merge: true });
    N.form = Object.assign({}, N.form, { formUrl: url }); SU.urlDraft = null;
    $("formMsg").textContent = "Saved.";
  } catch (err) { $("formMsg").textContent = saveErr(err); }
  $("saveFormUrl").disabled = false;
}

</script>
