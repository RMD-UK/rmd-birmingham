<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Application Review — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f3f6; font-family: var(--font); margin: 0; padding: 20px; }
    .page { max-width: 1100px; margin: 0 auto; }
    .top-bar { background: var(--rmd-navy); color: white; padding: 12px 18px; border-radius: 8px; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .top-bar img { height: 32px; }
    .top-bar-title { font-size:16px; font-weight:700; }
    .top-bar-sub { font-size:12px; opacity:0.7; }
    #authMsg { color:#fff3cd; font-size:12px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .tab { background:white; color:var(--rmd-navy); border:2px solid #ccd6dd; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:700; font-family:var(--font); cursor:pointer; text-align:left; }
    .tab small { display:block; font-weight:400; font-size:11px; color:var(--rmd-muted); margin-top:2px; }
    .tab:hover { border-color:var(--rmd-navy); }
    .tab.on { background:var(--rmd-navy); border-color:var(--rmd-navy); color:white; }
    .tab.on small { color:#cfd9e3; }
    .tab:focus-visible { outline:3px solid #7aa7e0; outline-offset:2px; }
    .frames iframe { width:100%; height:700px; border:0; background:transparent; display:none; }
    .frames iframe.on { display:block; }
  </style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <a href="member-menu.html" style="display:flex;align-items:center;"><img src="assets/rmd-logo.png" alt="RMD"></a>
    <div style="flex:1;">
      <div class="top-bar-title">Instructor Application Review</div>
      <div class="top-bar-sub">RMD Birmingham · Director &amp; Senior Faculty · everything about the instructor EOI round in one place</div>
      <div id="authMsg"></div>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="eoi" onclick="show('eoi')">Expressions of interest<small>Each applicant: EOI, OPIS and assessment outcome</small></button>
    <button class="tab" role="tab" data-tab="opis" onclick="show('opis')">OPIS ratings<small>Every rated candidate, each criterion</small></button>
    <button class="tab" role="tab" data-tab="rank" onclick="show('rank')">Overall ranking and selection<small>Rank, set places, choose new instructors</small></button>
    <button class="tab" role="tab" data-tab="ip" id="tabIp" onclick="show('ip')" style="display:none;">IP forms<small>RCUK forms, chosen instructors by default</small></button>
  </div>

  <div class="frames" id="frames"></div>
</div>

<script src="js/firebase-config.js"></script>
<script>
const PAGES = {
  eoi: { src: "admin-instructor-review.html?embed=1", title: "Expressions of interest" },
  opis: { src: "opis-review.html?embed=1", title: "OPIS ratings" },
  rank: { src: "admin-instructor-ranking.html?embed=1", title: "Overall ranking and selection" },
  ip: { src: "admin-ip-forms.html?embed=1", title: "Instructor potential forms" }
};
let isDirectorUser = false, current = null;

auth.onAuthStateChanged(async function(user) {
  if (!user) { window.location.href = "signin.html"; return; }
  const role = await resolveRole(user.uid, user.email || "");
  const seniorFac = await isSeniorFaculty(user.email || "");
  isDirectorUser = role === ROLES.DIRECTOR;
  if (!isDirectorUser && !seniorFac) {
    document.getElementById("authMsg").textContent = "Course Directors and RMD Senior Faculty only — redirecting…";
    setTimeout(() => { window.location.href = "member-menu.html"; }, 1500);
    return;
  }
  if (isDirectorUser) document.getElementById("tabIp").style.display = "";
  show(fromHash());
  window.addEventListener("hashchange", () => show(fromHash(), true));
});

function fromHash() {
  const h = (location.hash || "").replace("#", "");
  return PAGES[h] && (h !== "ip" || isDirectorUser) ? h : "eoi";
}

function show(tab, fromHashChange) {
  if (!PAGES[tab] || (tab === "ip" && !isDirectorUser)) tab = "eoi";
  current = tab;
  document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
  const box = document.getElementById("frames");
  // Frames are created the first time a tab is opened and then kept, so nothing is lost when you switch back.
  let f = document.getElementById("fr-" + tab);
  if (!f) {
    f = document.createElement("iframe");
    f.id = "fr-" + tab; f.title = PAGES[tab].title; f.src = PAGES[tab].src;
    box.appendChild(f);
  }
  box.querySelectorAll("iframe").forEach(x => x.classList.toggle("on", x === f));
  if (!fromHashChange && location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
}

// Heights reported by the embedded pages, and "go to tab" requests from links inside them.
window.addEventListener("message", function (e) {
  if (e.origin !== location.origin) return;
  const d = e.data || {};
  if (d.rmdEmbedGo && PAGES[d.rmdEmbedGo]) { show(d.rmdEmbedGo); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (typeof d.rmdEmbedHeight === "number") {
    document.querySelectorAll(".frames iframe").forEach(f => { if (f.contentWindow === e.source) f.style.height = Math.max(300, d.rmdEmbedHeight) + "px"; });
  }
});
</script>
</body>
</html>
