<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Templates — RMD 2026</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f3f6; font-family: var(--font); margin: 0; padding: 0 0 60px; }

    .top-bar {
      background: var(--rmd-navy); color: white;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar img { height: 28px; }
    .top-bar-title { font-size: 15px; font-weight: 700; flex: 1; }
    .top-bar a, .top-bar button {
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
      text-decoration: none; white-space: nowrap; font-family: var(--font);
    }
    .top-bar a:hover, .top-bar button:hover { background: rgba(255,255,255,0.28); }

    .content { padding: 14px; max-width: 1100px; margin: 0 auto; }

    .info-box {
      background: #e8f0fe; border-left: 4px solid var(--rmd-blue);
      border-radius: 0 6px 6px 0; padding: 10px 14px;
      font-size: 13px; color: var(--rmd-navy); margin-bottom: 16px;
    }

    .controls {
      display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;
      background: white; border: 2px solid #dce3ea; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 18px;
    }
    .control-field label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--rmd-muted); margin-bottom: 4px;
    }
    .control-field input {
      width: 90px; padding: 7px 10px; border: 2px solid #ccd6dd; border-radius: 6px;
      font-size: 14px; font-family: var(--font);
    }
    .control-field .hint { font-size: 11px; color: var(--rmd-muted); margin-top: 3px; }
    .btn-action {
      padding: 9px 18px; background: var(--rmd-blue); color: white;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 700;
      font-family: var(--font); cursor: pointer; height: 38px;
    }

    .sheet-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--rmd-muted); margin: 0 0 10px;
    }
    .sheet-label.faculty { margin-top: 24px; }

    .badge-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px;
      margin-bottom: 24px;
    }
    .badge-card {
      background: white; border: 2px solid #dce3ea; border-radius: 10px;
      padding: 16px; aspect-ratio: 90 / 57; display: flex; flex-direction: column;
    }
    .badge-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .badge-logo { height: 26px; }
    .badge-wordmark { font-weight: 800; color: var(--rmd-navy); font-size: 12px; }
    .badge-course {
      text-align: center; font-weight: 800; color: var(--rmd-blue);
      font-size: 12px; letter-spacing: 0.3px; margin-top: 8px;
    }
    .badge-spacer { flex: 1; }
    .badge-role { text-align: center; font-weight: 800; font-size: 26px; margin-bottom: 10px; }
    .badge-role.candidate { color: var(--rmd-blue); }
    .badge-role.faculty { color: var(--rmd-navy); }
    .badge-bar { height: 5px; border-radius: 2px; }
    .badge-bar.candidate { background: var(--rmd-blue); }
    .badge-bar.faculty { background: var(--rmd-navy); }

    /* Printed badges are sized to a standard 90 x 57mm badge holder (2 per row on A4). */
    @media print {
      @page { size: A4; margin: 10mm; }
      .top-bar, .controls, .info-box { display: none !important; }
      body { background: white; padding: 0; }
      .content { max-width: none; padding: 0; margin: 0; }
      .sheet-label { display: none; }

      .badge-grid {
        display: grid; grid-template-columns: repeat(2, 90mm);
        justify-content: center; gap: 4mm; margin-bottom: 0;
      }
      .badge-grid.faculty-grid { page-break-before: always; }
      .badge-card {
        width: 90mm; height: 57mm; aspect-ratio: auto; box-sizing: border-box;
        padding: 5mm 6mm; border: 1px solid #dce3ea; border-radius: 3mm;
        break-inside: avoid; box-shadow: none; overflow: hidden;
      }
      .badge-logo { height: 8mm; }
      .badge-wordmark { font-size: 9pt; }
      .badge-course { font-size: 9.5pt; margin-top: 4mm; }
      .badge-role { font-size: 22pt; margin-bottom: 3mm; }
      .badge-bar { height: 2.2mm; border-radius: 0; }
    }

    #authOverlay {
      position: fixed; inset: 0; background: rgba(0,20,40,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    #authOverlay div {
      background: white; border-radius: 12px; padding: 32px 40px;
      text-align: center; color: var(--rmd-navy); font-size: 15px;
    }
  </style>
</head>
<body>

<div id="authOverlay">
  <div>
    <div style="font-size:32px;margin-bottom:12px;">🔐</div>
    <div id="authMsg">Checking access…</div>
  </div>
</div>

<div class="top-bar">
  <a href="member-menu.html" title="Back to menu" style="background:none;padding:0;">
    <img src="assets/rmd-logo.png" alt="RMD">
  </a>
  <div class="top-bar-title">Badge Templates — Print</div>
  <button onclick="window.print()">🖨 Print</button>
</div>

<div class="content" style="margin-top:14px;">

  <div class="info-box">
    Blank print templates — no roster or attendee list needed. Print as many sheets as you need
    (8 badges per sheet) and hand them out at registration; people write their own name on the day.
  </div>

  <div class="controls">
    <div class="control-field">
      <label for="candidateSheets">Candidate sheets</label>
      <input type="number" id="candidateSheets" min="0" value="2" oninput="render()">
      <div class="hint">8 badges per sheet</div>
    </div>
    <div class="control-field">
      <label for="facultySheets">Faculty sheets</label>
      <input type="number" id="facultySheets" min="0" value="1" oninput="render()">
      <div class="hint">8 badges per sheet</div>
    </div>
    <button class="btn-action" onclick="window.print()">🖨 Print badges</button>
  </div>

  <div id="badgeContainer"></div>

</div>

<!-- Firebase SDK — gated to director/faculty/assessor-faculty, matching member-menu.html -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
const PER_SHEET = 8;

initFirebase();

auth.onAuthStateChanged(async function (user) {
  if (!user) { window.location.href = "signin.html"; return; }
  let role = null;
  try { role = await resolveRole(user.uid, user.email || ""); } catch (e) {}
  if (role !== ROLES.DIRECTOR && role !== ROLES.FACULTY && role !== ROLES.ASSESSOR_FACULTY) {
    const msg = document.getElementById("authMsg");
    if (msg) msg.textContent = "Organising faculty only.";
    setTimeout(function () { window.location.href = "member-menu.html"; }, 1500);
    return;
  }
  document.getElementById("authOverlay").style.display = "none";
  render();
});

function render() {
  const candidateSheets = Math.max(0, parseInt(document.getElementById("candidateSheets").value, 10) || 0);
  const facultySheets   = Math.max(0, parseInt(document.getElementById("facultySheets").value, 10) || 0);
  const container = document.getElementById("badgeContainer");
  container.innerHTML = "";

  if (candidateSheets === 0 && facultySheets === 0) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--rmd-muted);">Set at least one sheet above.</div>`;
    return;
  }

  if (candidateSheets > 0) {
    container.appendChild(sheetGroup("candidate", "CANDIDATE", candidateSheets * PER_SHEET));
  }
  if (facultySheets > 0) {
    container.appendChild(sheetGroup("faculty", "FACULTY", facultySheets * PER_SHEET));
  }
}

function sheetGroup(cls, label, count) {
  const wrap = document.createElement("div");

  const heading = document.createElement("div");
  heading.className = "sheet-label" + (cls === "faculty" ? " faculty" : "");
  heading.textContent = `${label} — ${count} badges`;
  wrap.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "badge-grid" + (cls === "faculty" ? " faculty-grid" : "");
  for (let i = 0; i < count; i++) {
    grid.appendChild(badgeCard(cls, label));
  }
  wrap.appendChild(grid);
  return wrap;
}

function badgeCard(cls, label) {
  const card = document.createElement("div");
  card.className = "badge-card";
  card.innerHTML = `
    <div class="badge-header">
      <img src="assets/rmd-logo.png" alt="RMD logo" class="badge-logo">
      <div class="badge-wordmark">RMD Birmingham</div>
    </div>
    <div class="badge-course">INSTRUCTOR WEEKEND 2026</div>
    <div class="badge-spacer"></div>
    <div class="badge-role ${cls}">${label}</div>
    <div class="badge-bar ${cls}"></div>
  `;
  return card;
}
</script>

</body>
</html>
