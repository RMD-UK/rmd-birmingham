<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Poster — RMD Instructor Weekend 2026</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body {
      background: var(--rmd-navy); font-family: var(--font); margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .poster {
      width: 100%; max-width: 480px; background: white; border-radius: 20px;
      padding: 40px 32px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .poster img.logo { height: 56px; margin-bottom: 18px; }
    .poster h1 { font-size: 26px; color: var(--rmd-navy); margin-bottom: 6px; }
    .poster .sub { font-size: 14px; color: var(--rmd-muted); margin-bottom: 26px; }
    .poster-qr { display: flex; justify-content: center; margin-bottom: 20px; }
    .poster-qr canvas, .poster-qr img { border-radius: 10px; }
    .poster .instruction { font-size: 15px; color: var(--rmd-navy); font-weight: 700; margin-bottom: 4px; }
    .poster .instruction-sub { font-size: 13px; color: var(--rmd-muted); }
    .print-bar { text-align: center; margin-top: 18px; }
    .print-bar button {
      padding: 10px 20px; background: rgba(255,255,255,0.15); color: white; border: none;
      border-radius: 6px; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer;
    }
    @media print {
      body { background: white; padding: 0; }
      .print-bar { display: none; }
      .poster { box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="poster">
  <img src="assets/rmd-logo.png" alt="RMD logo" class="logo">
  <h1>Instructor Weekend Check-in</h1>
  <div class="sub">RMD Instructor Weekend 2026</div>
  <div class="poster-qr" id="qrHolder"></div>
  <div class="instruction">Scan to check yourself in</div>
  <div class="instruction-sub">Then search your name and confirm attendance</div>
</div>

<div class="print-bar">
  <button onclick="window.print()">🖨 Print this poster</button>
</div>

<!-- QR generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const checkinUrl = `${window.location.origin}${window.location.pathname.replace(/iw-checkin-poster\.html$/, "")}iw-checkin.html`;
  new QRCode(document.getElementById("qrHolder"), {
    text: checkinUrl,
    width: 220,
    height: 220,
    colorDark: "#1a2b47",
    colorLight: "#ffffff"
  });
</script>
</body>
</html>
