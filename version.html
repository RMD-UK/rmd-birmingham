<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Version - RMD Birmingham</title>
<style>
  :root { --purple:#44247C; --orange:#F49001; --text:#1A2233; --muted:#6B7C93; --line:#E8ECF1; --pale:#F5F7FA; --ok:#1e8449; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--pale); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.45; }
  header { background:var(--purple); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:13px; opacity:.8; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .big { font-size:22px; font-weight:800; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  dl { margin:10px 0 0; display:grid; grid-template-columns:110px 1fr; gap:6px 10px; font-size:14px; }
  dt { color:var(--muted); font-weight:700; }
  dd { margin:0; word-break:break-word; }
  code { background:var(--pale); padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>Site version</h1>
  <p>RMD Birmingham. Shows what is live and when it went live.</p>
</header>
<main>
  <div class="card" id="main"><p class="muted">Loading…</p></div>
  <div class="card">
    <p style="margin:0" class="muted">This tells you when the website pages last went live. It does not show Cloud Functions or Firestore rules: those are deployed by hand from the terminal, so after running <code>firebase deploy</code> note the time yourself.</p>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("main");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]; }); }
  function ago(ms) {
    var m = Math.round(ms / 60000);
    if (m < 2) return "just now";
    if (m < 120) return m + " minutes ago";
    var h = Math.round(m / 60);
    if (h < 48) return h + " hours ago";
    return Math.round(h / 24) + " days ago";
  }
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(function (v) {
      var t = new Date(v.builtAt);
      var when = isNaN(t) ? esc(v.builtAt) :
        esc(t.toLocaleString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }));
      el.innerHTML =
        '<p class="big">Build ' + esc(v.run) + '</p>' +
        '<p class="muted" style="margin:0">' + (isNaN(t) ? "" : esc(ago(Date.now() - t.getTime()))) + '</p>' +
        '<dl><dt>Went live</dt><dd>' + when + ' (UK time)</dd>' +
        '<dt>Change</dt><dd>' + esc(v.message) + '</dd>' +
        '<dt>Commit</dt><dd><code>' + esc(String(v.sha || "").slice(0, 7)) + '</code></dd></dl>';
    })
    .catch(function () {
      el.innerHTML = '<p class="big">No version stamp yet</p><p class="muted" style="margin:0">The stamp is added automatically when the site is pushed to GitHub. If you can see this after a push, check the Actions tab on GitHub for a failed run.</p>';
    });
})();
</script>
</body>
</html>
