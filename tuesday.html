<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tuesday Night Hub - RMD Birmingham</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1A2233;--mut:#6B7C93;--line:#E3E8EF;--bg:#F5F7FA;--pur:#44247C;--pur2:#2E1856;--purtint:#EFEAF8;--blu:#0067A4;--org:#F49001;--ok:#1E8449;--okbg:#E3F3E8;--bad:#B3261E;--badbg:#FCE8E6;--warn:#8A5200;--warnbg:#FFF1D6;--font:'Inter','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
.gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-weight:700;color:var(--pur)}
.top{background:var(--pur);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px}.top .grow{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#fff;padding:7px 12px;border-radius:8px;font-weight:700;font-size:14px;opacity:.85}
.seg button.on{background:#fff;color:var(--pur);opacity:1}
.seg button .nowdot{display:inline-block;background:var(--ok);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.seg.test{background:rgba(255,190,100,.22)}.seg.test button{color:#ffe9c8}.seg.test button.on{background:#ffe3b8;color:#6a3d00}
.seg.test .tl{align-self:center;color:#ffd9a0;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0 6px 0 10px}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}.tbtn:hover{background:rgba(255,255,255,.26)}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}.main>*{min-width:0}
.side{background:#fff;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:58px;min-height:calc(100vh - 58px)}
.side .lab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.steps{display:flex;flex-direction:column;gap:8px}
.stepcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;line-height:1.25;width:100%}
.stepcard .no{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:#C9D1DE;color:#fff;font-size:14px;font-weight:800}
.stepcard b{display:block;font-size:15px;font-weight:800}.stepcard small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;font-weight:500}
.stepcard.on{border-color:var(--pur);background:var(--purtint)}.stepcard.on .no{background:var(--pur)}.stepcard.on b{color:var(--pur)}
.stepcard.link .no{background:var(--blu)}.stepcard:hover{border-color:var(--blu)}
.stepcard.alert{border-color:#b3261e;background:#fdecea}.stepcard.alert .no{background:#b3261e}.stepcard.alert b{color:#8a1c14}
.pbadge{display:inline-block;background:#b3261e;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:1px}
.pbadge.w{background:#8A5200}
.pane{padding:16px 20px 90px;min-width:0}
.doorbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.doorbar button{flex:1 1 150px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font-weight:800;font-size:15px}
.doorbar button small{display:block;font-weight:500;font-size:12px;color:var(--mut);margin-top:1px}
.doorbar button.on{border-color:var(--pur);background:var(--purtint);color:var(--pur)}
.doorbar button.alert{border-color:#b3261e}
.doorbar button.all{flex:0 1 auto;align-self:stretch;color:var(--mut);font-size:13px;display:flex;align-items:center}
.rolebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.rolebar .chg{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--pur)}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-width:120px}
.tile .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.tile .l{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.tile.warn .n{color:var(--bad)}.tile.good .n{color:var(--ok)}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:17px;font-weight:800;margin-bottom:8px}
.find input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:16px 0 6px}.sect:first-child{margin-top:0}
.hint{font-size:13px;color:var(--mut)}
.note{background:var(--warnbg);border-left:4px solid var(--org);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:#eef1f6;color:#44506a}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.btn{border:2px solid var(--pur);background:#fff;color:var(--pur);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px}
.btn.f{background:var(--pur);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.ch{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}.ch.on{border-color:var(--pur);background:var(--purtint);color:var(--pur)}
.sb{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:700}
.sb.here.on{background:#2e7d4f;border-color:#2e7d4f;color:#fff}.sb.late.on{background:#d17a1b;border-color:#d17a1b;color:#fff}.sb.absent.on{background:#b3261e;border-color:#b3261e;color:#fff}
.cand{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.nm{display:flex;justify-content:space-between;align-items:center;gap:8px}.nm small{display:block;color:var(--mut);font-size:12px}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0 0;font-weight:800;font-size:15px;color:var(--ink)}
.gh span:first-child{flex:1}.gh i{font-style:normal;color:var(--mut)}
.gb{border:1.5px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-6px;padding:6px 12px 4px;background:#fff}
.rw{border-top:1px solid #eef1f6}.rw:first-child{border-top:0}
.rl{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:11px 2px;font-size:15px;color:var(--ink);text-align:left}.rl span{color:var(--mut);font-weight:700}
.dt{width:100%;border-collapse:collapse}.dt th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line);text-align:left}
.dt td{padding:8px 10px;border-top:1px solid #eef1f6;font-size:14px}
.asbox{background:#f3effb;border:2px solid #cbb8f0;border-radius:12px;padding:10px 12px;margin-top:10px}.asttl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#432174;margin-bottom:6px}
.pfrow{display:flex;align-items:center;gap:8px;margin:6px 0}.pfrow b{flex:1}
.pf{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font-weight:800}.pf.p.on{background:#2e7d4f;border-color:#2e7d4f;color:#fff}.pf.f.on{background:#b3261e;border-color:#b3261e;color:#fff}
.nt{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-height:38px}
.hl{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:#fff}
.tool{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:6px 0;font-weight:700}.tool small{display:block;font-weight:400;color:var(--mut)}
.tw{overflow:auto}.msg{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px;background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.testb{background:#ede7f6;border:2px solid #5e35b1;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px}
@media(max-width:900px){
 .main{grid-template-columns:1fr}
 .side{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:10px}.side .lab{display:none}
 .steps{flex-direction:row;overflow-x:auto;gap:6px;-webkit-overflow-scrolling:touch}
 .stepcard{width:auto;white-space:nowrap;padding:8px 12px;align-items:center}.stepcard small{display:none}
 .pane{padding:12px 10px 90px}.tile{min-width:98px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="gate" id="gate"><div id="authMsg">Checking access...</div></div>
<div id="app" class="hidden">
 <div class="top"><h1>Tuesday Night Hub</h1><div class="seg" id="dateTabs" role="tablist" aria-label="Evening"></div><div class="grow"></div><div class="seg test hidden" id="testTabs"></div><a class="tbtn" href="member-menu.html">Menu</a></div>
 <div class="main">
  <aside class="side"><div class="lab">Pick a job</div><div class="steps" id="steps"></div></aside>
  <section class="pane">
   <div id="doorBar" class="doorbar"></div><div id="roleBar"></div><div id="msgs"></div><div id="testb"></div>
   <div class="sumstrip" id="sum"></div><div class="find panel hidden" id="find"></div><div id="main"></div>
  </section>
 </div>
</div>

<script>
initFirebase();
const TROOMS = ["CM02","CM03","CM04","CM06","CM07"], PER_ROOM = 8;
const TT = [["18:30","Instructors: set up and briefing"],["19:00","Introduction and briefing"],["19:05","Cardiac arrest discussion"],["19:15","BLS and AED"],["19:55","Break"],["20:05","Adult choking"],["20:30","Paediatrics"],["20:45","Bleeding"],["20:55","Closure: questions and surveys"],["21:00","Close"]];
const WB = ['Safety and approach','Response check','999 call / calling for help','Airway and breathing check','Compression rate','Compression depth or recoil','Hand position','Rescue breaths','AED use','Paediatric BLS','Other'];
const WF = ['Recovery position','Adult choking','Paediatric choking','Bleeding','999 call / calling for help','Other'];
const CR = ['Conduct or professionalism','Attendance or engagement','Wellbeing or may need extra support','Other'];
const TESTN = [['Amira Khan','Adult'],['Ben Okafor','Adult'],['Chloe Ward','Child'],['Dev Patel','Mental health'],['Ella Brooks','Adult'],['Farah Ali','Learning disability'],['George Nowak','Adult'],['Hannah Price','Child'],['Isaac Moore','Mental health'],['Jade Turner','Adult'],['Kofi Mensah','Adult'],['Lily Evans','Child'],['Mia Chen','Child'],['Noah Barnes','Adult'],['Olivia Grant','Mental health']];
const S = { user:null, staff:false, role:null, date:null, cfg:{ start:"2026-10-20", end:"2027-02-09", evenings:{}, confirmBy:"" }, nurses:[], rooms:{}, concerns:[], sub:null,door:"tonight",view:"faculty",fq:"",lastMsg:"",ccl:null,co:{out:"",mgr:"",note:""},mi:{},nmsg:{},one:{date:"",room:"",last:"",first:"",email:"",field:"",year:""}, og:{}, orow:null, room:"CM02", af:{}, cc:null, ccr:[], cctext:"", err:"", msg:"", sp:{}, sdi:"", edi:"", paste:"", parsed:null, clk:null, unsubs:[] };
const $ = id => document.getElementById(id);
const esc = v => (v == null ? "" : String(v)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

// ── dates and time ─────────────────────────────────────────────
function londonNow(){const p={};new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>{p[x.type]=x.value});return{date:p.year+"-"+p.month+"-"+p.day,min:+p.hour*60+ +p.minute}}
const mins = m => { const h = Math.floor(m/60), mm = m%60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm };
const tm = s => { const p = s.split(":"); return +p[0]*60 + +p[1] };
const MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function niceDate(iso){ if(iso==="TEST") return "Test evening"; const d=new Date(iso+"T12:00:00Z"); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]+" "+d.getUTCDate()+" "+MN[d.getUTCMonth()].slice(0,3)+" "+d.getUTCFullYear(); }
function isoAdd(iso,n){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function isTue(iso){return new Date(iso+"T12:00:00Z").getUTCDay()===2}
function dmyToIso(s){const m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec((s||"").trim());if(!m)return null;const iso=m[3]+"-"+m[2]+"-"+m[1];const d=new Date(iso+"T12:00:00Z");return d.getUTCDate()===+m[1]&&d.getUTCMonth()===+m[2]-1?iso:null}
function isoToDmy(iso){return iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4)}
function allTuesdays(){const o=[];if(!S.cfg.start||!S.cfg.end)return o;let d=S.cfg.start;while(!isTue(d))d=isoAdd(d,1);while(d<=S.cfg.end){o.push(d);d=isoAdd(d,7)}return o}
function evState(iso){ if(S.cfg.evenings[iso]) return S.cfg.evenings[iso]; const m=+iso.slice(5,7),dd=+iso.slice(8,10); return (m===12&&dd>=15)||(m===1&&dd<=5)?"no":"run" }
function runEvenings(){return allTuesdays().filter(d=>evState(d)==="run")}
const isTest = () => S.date === "TEST";
function nowMin(){ return isTest() && S.clk!=null ? S.clk : londonNow().min }

// ── nurses ─────────────────────────────────────────────────────
const attended = n => n.st==="here"||n.st==="late";
const nurseName = n => n.first+" "+n.last;
function cnt(){const c={exp:S.nurses.length,here:0,late:0,abs:0,not:0,as:0,pass:0,ny:0};S.nurses.forEach(n=>{if(n.st==="here")c.here++;else if(n.st==="late")c.late++;else if(n.st==="absent")c.abs++;else c.not++;if(n.bls&&n.fa){c.as++;if(n.bls==="pass"&&n.fa==="pass")c.pass++;else c.ny++}});return c}
function roomList(r){return S.nurses.filter(n=>n.room===r)}
function wording(n){ if(n.bls&&n.fa){const f=[];if(n.bls==="fail")f.push("BLS and AED");if(n.fa==="fail")f.push("first aid");return f.length?"Not passed: "+f.join(" and "):"Passed BLS and AED and first aid"} if(attended(n))return "Attended, not yet assessed"; if(n.st==="absent")return "Did not attend"; return "Not marked" }
function schoolWord(n){if(n.bls&&n.fa)return n.bls==="pass"&&n.fa==="pass"?"Passed":"Not passed";return wording(n)}
function weak(n){return [].concat(n.bls==="fail"?(n.wb||[]):[],n.fa==="fail"?(n.wf||[]):[]).join(", ")}
function unconf(){return TROOMS.filter(r=>!S.rooms[r])}

// ── data ───────────────────────────────────────────────────────
function detach(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[]}
function attach(){
  detach(); S.nurses=[]; S.rooms={}; S.concerns=[]; S.err="";
  const col=db.collection("tuesday_nurses").where("date","==",S.date);
  S.unsubs.push(col.onSnapshot(s=>{S.nurses=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first));S.err="";autoLate();render()},e=>{S.err="Could not read the nurses: "+e.message;render()}));
  S.unsubs.push(db.collection("tuesday_rooms").where("date","==",S.date).onSnapshot(s=>{S.rooms={};s.forEach(d=>{const x=d.data();if(x.confirmed)S.rooms[x.room]=x});render()},e=>{}));
  if(S.staff) S.unsubs.push(db.collection("tuesday_concerns").where("date","==",S.date).onSnapshot(s=>{S.concerns=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>{}));
}
let lateBusy=false;
async function autoLate(){
  if(lateBusy) return;
  const today=londonNow().date;
  if(!(isTest()||S.date===today)) return;
  if(nowMin()<tm("19:30")) return;
  const todo=S.nurses.filter(n=>!n.st);
  if(!todo.length) return;
  lateBusy=true;
  try{const b=db.batch();todo.forEach(n=>b.update(db.collection("tuesday_nurses").doc(n.id),{st:"late",auto:true,stBy:"automatic",stAt:TS()}));await b.commit()}catch(e){}
  lateBusy=false;
}
async function loadCfg(){
  try{const d=await db.collection("tuesday_config").doc("series").get();if(d.exists){const x=d.data();S.cfg={start:x.start||S.cfg.start,end:x.end||S.cfg.end,evenings:x.evenings||{},confirmBy:x.confirmBy||""}}}catch(e){}
  S.sdi=isoToDmy(S.cfg.start);S.edi=isoToDmy(S.cfg.end);
}
async function saveCfg(){try{await db.collection("tuesday_config").doc("series").set({start:S.cfg.start,end:S.cfg.end,evenings:S.cfg.evenings,confirmBy:S.cfg.confirmBy,updatedAt:TS(),updatedBy:S.user.email||""})}catch(e){S.err="Could not save: "+e.message}render()}
function shortDate(iso){const d=new Date(iso+"T12:00:00Z");return d.getUTCDate()+" "+MN[d.getUTCMonth()].slice(0,3)}
function renderTabs(){
  const today=londonNow().date,run=runEvenings(),nx=run.find(d=>d>=today);
  $("dateTabs").innerHTML=run.map(d=>'<button class="'+(S.date===d?"on":"")+'" data-a="dt" data-v="'+d+'">'+esc(shortDate(d))+(d===today?'<span class="nowdot">today</span>':(d===nx?'<span class="nowdot" style="background:#0067A4">next</span>':""))+'</button>').join("");
  $("testTabs").classList.toggle("hidden",!S.staff);$("testTabs").innerHTML='<span class="tl">Test</span><button class="'+(isTest()?"on":"")+'" data-a="dt" data-v="TEST">Test evening</button>';
}
function fillDates(){
  const today=londonNow().date,run=runEvenings(),first=run.find(d=>d>=today)||run[run.length-1]||today;
  if(!S.date||(S.date!=="TEST"&&run.indexOf(S.date)<0))S.date=first;
  renderTabs();
}

// ── actions ────────────────────────────────────────────────────
async function upd(id,f){try{await db.collection("tuesday_nurses").doc(id).update(f)}catch(e){S.err="Could not save: "+e.message;render()}}
function setSt(id,v){const n=S.nurses.find(x=>x.id===id);if(!n)return;if(n.auto&&v==="late"){upd(id,{auto:false,stBy:S.user.email||"",stAt:TS()});return}upd(id,{st:n.st===v?null:v,auto:false,stBy:S.user.email||"",stAt:TS()})}
async function confirmRoom(r){const on=!S.rooms[r];try{await db.collection("tuesday_rooms").doc(S.date+"__"+r).set({date:S.date,room:r,confirmed:on,by:S.user.email||"",at:TS()})}catch(e){S.err="Could not save: "+e.message;render()}}
async function saveResult(id){const A=S.af[id];if(!A||!afOk(id))return;const mapO=(arr,t)=>arr.map(x=>x==="Other"?"Other: "+(t||"").trim():x);await upd(id,{bls:A.bls,fa:A.fa,wb:A.bls==="fail"?mapO(A.wb,A.wbt):[],wf:A.fa==="fail"?mapO(A.wf,A.wft):[],resBy:S.user.email||"",resAt:TS()});delete S.af[id]}

const splitLine=l=>(l.indexOf("\t")>=0?l.split("\t"):l.split(",")).map(x=>x.trim());
function adviceFor(ls,ps){
  const a=[];if(!ls.length){a.push("Nothing was pasted. Copy the rows from your spreadsheet and paste them into the box.");return a}
  const few=ls.filter(l=>splitLine(l).length<4).length;
  if(few)a.push(few+" line"+(few>1?"s have":" has")+" fewer than 4 columns. Each line needs at least Date, Room, Last name, First name, separated by commas or tabs. If you copied from a PDF, copy from the spreadsheet instead.");
  const nd=ps.filter(p=>p.issues.indexOf("date not DD/MM/YYYY")>-1).length;
  if(nd)a.push(nd+" line"+(nd>1?"s have":" has")+" a date that is not DD/MM/YYYY. Write dates like 24/11/2026, with the day first.");
  const nt=ps.filter(p=>p.issues.indexOf("not a Tuesday")>-1).length;
  if(nt)a.push(nt+" date"+(nt>1?"s are":" is")+" not a Tuesday. Check the day and month are the right way round (day first).");
  const nr=ps.filter(p=>p.issues.some(i=>i.indexOf("room not")===0)).length;
  if(nr)a.push(nr+" line"+(nr>1?"s have":" has")+" a room that is not one of "+TROOMS.join(", ")+". Rooms like CM2 are fine, they are changed to CM02.");
  const swapped=ps.filter(p=>/@/.test(p.last)||/@/.test(p.first)||/^\d\d\/\d\d\/\d{4}$/.test(p.room)).length;
  if(swapped)a.push("The columns look to be in a different order. The order must be: Date, Room, Last name, First name, Email, Field of nursing, Year of study.");
  const nn=ps.filter(p=>p.issues.indexOf("name missing")>-1).length;
  if(nn&&!swapped)a.push(nn+" line"+(nn>1?"s have":" has")+" a missing last or first name.");
  return a;
}
function chkRow(l){
  const f=splitLine(l),is=[];let bad=false;
  const iso=dmyToIso(f[0]);if(!iso){is.push("date not DD/MM/YYYY");bad=true}else if(!isTue(iso)){is.push("not a Tuesday");bad=true}else{const e=evState(iso);if(allTuesdays().indexOf(iso)<0)is.push("outside the series");else if(e==="no"){is.push("evening marked Not running");bad=true}else if(e==="tbc")is.push("evening still to confirm")}
  const room=(f[1]||"").toUpperCase().replace(/^CM(\d)$/,"CM0$1");if(room!==""&&TROOMS.indexOf(room)<0){is.push("room not "+TROOMS.join(", ")+" (or leave it empty to allocate at random)");bad=true}
  if(!f[2]||!f[3]){is.push("name missing");bad=true}
  const em=f[4]||"";if(!em)is.push("no email yet");else if(!/^\S+@\S+\.\S+$/.test(em))is.push("email looks wrong");else if(!/@student\.bham\.ac\.uk$/i.test(em))is.push("email is not @student.bham.ac.uk");
  if(!f[5])is.push("no field of nursing");if(!f[6])is.push("no year of study");
  return{iso:iso,room:room,last:f[2]||"",first:f[3]||"",email:em,field:f[5]||"",year:f[6]||"",dmy:f[0]||"",issues:is,ok:!bad}
}
async function dedupe(){
  S.err="";S.msg="Looking for duplicates...";render();
  try{
    const sn=await db.collection("tuesday_nurses").get(),by={};
    sn.forEach(d=>{const v=d.data();if(v.test||v.date==="TEST")return;const k=v.date+"|"+(v.last||"").toLowerCase()+"|"+(v.first||"").toLowerCase();(by[k]=by[k]||[]).push({id:d.id,v:v})});
    const del=[];
    Object.keys(by).forEach(k=>{const g=by[k];if(g.length<2)return;g.sort((a,b)=>((b.v.st||b.v.bls)?1:0)-((a.v.st||a.v.bls)?1:0));g.slice(1).forEach(x=>del.push(x.id))});
    for(let i=0;i<del.length;i+=100){const b=db.batch();del.slice(i,i+100).forEach(id=>b.delete(db.collection("tuesday_nurses").doc(id)));await b.commit()}
    S.msg=del.length?"Removed "+del.length+" duplicate rows (same name on the same evening). One of each is kept.":"No duplicates found."
  }catch(e){S.msg="";S.err="Could not remove duplicates: "+(e.message||e)}
  render();
}
async function parseNow(){
  const raw=S.paste.split("\n").filter(l=>l.trim());S.hdr=raw.length&&/^date\b/i.test(raw[0].trim());const ls=S.hdr?raw.slice(1):raw;
  S.parsed=ls.map(chkRow);S.advice=adviceFor(ls,S.parsed);S.err="";
  try{
    const dates=[...new Set(S.parsed.filter(p=>p.ok).map(p=>p.iso))],cap={},names={};
    for(const d of dates){const sn=await db.collection("tuesday_nurses").where("date","==",d).get();cap[d]={};names[d]=new Set();sn.forEach(x=>{const v=x.data();cap[d][v.room]=(cap[d][v.room]||0)+1;names[d].add((v.last||"").toLowerCase()+"|"+(v.first||"").toLowerCase())})}
    let over=0;
    S.parsed.forEach(p=>{if(!p.ok)return;const k=p.last.toLowerCase()+"|"+p.first.toLowerCase();if(names[p.iso].has(k))return;names[p.iso].add(k);if(!p.room){const open=TROOMS.filter(r=>(cap[p.iso][r]||0)<PER_ROOM);if(!open.length){p.issues.push("all rooms are full on "+niceDate(p.iso));p.ok=false;over++;return}p.room=open[Math.floor(Math.random()*open.length)];p.auto=true;p.issues.push("room chosen at random: "+p.room)}const n=(cap[p.iso][p.room]||0)+1;if(n>PER_ROOM){p.issues.push("room "+p.room+" already has "+PER_ROOM+" on "+niceDate(p.iso)+" (max "+PER_ROOM+")");p.ok=false;over++}else cap[p.iso][p.room]=n});
    if(over)S.advice.push(over+" line"+(over>1?"s are":" is")+" left out because the room already has "+PER_ROOM+" nurses on that evening. Choose another room or evening for them.");
  }catch(e){S.err="Could not check room spaces: "+(e.message||e)}
  render();
}
async function addParsed(){
  if(S.adding)return;
  const ok=S.parsed.filter(p=>p.ok);S.adding=true;S.err="";S.msg="Checking "+ok.length+" nurses...";render();
  try{
    const dates=[...new Set(ok.map(p=>p.iso))],have=new Set(),cap={};
    for(const d of dates){cap[d]={};const sn=await db.collection("tuesday_nurses").where("date","==",d).get();sn.forEach(x=>{const v=x.data();cap[d][v.room]=(cap[d][v.room]||0)+1;have.add(d+"|"+(v.last||"").toLowerCase()+"|"+(v.first||"").toLowerCase())})}
    const todo=[];let dup=0,full=0;
    ok.forEach(p=>{const k=p.iso+"|"+p.last.toLowerCase()+"|"+p.first.toLowerCase();if(have.has(k)){dup++;return}if((cap[p.iso][p.room]||0)>=PER_ROOM){full++;return}cap[p.iso][p.room]=(cap[p.iso][p.room]||0)+1;have.add(k);todo.push(p)});
    let done=0;
    for(let i=0;i<todo.length;i+=100){
      const b=db.batch();
      todo.slice(i,i+100).forEach(p=>b.set(db.collection("tuesday_nurses").doc(),{date:p.iso,room:p.room,last:p.last,first:p.first,email:p.email,field:p.field,year:p.year,st:null,createdAt:TS(),createdBy:S.user.email||""}));
      await b.commit();done=Math.min(i+100,todo.length);S.msg="Added "+done+" of "+todo.length+"...";render();
    }
    S.msg="Added "+done+" nurses"+(dup?", skipped "+dup+" already on that evening":"")+(full?", left out "+full+" because the room was full (max "+PER_ROOM+")":"")+".";S.parsed=null;S.paste="";
  }catch(e){S.msg="";S.err="Could not add the nurses: "+(e.message||e)+(e.code?" ("+e.code+")":"")}
  S.adding=false;render();
}

const VIEWS={room:roomView,reg:regView,move:moveView,res:resView,con:conView,end:endView,eve:eveView,cohort:cohortView,school:schoolView,tt:ttView,test:testView,hand:handView};
const TITLES={room:"Assess a room",reg:"Register",move:"Needs another date",res:"Results",con:"Concerns",tt:"Live timetable",end:"End of night",eve:"Which Tuesdays run",cohort:"Add nurses and rooms",school:"Nursing school sheet",test:"Test evening",hand:"Resources"};
const instrMode=()=>!S.staff||S.view==="instr";
function visibleJobs(){
  if(instrMode())return JOBS.filter(j=>j.all);
  const fj=JOBS.filter(j=>!j.instr);return S.door==="all"?fj:fj.filter(j=>j.door===S.door);
}
function tileHtml(n,l,k){return'<div class="tile '+(k||"")+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}
function render(){
  if(!S.user)return;
  const c=cnt(),open=S.concerns.filter(x=>x.open).length;
  $("msgs").innerHTML=(S.err?'<div class="msg">'+esc(S.err)+'</div>':"")+(S.msg?'<div class="msg ok">'+esc(S.msg)+'</div>':"");
  $("testb").innerHTML=isTest()?'<div class="testb"><b>TEST EVENING.</b> Made-up nurses. Nothing goes to the nursing school.</div>':"";
  // doors
  $("doorBar").innerHTML=(S.staff&&!instrMode())?DOORS.map(d=>'<button class="'+(S.door===d[0]?"on":"")+((d[0]==="tonight"&&open)?" alert":"")+'" data-a="door" data-v="'+d[0]+'">'+d[1]+'<small>'+d[2]+(d[0]==="tonight"&&open?" - concerns waiting":"")+'</small></button>').join("")+'<button class="all" data-a="door" data-v="all">All jobs</button>':"";
  const doorT=instrMode()?"Tonight":(S.door==="all"?"All jobs":(DOORS.find(d=>d[0]===S.door)||DOORS[0])[1]);
  $("roleBar").innerHTML='<div class="rolebar"><span><b>'+doorT+'</b> &middot; '+(instrMode()?"Instructor":"RMD faculty")+'</span>'+(S.staff?'<button class="chg" data-a="chg">Change role</button>':"")+'</div>';
  // tiles
  $("sum").innerHTML=instrMode()?(()=>{const L=roomList(S.room),n={e:L.length,h:0,l:0,x:0,a:0};L.forEach(q=>{if(q.st==="here")n.h++;else if(q.st==="late")n.l++;else if(!q.st)n.x++;if(q.bls&&q.fa)n.a++});return tileHtml(n.e,S.room+" expected")+tileHtml(n.h,"Here","good")+tileHtml(n.l,"Late")+tileHtml(n.x,"Not marked",n.x?"warn":"")+tileHtml(n.a,"Assessed")})():tileHtml(c.exp,"Expected")+tileHtml(c.here,"Here","good")+tileHtml(c.late,"Late")+tileHtml(c.not,"Not marked",c.not?"warn":"")+tileHtml(c.abs,"Absent",c.abs?"warn":"")+tileHtml(c.as,"Assessed")+tileHtml(c.pass,"Passed both parts","good");
  // find a nurse
  const fq=S.fq.trim().toLowerCase(),hits=fq.length>=2?S.nurses.filter(n=>(nurseName(n)+" "+(n.email||"")).toLowerCase().indexOf(fq)>-1).slice(0,12):[];
  $("find").classList.remove("hidden");
  $("find").innerHTML='<h2>Find a nurse</h2><input id="fq" placeholder="Type a name or email to see their room and status..." value="'+esc(S.fq)+'"><div class="hint" style="margin-top:6px">Type at least 2 letters of a name or email. Searches this evening.</div>'+hits.map(n=>'<div class="hl"><b>'+esc(nurseName(n))+'</b> &middot; '+esc(n.room||"No room")+' &middot; '+esc(n.email||"no email yet")+' <span style="float:right">'+chipFor(n)+'</span></div>').join("")+(fq.length>=2&&!hits.length?'<div class="hint" style="margin-top:6px">Nobody found on this evening.</div>':"");
  // jobs
  const jobs=visibleJobs();let k=0;
  $("steps").innerHTML=jobs.map(j=>{k++;let badge="",cls="";
    if(j.id==="reg"&&unconf().length&&S.nurses.length)badge='<span class="pbadge w">'+unconf().length+'</span>';
    if(j.id==="move"&&c.abs){badge='<span class="pbadge w">'+c.abs+'</span>'}
    if(j.id==="con"&&open){badge='<span class="pbadge">'+open+'</span>';cls=" alert"}
    if(j.href)return'<a class="stepcard link" href="'+j.href+(S.date?"&date="+encodeURIComponent(S.date):"")+'" target="_blank"><span class="no">'+k+'</span><span><b>'+esc(j.t)+' &#8599;</b><small>'+esc(j.sub)+'</small></span></a>';
    return'<button class="stepcard'+(S.sub===j.id?" on":"")+cls+'" data-a="go" data-v="'+j.id+'"><span class="no">'+k+'</span><span><b>'+esc(j.t)+badge+'</b><small>'+esc(j.sub)+'</small></span></button>'}).join("");
  const keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
  const v=VIEWS[S.sub]||(instrMode()?roomView:regView);
  $("main").innerHTML='<div class="panel"><h2>'+esc(TITLES[VIEWS[S.sub]?S.sub:(instrMode()?"room":"reg")]||"")+'</h2>'+v()+'</div>';
  if(keep&&$(keep)&&["paste","cctext","sdi","edi","evby","fq"].includes(keep)){$(keep).focus();try{$(keep).setSelectionRange(pos,pos)}catch(e){}}
}

document.addEventListener("input",e=>{
  const i=e.target.id;
  if(i&&i.indexOf("o_")===0){S.one[i.slice(2)]=e.target.value;const bt=$("o_add");if(bt)bt.disabled=!(S.one.date&&S.one.last.trim()&&S.one.first.trim());return}if(i==="co_mgr"||i==="co_note"){S.co[i==="co_mgr"?"mgr":"note"]=e.target.value;const b=$("co_save");if(b)b.disabled=!conReady();return}if(i==="lastmsg"){S.lastMsg=e.target.value;return}if(i&&i.indexOf("nm_")===0){S.nmsg[i.slice(3)]=e.target.value;return}if(i&&i.indexOf("ot_")===0){const m=/^ot_(.+)_(wbt|wft)$/.exec(i);if(m){S.af[m[1]][m[2]]=e.target.value;const bt=document.querySelector("[data-a=save][data-id=\""+m[1]+"\"]");if(bt)bt.disabled=!afOk(m[1])}return}if(i==="fq"){S.fq=e.target.value;render();return}if(i==="paste")S.paste=e.target.value;else if(i==="cctext"){S.cctext=e.target.value;const b=document.querySelector("[data-a=sendcc]");if(b)b.disabled=!(S.ccr.length&&S.cctext.trim().length>=15)}
  else if(i==="sdi")S.sdi=e.target.value;else if(i==="edi")S.edi=e.target.value;
  else if(i==="clkd"){S.clk=+e.target.value;autoLate();render()}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,id=t.dataset.id,v=t.dataset.v,k=t.dataset.k;S.msg=(a==="go"?"":S.msg);S.err="";
  if(a==="go"){S.sub=v;if(v==="move")loadSpaces()}
  else if(a==="dt"){S.date=v;S.parsed=null;S.cc=null;S.mv=null;renderTabs();attach()}
  else if(a==="door"){S.door=v;const f=JOBS.filter(j=>!j.instr&&(v==="all"||j.door===v)).find(j=>!j.href);if(f)S.sub=f.id;if(S.sub==="move")loadSpaces()}
  else if(a==="chg"){S.view=S.view==="faculty"?"instr":"faculty";S.door="tonight";S.sub=S.view==="instr"?"room":"reg"}
  else if(a==="gt")S.og[v]=!S.og[v];
  else if(a==="rt")S.orow=S.orow===v?null:v;
  else if(a==="st"){setSt(id,v);return}
  else if(a==="conf"){confirmRoom(v);return}
  else if(a==="grp")S.room=v;
  else if(a==="pf"){const A=S.af[id]||(S.af[id]={bls:null,fa:null,wb:[],wf:[]});A[k]=v}
  else if(a==="why"){const A=S.af[id],wk=k,i=A[wk].indexOf(v);if(i>-1)A[wk].splice(i,1);else A[wk].push(v)}
  else if(a==="save"){saveResult(id);return}
  else if(a==="redo"){redo(id);return}
  else if(a==="conc"){S.cc=id;S.ccr=[];S.cctext=""}
  else if(a==="ccr"){const i=S.ccr.indexOf(v);if(i>-1)S.ccr.splice(i,1);else S.ccr.push(v)}
  else if(a==="cancelcc")S.cc=null;
  else if(a==="sendcc"){sendConcern();return}
  else if(a==="conopen"){S.ccl=v;S.co={out:"",mgr:"",note:""}}
  else if(a==="conout"){S.co.out=v;const b=$("co_save");if(b)b.disabled=!conReady();return}
  else if(a==="conme"){const me=S.user.displayName||S.user.email||"";S.co.mgr=S.co.mgr.trim()?S.co.mgr.trim()+", "+me:me}
  else if(a==="concancel"){S.ccl=null}
  else if(a==="consave"){if(conReady())closeConcern(v);return}
  else if(a==="mvopen")S.mv=S.mv===id?null:id;
  else if(a==="mvdo"){moveNurse(id,v);return}
  else if(a==="ev"){S.cfg.evenings[id]=v;saveCfg();return}
  else if(a==="mkev"){const s=dmyToIso(S.sdi),z=dmyToIso(S.edi);if(!s||!z)S.err="Use DD/MM/YYYY for both dates.";else if(z<=s)S.err="The last date must be after the first date.";else if((new Date(z)-new Date(s))/864e5>400)S.err="That is more than a year. Check the dates.";else{S.cfg.start=s;S.cfg.end=z;saveCfg();fillDates();return}}
  else if(a==="saveby"){const x=$("evby").value.trim();if(!x){S.cfg.confirmBy=""}else{const iso=dmyToIso(x);if(!iso){S.err="Use DD/MM/YYYY.";render();return}S.cfg.confirmBy=iso}saveCfg();return}
  else if(a==="parse"){parseNow();return}
  else if(a==="addp"){addParsed();return}
  else if(a==="dedupe"){dedupe();return}
  else if(a==="lastmsg"){buildLastMsg();return}
  else if(a==="mvreq"){const n=S.nurses.find(x=>x.id===id),mi=S.mi[id];if(n&&mi){S.nmsg[id]=degreeMsg(n,mi.hist,"again",v);upd(id,{pendingMove:{date:v,by:S.user.email||"",at:Date.now()}});S.mv=null;S.msg="Held. Send the message below to the nursing school lead."}}
  else if(a==="mvconfirm"){const n=S.nurses.find(x=>x.id===id);if(n&&n.pendingMove){const d=n.pendingMove.date;upd(id,{pendingMove:null}).then(()=>moveNurse(id,d))}return}
  else if(a==="mvcancel"){upd(id,{pendingMove:null});delete S.nmsg[id];S.msg="Request cancelled."}
  else if(a==="mvmsg"){const n=S.nurses.find(x=>x.id===id),mi=S.mi[id];if(n&&mi){S.nmsg[id]=n.pendingMove?degreeMsg(n,mi.hist,"again",n.pendingMove.date):degreeMsg(n,mi.hist,"max")}}
  else if(a==="mvcopy"){const ta=$("nm_"+id);if(ta){ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand("copy")}S.msg="Message copied."}}
  else if(a==="copymsg"){const ta=$("lastmsg");if(ta){ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand("copy")}S.msg="Message copied."}}
  else if(a==="oneadd"){const o=S.one;const line=[isoToDmy(o.date),o.room,o.last.trim(),o.first.trim(),o.email.trim(),o.field,o.year].join(", ");S.paste=(S.paste.trim()?S.paste.replace(/\s+$/,"")+"\n":"")+line;S.one.last="";S.one.first="";S.one.email="";S.one.field="";S.one.year="";S.msg="Added to the list below. Press Parse & preview when you have added everyone."}
  else if(a==="oneclear"){S.one={date:S.one.date,room:S.one.room,last:"",first:"",email:"",field:"",year:""}}
  else if(a==="seed"){seedTest();return}
  else if(a==="dl")dlFile(toCsv(backupRows()),"RMD refresher - "+S.date+" - results backup.csv");
  else if(a==="dls"){if(!isTest()&&schoolReady().ok)dlFile(toCsv(schoolRows()),"RMD basic life support refresher - "+niceDate(S.date)+" - nursing.csv")}
  render();
});

auth.onAuthStateChanged(async user=>{
  if(!user){window.location.href="signin.html";return}
  try{
    S.user=user;
    const role=await resolveRole(user.uid,user.email||"");
    const stu=await isStudentFaculty(user.email||"").catch(()=>false),sen=await isSeniorFaculty(user.email||"").catch(()=>false);
    S.staff=role===ROLES.DIRECTOR||stu||sen;S.role=role;
    if(!(S.staff||role===ROLES.ASSESSOR)){$("authMsg").textContent="The Tuesday hub is for RMD faculty, assessors and Senior Instructors. If you should have access, ask the Course Director.";return}
    
    await loadCfg();
    $("gate").classList.add("hidden");$("app").classList.remove("hidden");
    S.sub=S.staff?"reg":"room";
    fillDates();
    attach();render();
    setInterval(()=>{autoLate();render()},60000);
  }catch(err){console.error(err);$("authMsg").textContent="Could not open this page: "+(err.message||err)}
});
</script>
</body>
