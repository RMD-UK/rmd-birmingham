<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPIS Candidate Rating — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background:#f0f3f6; font-family: var(--font); margin:0; padding:0 0 16px; }

    .top-bar { background:var(--rmd-navy); color:#fff; padding:6px 12px; display:flex; align-items:center; gap:10px; }
    .top-bar img { height:22px; border-radius:50%; background:#fff; }
    .top-bar-title { flex:1; font-size:14px; font-weight:700; }
    .top-bar-sub { font-size:11px; font-weight:400; opacity:.65; margin-left:8px; }
    .top-bar-back { color:rgba(255,255,255,.7); text-decoration:none; font-size:12px; }
    .top-bar-back:hover { color:#fff; }

    .picker-bar { background:#fff; border-bottom:1px solid #e0e4ee; padding:6px 12px; display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; position:relative; z-index:20; }
    .picker-bar label { font-size:12px; font-weight:700; color:var(--rmd-navy); }
    .picker-bar select, .picker-bar input[type=text] { padding:6px 9px; border:1.5px solid #d0d5e0; border-radius:7px; font-size:13px; font-family: var(--font); }
    .picker-bar select { min-width:200px; max-width:100%; }
    .picker-bar input[type=text]:focus { outline:none; border-color:var(--rmd-blue); }
    #searchWrap { position:relative; }
    #candidateSearch { width:200px; }
    #searchResultsWrap { position:absolute; top:100%; left:0; margin-top:4px; background:#fff; border:1px solid #d0d5e0; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:300px; max-height:260px; overflow:auto; z-index:60; }
    .sr-item { display:block; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid #eef1f8; padding:7px 12px; font:inherit; cursor:pointer; }
    .sr-item:hover { background:#f2f6fd; }
    .sr-item .n { font-weight:700; font-size:13px; color:var(--rmd-navy); }
    .sr-item .m { font-size:11px; color:#8893b0; }
    #roomPickerWrap { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    #roomPickerWrap .cap { font-size:12px; font-weight:700; color:var(--rmd-navy); }

    .room-row { display:flex; flex-wrap:wrap; gap:6px; }
    .room-chip { background:#fff; border:1.5px solid #dde2ed; border-radius:7px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--rmd-navy); cursor:pointer; font-family:var(--font); }
    .room-chip .n { font-weight:400; color:#8893b0; margin-left:4px; }
    .room-chip.active { background:var(--rmd-navy); color:#fff; border-color:var(--rmd-navy); }
    .room-chip.active .n { color:rgba(255,255,255,.7); }

    .wrap { max-width: 1040px; margin:0 auto; padding: 0 12px; }
    .no-course { padding:30px 16px; text-align:center; color:#8893b0; font-size:14px; }

    .cand-strip { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 0 0; }
    .cand-chip { background:#fff; border:1.5px solid #dde2ed; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; color:var(--rmd-navy); cursor:pointer; font-family:var(--font); }
    .cand-chip:hover { border-color:var(--rmd-blue); }
    .cand-chip.done { background:#e6f4ea; border-color:#bfe0c9; color:#1a6e31; }
    .cand-chip.active { box-shadow:0 0 0 2px var(--rmd-blue); border-color:var(--rmd-blue); }
    .strip-count { font-size:11.5px; color:#8893b0; margin-left:4px; }

    section.detail { padding:0; background:#fff; border:1px solid #dde2ed; border-radius:10px; overflow:hidden; margin-top:8px; }
    .detail-head { background:var(--rmd-navy); color:#fff; padding:7px 14px; display:flex; align-items:baseline; gap:4px 14px; flex-wrap:wrap; }
    .detail-head h3 { margin:0; font-size:15px; }
    .detail-head .sub { font-size:12px; color:rgba(255,255,255,.75); }

    .matrix { display:grid; grid-template-columns:150px repeat(3, 1fr); gap:4px; padding:8px 10px 6px; }
    .m-head { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; text-align:center; padding:3px 4px; border-radius:5px; }
    .m-head.s1 { background:#fbe3e6; color:#b0001a; }
    .m-head.s2 { background:#fbeedd; color:#c17a00; }
    .m-head.s3 { background:#e6f4ea; color:#1a6e31; }
    .m-label { font-weight:700; font-size:12.5px; color:var(--rmd-navy); display:flex; align-items:center; padding-right:6px; line-height:1.2; }
    .m-cell { border:1.5px solid #e3e7f0; background:#fff; border-radius:7px; padding:5px 8px; font:inherit; font-size:11.5px; line-height:1.3; color:#5a6472; text-align:left; cursor:pointer; min-height:44px; display:flex; align-items:center; gap:7px; }
    .m-cell:hover { background:#f7f9fc; }
    .m-cell .lv { flex-shrink:0; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .m-cell .lv.s1 { background:#fbe3e6; color:#b0001a; }
    .m-cell .lv.s2 { background:#fbeedd; color:#c17a00; }
    .m-cell .lv.s3 { background:#e6f4ea; color:#1a6e31; }
    .m-cell.sel.s1 { background:#fbe3e6; border-color:#b0001a; color:#5c0010; }
    .m-cell.sel.s2 { background:#fbeedd; border-color:#c17a00; color:#5a3700; }
    .m-cell.sel.s3 { background:#e6f4ea; border-color:#1a6e31; color:#0e4020; }
    .locked { opacity:.55; pointer-events:none; }

    .checks { display:flex; gap:8px; padding:0 10px 8px; flex-wrap:wrap; }
    .check { flex:1; min-width:260px; display:flex; align-items:flex-start; gap:8px; border-radius:0 6px 6px 0; padding:6px 10px; font-size:12px; line-height:1.35; cursor:pointer; }
    .check input { width:auto; margin-top:2px; flex-shrink:0; }
    .check.pot { background:#e8f0fe; border-left:4px solid var(--rmd-blue); }
    .check.cred { background:#fff8e1; border-left:4px solid #b8860b; }

    .cred-bar { display:flex; align-items:center; gap:8px; margin:6px 10px 0; padding:5px 10px; border-radius:0 6px 6px 0; background:#fff8e1; border-left:4px solid #b8860b; font-size:12px; line-height:1.35; cursor:pointer; }
    .cred-bar input { width:auto; flex-shrink:0; }
    .check.off { opacity:.45; filter:grayscale(1); cursor:default; }
    .check.mistake { background:#fce8e6; border-left:4px solid #b7410e; }
    .link-btn { background:none; border:none; padding:2px 4px; font:inherit; font-size:11.5px; color:#8893b0; text-decoration:underline; cursor:pointer; align-self:center; }
    .link-btn:hover { color:var(--rmd-navy); }
    .link-btn .sm { display:none; }
    .foot { display:flex; align-items:center; gap:10px 14px; padding:8px 12px; background:#f7f9fc; border-top:1px solid #eef1f8; flex-wrap:wrap; }
    .foot .tot-label { font-size:11px; color:#8893b0; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
    .foot .tot-val { font-size:18px; font-weight:700; color:var(--rmd-navy); }
    .foot .spacer { flex:1; }
    .btn-submit { padding:9px 18px; background:var(--rmd-blue); color:#fff; border:none; border-radius:8px; font-size:13.5px; font-weight:700; font-family:var(--font); cursor:pointer; }
    .btn-submit:hover:not(:disabled) { background:var(--rmd-navy); }
    .btn-submit:disabled { background:#aab8c2; cursor:default; }
    .btn-next { padding:9px 18px; background:#1a6e31; color:#fff; border:none; border-radius:8px; font-size:13.5px; font-weight:700; font-family:var(--font); cursor:pointer; }
    .btn-next:hover { background:#14562a; }
    .btn-reset { padding:8px 14px; background:#fff; color:var(--rmd-navy); border:2px solid #ccd6dd; border-radius:8px; font-size:13px; font-weight:700; font-family:var(--font); cursor:pointer; }
    .btn-reset:hover:not(:disabled) { border-color:#b7410e; color:#b7410e; }
    .btn-reset:disabled { opacity:.45; cursor:default; }
    .submit-msg { font-size:13px; font-weight:700; color:#1a6e31; background:#e6f4ea; border:1px solid #bfe0c9; padding:6px 10px; border-radius:8px; }
    .submit-err { font-size:12.5px; color:#b7410e; }
    .hint { font-size:12px; color:#8893b0; }

    .auth-overlay { position:fixed; inset:0; background:var(--rmd-navy); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:14px; color:#fff; font-family: var(--font); }
    #authMsg { font-size:15px; opacity:.7; }

    @media (max-width: 640px) {
      .top-bar-sub { display:none; }
      .picker-bar { padding:5px 8px; gap:5px 8px; }
      .picker-bar select { flex:1 1 100%; min-width:0; }
      #candidateSearch { width:130px; }
      .wrap { padding:0 8px; }
      .cand-strip { gap:5px; padding-top:6px; }
      .cand-chip { padding:4px 10px; font-size:12px; }
      .detail-head { padding:5px 10px; }
      .detail-head h3 { font-size:14px; }
      .detail-head .sub { font-size:11px; }
      .matrix { grid-template-columns:repeat(3, 1fr); gap:3px; padding:4px 6px 2px; }
      .m-head { display:none; }
      .m-label { grid-column:1 / -1; padding:3px 0 0; font-size:11.5px; }
      .m-cell { flex-direction:column; align-items:flex-start; gap:2px; padding:3px 5px; min-height:0; font-size:10px; line-height:1.2; }
      .m-cell .lv { width:15px; height:15px; font-size:10px; }
      .checks { padding:0 6px 6px; gap:4px; }
      .check { min-width:0; flex-basis:100%; padding:4px 8px; font-size:11px; }
      .cred-bar { margin:4px 6px 0; padding:4px 8px; font-size:11px; }
      .foot { padding:6px 8px; gap:6px 10px; }
      .foot .hint { display:none; }
      .foot .tot-label { display:none; }
      .link-btn .lg { display:none; }
      .link-btn .sm { display:inline; }
      .btn-reset { padding:6px 10px; font-size:12px; }
      .btn-submit, .btn-next { padding:8px 14px; }
    }
  </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
  <div style="font-size:36px">📝</div>
  <div id="authMsg">Checking access…</div>
</div>

<div class="top-bar">
  <a href="member-menu.html"><img src="assets/rmd-logo.png" alt="RMD"></a>
  <div class="top-bar-title">OPIS Candidate Rating<span class="top-bar-sub">RMD Birmingham, Stage 1 Provider Courses</span></div>
  <a class="top-bar-back" href="member-menu.html">← Menu</a>
</div>

<div class="picker-bar">
  <label for="courseSelect">Course</label>
  <select id="courseSelect" onchange="selectCourse(this.value)">
    <option value="">Choose a course</option>
  </select>
  <div id="roomPickerWrap" style="display:none;">
    <span class="cap">Room</span>
    <div class="room-row" id="roomRow"></div>
  </div>
  <div id="searchWrap" style="display:none;">
    <input type="text" id="candidateSearch" placeholder="Find a candidate…" oninput="handleSearch(this.value)">
    <div id="searchResultsWrap" style="display:none;"><div id="searchResultsGrid"></div></div>
  </div>
</div>

<div class="wrap">
  <div id="noCourse" class="no-course">Choose a course, then your teaching room, to see the candidates you can rate.</div>
  <div id="rosterWrap" style="display:none;"><div class="cand-strip" id="rosterGrid"></div></div>
  <section class="detail" id="detail" style="display:none;"></section>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// OPIS Candidate Rating — Stage 1 evening-course instructors score candidates
// they've taught against 5 criteria (Communication, Team member, Confident /
// flexible / adaptable, Interactive / supportive / enthusiastic, Punctuality
// and reliability), 1-3 each, plus an optional "potential outstanding teaching
// ability" tick box. Criteria revised 2026-10-07 to follow the instructor
// selection criteria (Jon). Earlier submissions used the old keys
// (attitudeEngagement, takingFeedback, givingFeedback) and are kept as they
// were; admin-instructor-review.html shows either set.
// NOT on this form by design: registration/eligibility (all students qualify,
// registering body is the University of Birmingham) and resuscitation /
// defibrillation knowledge (taken from the Stage 1 assessment result later).
// Same course/room/candidate
// data as course-roster-view.html (stage1_candidates + course_allocations),
// same access gate (director / RMD Student Faculty / RMD Senior Faculty).
// Each submission is its own opis_ratings doc — deliberately not keyed by
// candidate, so several instructors (or the same one more than once) can
// each submit independently for the same candidate. See firestore.rules for
// the matching server-side enforcement.
// ─────────────────────────────────────────────────────────────────────────────
const ROOMS = STAGE1_TEACHING_ROOMS;

const CRITERIA = [
  { key: "communication", label: "Communication", levels: {
      1: "Difficulty communicating clearly with fellow candidates",
      2: "Communicates clearly with fellow candidates",
      3: "Excellent communication: clear, confident and easily understood"
  }},
  { key: "teamMember", label: "Team member", levels: {
      1: "Finds it hard to work as part of a team",
      2: "Works well as a team member",
      3: "Excellent team member: helps and includes others"
  }},
  { key: "confidentAdaptable", label: "Confident, flexible and adaptable", levels: {
      1: "Hesitant, and finds it hard to adjust when things change",
      2: "Reasonably confident, and adjusts when things change",
      3: "Confident, flexible and readily adaptable"
  }},
  { key: "interactiveSupportive", label: "Interactive, supportive and enthusiastic", levels: {
      1: "Passive, with little interaction with or support for others",
      2: "Joins in and supports others when prompted",
      3: "Consistently interactive, supportive and enthusiastic"
  }},
  { key: "punctuality", label: "Punctuality and reliability", levels: {
      1: "Often late",
      2: "Sometimes late",
      3: "Always on time"
  }}
];

let allCandidates   = [];
let allInstructors  = [];
let allAllocDocs    = [];
let defaultAllocDoc = null;
let hasFullAccess   = false; // Director / RMD Student Faculty / RMD Senior Faculty — sees every candidate. Anyone else only sees candidates on a room they're actually teaching (instructorTeamUids) — see loadData() and firestore.rules.

let currentUser = null;
let myName = "";

let selectedCourse = null;
let selectedRoom = null;
let selectedCandidateId = null;
let currentScores = {};
let credibilityChecked = false;
let teachingPotential = false; // optional tick: potential outstanding teaching ability
let scoredThisSession = new Set(); // candidateIds submitted in this page session
let doneSet = new Set();           // candidateIds this person has submitted, remembered on this device
function doneKey() { return "opis_done_" + (currentUser ? currentUser.uid : ""); }
function loadDone() {
  try { doneSet = new Set(JSON.parse(localStorage.getItem(doneKey()) || "[]")); } catch (e) { doneSet = new Set(); }
}
function saveDone() {
  try { localStorage.setItem(doneKey(), JSON.stringify(Array.from(doneSet))); } catch (e) { /* storage blocked: session set still works */ }
}
function isDone(id) { return doneSet.has(id) || scoredThisSession.has(id); }
let justSubmitted = false;
let mistakeChecked = false;   // 'I made a mistake with my first submission' (correction of an earlier rating)
let mistakeOpen = false;      // user opened the correction box for a candidate not yet marked rated on this device

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

initFirebase();

window.addEventListener("load", () => {
  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = "signin.html"; return; }
    currentUser = user;
    loadDone();

    const email = user.email || "";
    const [role, studentFac, seniorFac] = await Promise.all([
      resolveRole(user.uid, email),
      isStudentFaculty(email),
      isSeniorFaculty(email)
    ]);
    hasFullAccess = role === "director" || studentFac || seniorFac;

    // Not Director/Student Faculty/Senior Faculty — still let them in if
    // they're actually on a candidate's room team (instructorTeamUids,
    // written by Course Room & Instructor Allocation's saveAll() — see
    // firestore.rules for the matching read/write rules, 2026-10-03). This
    // probe is the same query loadData() uses, just capped to 1 result.
    if (!hasFullAccess) {
      let onATeam = false;
      try {
        const probe = await db.collection(COLLECTIONS.stage1Candidates)
          .where("instructorTeamUids", "array-contains", user.uid).limit(1).get();
        onATeam = !probe.empty;
      } catch (e) { console.warn("room-team check failed:", e.message); }
      if (!onATeam) {
        const msg = document.getElementById("authMsg");
        if (msg) msg.textContent = "RMD Senior/Student Faculty, Directors, and instructors assigned to a teaching room only.";
        setTimeout(() => { window.location.href = "member-menu.html"; }, 1500);
        return;
      }
    }

    try {
      const snap = await db.collection(COLLECTIONS.people).doc(user.uid).get();
      const d = snap.exists ? snap.data() : {};
      const surname = d.passportLastName || (d.name ? d.name.trim().split(/\s+/).pop() : "");
      const first = d.preferredName ? d.preferredName.trim().split(/\s+/)[0] : null;
      myName = first ? [first, surname].filter(Boolean).join(" ") : (d.name || email);
    } catch (e) { myName = email; }

    document.getElementById("authOverlay").style.display = "none";
    await loadData();
    populateCourseDropdown();
  });
});

async function loadData() {
  try {
    const snap = hasFullAccess
      ? await db.collection(COLLECTIONS.stage1Candidates).get()
      : await db.collection(COLLECTIONS.stage1Candidates)
          .where("instructorTeamUids", "array-contains", currentUser.uid).get();
    allCandidates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.warn("stage1_candidates load failed:", e.message); }

  try {
    const snap = await db.collection(COLLECTIONS.people).where("role", "==", ROLES.INSTRUCTOR).get();
    allInstructors = snap.docs.map(d => {
      const data = d.data();
      const surname = data.passportLastName || (data.name ? data.name.trim().split(/\s+/).pop() : "");
      const first = data.preferredName ? data.preferredName.trim().split(/\s+/)[0] : null;
      const name = first ? [first, surname].filter(Boolean).join(" ") : (data.name || d.id);
      return { uid: d.id, name };
    });
  } catch (e) { console.warn("instructor load failed:", e.message); }

  try {
    const snap = await db.collection(COLLECTIONS.courseAllocations).get();
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    defaultAllocDoc = docs.find(d => d.id === "_default") || null;
    allAllocDocs = docs.filter(d => d.id !== "_default");
  } catch (e) { console.warn("course_allocations load failed:", e.message); }
}

function courseList() {
  const set = new Set();
  allCandidates.forEach(c => { if (c.course) set.add(c.course); });
  return Array.from(set).sort();
}

function slugify(s) {
  return (s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "course";
}

function populateCourseDropdown() {
  const sel = document.getElementById("courseSelect");
  const courses = courseList();
  sel.innerHTML = `<option value="">Choose a course</option>` +
    courses.map(c => {
      const n = allCandidates.filter(x => x.course === c).length;
      return `<option value="${esc(c)}">${esc(c)} (${n} candidate${n===1?"":"s"})</option>`;
    }).join("");
  if (!courses.length) {
    document.getElementById("noCourse").textContent = "No Stage 1 courses have candidates imported yet.";
  }
}

function instructorName(uid) {
  const i = allInstructors.find(x => x.uid === uid);
  if (i) return i.name;
  // allInstructors is empty for a room-team-only user (people collection
  // isn't readable to them) — fall back to the denormalized name carried
  // on their own candidates' instructorTeamNames, same order as
  // instructorTeamUids, so this still resolves to a real name rather than
  // the raw uid.
  for (const c of allCandidates) {
    if (Array.isArray(c.instructorTeamUids) && Array.isArray(c.instructorTeamNames)) {
      const idx = c.instructorTeamUids.indexOf(uid);
      if (idx !== -1 && c.instructorTeamNames[idx]) return c.instructorTeamNames[idx];
    }
  }
  return uid;
}

function courseTeams(course) {
  const teams = {};
  ROOMS.forEach(r => { teams[r] = []; });
  if (hasFullAccess) {
    const own = allAllocDocs.find(d => d.id === slugify(course) || d.course === course);
    if (own && own.instructorTeams) {
      ROOMS.forEach(r => { teams[r] = (own.instructorTeams[r] || []).slice(); });
    } else if (defaultAllocDoc && defaultAllocDoc.instructorTeams) {
      ROOMS.forEach(r => { teams[r] = (defaultAllocDoc.instructorTeams[r] || []).slice(); });
    }
  } else {
    // Room-team-only instructor: course_allocations isn't readable to them,
    // so pull the team straight off their own candidates' instructorTeamUids
    // / instructorTeamNames instead — every candidate in a room carries the
    // same team, so the first one found in each room has it.
    candidatesForCourse(course).forEach(c => {
      if (!c.room || teams[c.room].length) return;
      const full = allCandidates.find(x => x.id === c.id);
      if (full && Array.isArray(full.instructorTeamUids)) teams[c.room] = full.instructorTeamUids.slice();
    });
  }
  return teams;
}

function candidatesForCourse(course) {
  return allCandidates.filter(c => c.course === course).map(c => ({
    id: c.id,
    name: c.name || "(no name)",
    email: c.email || "",
    degree: c.degree || "",
    room: ROOMS.includes(c.room) ? c.room : null
  }));
}

function selectCourse(course) {
  selectedCourse = course || null;
  selectedRoom = null;
  selectedCandidateId = null;
  document.getElementById("noCourse").style.display = course ? "none" : "";
  document.getElementById("searchWrap").style.display = course ? "" : "none";
  document.getElementById("roomPickerWrap").style.display = course ? "" : "none";
  document.getElementById("rosterWrap").style.display = "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("candidateSearch").value = "";
  document.getElementById("searchResultsWrap").style.display = "none";
  if (!course) return;

  const candidates = candidatesForCourse(course);
  const teams = courseTeams(course);
  const roomsWithContent = ROOMS.filter(rid =>
    candidates.some(c => c.room === rid) || (teams[rid] && teams[rid].length)
  );

  document.getElementById("roomRow").innerHTML = roomsWithContent.length
    ? roomsWithContent.map(rid => {
        const n = candidates.filter(c => c.room === rid).length;
        const names = (teams[rid] || []).map(instructorName).join(", ");
        return `<button type="button" class="room-chip" data-room="${esc(rid)}" onclick="selectRoom('${esc(rid)}')" title="${esc(names || 'No instructors allocated yet')}">${esc(rid)}<span class="n">${n} cand.</span></button>`;
      }).join("")
    : `<div class="no-course">No rooms have been set up for this course yet.</div>`;
}

function selectRoom(room) {
  selectedRoom = room;
  selectedCandidateId = null;
  document.getElementById("detail").style.display = "none";
  document.querySelectorAll(".room-chip").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-room") === room);
  });
  renderRoster();
  document.getElementById("rosterWrap").style.display = "";
}

function handleSearch(query) {
  const q = (query || "").trim().toLowerCase();
  const wrap = document.getElementById("searchResultsWrap");
  const grid = document.getElementById("searchResultsGrid");
  if (!selectedCourse || q.length < 2) {
    wrap.style.display = "none";
    grid.innerHTML = "";
    return;
  }
  const matches = candidatesForCourse(selectedCourse).filter(c => c.name.toLowerCase().includes(q));
  wrap.style.display = "";
  grid.innerHTML = matches.length ? matches.map(c => `
    <button type="button" class="sr-item" onclick="selectCandidateFromSearch('${esc(c.id)}')">
      <div class="n">${isDone(c.id) ? "✓ " : ""}${esc(c.name)}</div>
      <div class="m">${esc(c.degree || "—")} · Room ${esc(c.room || "not yet assigned")}</div>
    </button>
  `).join("") : `<div class="no-course" style="padding:12px;">No candidates match "${esc(query)}".</div>`;
}

function selectCandidateFromSearch(candidateId) {
  const candidate = candidatesForCourse(selectedCourse).find(c => c.id === candidateId);
  if (!candidate) return;
  selectedRoom = candidate.room || null;
  document.querySelectorAll(".room-chip").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-room") === selectedRoom);
  });
  if (selectedRoom) {
    document.getElementById("rosterWrap").style.display = "";
    renderRoster();
  } else {
    document.getElementById("rosterWrap").style.display = "none";
  }
  document.getElementById("searchResultsWrap").style.display = "none";
  document.getElementById("candidateSearch").value = "";
  selectCandidate(candidateId);
}

function renderRoster() {
  const candidates = candidatesForCourse(selectedCourse).filter(c => c.room === selectedRoom);
  const grid = document.getElementById("rosterGrid");
  const done = candidates.filter(c => isDone(c.id)).length;
  grid.innerHTML = candidates.length
    ? candidates.map(c => `<button type="button" class="cand-chip ${isDone(c.id) ? "done" : ""} ${c.id === selectedCandidateId ? "active" : ""}" onclick="selectCandidate('${esc(c.id)}')" title="${esc(c.degree || "")}">${isDone(c.id) ? "✓ " : ""}${esc(c.name)}</button>`).join("")
      + `<span class="strip-count">${done} of ${candidates.length} rated</span>`
    : `<div class="no-course">No candidates assigned to this room yet.</div>`;
}

function selectCandidate(candidateId) {
  selectedCandidateId = candidateId;
  currentScores = {};
  credibilityChecked = false;
  teachingPotential = false;
  justSubmitted = false;
  mistakeChecked = false;
  mistakeOpen = false;
  renderRoster();
  renderDetail();
}

// Next candidate in the same room who has not been submitted yet. Looks after
// the current person first, then wraps round to the start of the room.
function nextUnsubmittedId() {
  if (!selectedRoom) return null;
  const list = candidatesForCourse(selectedCourse).filter(c => c.room === selectedRoom);
  const i = list.findIndex(c => c.id === selectedCandidateId);
  const order = list.slice(i + 1).concat(list.slice(0, i + 1));
  const next = order.find(c => c.id !== selectedCandidateId && !isDone(c.id));
  return next ? next.id : null;
}

function nextCandidate() {
  const id = nextUnsubmittedId();
  if (id) selectCandidate(id);
}

function evaluate() {
  const vals = CRITERIA.map(c => currentScores[c.key]);
  const scoredCount = vals.filter(v => v !== undefined && v !== null).length;
  const complete = scoredCount === CRITERIA.length;
  const total = vals.reduce((a, b) => a + (b || 0), 0);
  return { total, complete, scoredCount };
}

function renderDetail() {
  const candidate = candidatesForCourse(selectedCourse).find(c => c.id === selectedCandidateId);
  const detail = document.getElementById("detail");
  if (!candidate) { detail.style.display = "none"; return; }
  detail.style.display = "";

  const { total, complete, scoredCount } = evaluate();
  // Outstanding teaching ability can only be ticked once all five are scored
  // and the total is 12 or more; otherwise it is greyed out and cleared.
  const potOk = complete && total >= 12;
  if (!potOk) teachingPotential = false;
  // A second submission for someone already rated needs the "I made a mistake"
  // box. It is saved as a correction, and the Course Director views show the
  // newer one as current and the earlier one as superseded.
  const mistakeRequired = isDone(candidate.id);
  const showMistake = mistakeRequired || mistakeOpen;
  const ready = complete && credibilityChecked && !justSubmitted && (!mistakeRequired || mistakeChecked);
  const LEVELS = { 1: "Unsatisfactory", 2: "Adequate", 3: "Excellent" };

  const rows = CRITERIA.map(crit => {
    const selected = currentScores[crit.key];
    const cells = [3, 2, 1].map(level => `
      <button type="button" class="m-cell ${level === selected ? "sel s" + level : ""}" onclick="setScore('${crit.key}', ${level})">
        <span class="lv s${level}">${level}</span><span>${esc(crit.levels[level])}</span>
      </button>`).join("");
    return `<div class="m-label">${esc(crit.label)}</div>${cells}`;
  }).join("");

  let foot;
  if (justSubmitted) {
    const nextId = nextUnsubmittedId();
    foot = `<span class="submit-msg">✓ Rating submitted (${total} / 15)</span><span class="spacer"></span>` +
      (nextId
        ? `<button type="button" class="btn-next" id="nextBtn" onclick="nextCandidate()">Next candidate →</button>`
        : (selectedRoom ? `<span class="submit-msg">Everyone in Room ${esc(selectedRoom)} is rated ✓</span>` : ""));
  } else {
    const hint = !complete ? "Score all 5 and tick the confirmation"
               : !credibilityChecked ? "Tick the confirmation under the name"
               : (mistakeRequired && !mistakeChecked) ? "Tick the box about your first submission"
               : "";
    foot = `<span class="tot-label">Total${complete ? "" : ` (${scoredCount} of 5)`}</span>
      <span class="tot-val">${complete ? total : "–"} <span style="font-size:12px;color:#8893b0;font-weight:400;">/ 15</span></span>
      ${showMistake ? "" : `<button type="button" class="link-btn" onclick="openMistake()"><span class="lg">Correcting an earlier submission?</span><span class="sm">Correcting?</span></button>`}
      <span class="spacer"></span>
      <span class="hint" id="submitHint" style="${ready ? "display:none;" : ""}">${hint}</span>
      <span class="submit-err" id="submitErr" style="display:none;"></span>
      <button type="button" class="btn-reset" id="resetBtn" ${(scoredCount || credibilityChecked || teachingPotential || mistakeChecked) ? "" : "disabled"} onclick="resetRating()">Reset</button>
      <button type="button" class="btn-submit" id="submitBtn" ${ready ? "" : "disabled"} onclick="submitRating()">Submit rating</button>`;
  }

  detail.innerHTML = `
    <div class="detail-head">
      <h3>${esc(candidate.name)}</h3>
      <div class="sub">${esc(candidate.degree || "—")} · Room ${esc(selectedRoom || "not yet assigned")} · ${esc(selectedCourse)}</div>
    </div>
    <label class="cred-bar ${justSubmitted ? "locked" : ""}">
      <input type="checkbox" id="credibilityCheckbox" ${credibilityChecked ? "checked" : ""} onchange="setCredibility(this.checked)">
      <span>I've spent enough time with this person to make a credible submission.</span>
    </label>
    <div class="matrix ${justSubmitted ? "locked" : ""}">
      <div></div>
      <div class="m-head s3">3 · ${LEVELS[3]}</div><div class="m-head s2">2 · ${LEVELS[2]}</div><div class="m-head s1">1 · ${LEVELS[1]}</div>
      ${rows}
    </div>
    <div class="checks ${justSubmitted ? "locked" : ""}">
      <label class="check pot ${potOk ? "" : "off"}">
        <input type="checkbox" id="teachingCheckbox" ${teachingPotential ? "checked" : ""} ${potOk ? "" : "disabled"} onchange="setTeachingPotential(this.checked)">
        <span><b>Potential outstanding teaching ability</b> ${potOk ? "(optional: tick only if you saw it)" : "(only available when the total is 12 or more)"}</span>
      </label>
      ${showMistake ? `
      <label class="check mistake">
        <input type="checkbox" id="mistakeCheckbox" ${mistakeChecked ? "checked" : ""} onchange="setMistake(this.checked)">
        <span><b>I made a mistake with my first submission and need to enter a new, correct one.</b>${mistakeRequired ? " (needed to submit again for this candidate)" : ""}</span>
      </label>` : ""}
    </div>
    <div class="foot">${foot}</div>
  `;
  const nb = document.getElementById("nextBtn");
  if (nb) nb.focus();
}

// Clear this candidate's scores and both ticks before submitting. Nothing has been
// saved yet at this point, so this only resets the form.
function resetRating() {
  currentScores = {};
  credibilityChecked = false;
  teachingPotential = false;
  mistakeChecked = false;
  renderDetail();
}

function setMistake(v) { mistakeChecked = !!v; renderDetail(); }
function openMistake() { mistakeOpen = true; renderDetail(); }

function setScore(key, level) {
  currentScores[key] = level;
  renderDetail();
}

function setTeachingPotential(v) { teachingPotential = !!v; }

function setCredibility(checked) {
  credibilityChecked = checked;
  renderDetail();
}

async function submitRating() {
  const candidate = candidatesForCourse(selectedCourse).find(c => c.id === selectedCandidateId);
  const { total, complete } = evaluate();
  const errEl = document.getElementById("submitErr");
  const btn = document.getElementById("submitBtn");
  errEl.style.display = "none";

  const mistakeRequired = isDone(candidate ? candidate.id : "");
  if (!candidate || !complete || !credibilityChecked || justSubmitted || (mistakeRequired && !mistakeChecked)) return;

  btn.disabled = true;
  btn.textContent = "Submitting…";

  try {
    await db.collection(COLLECTIONS.opisRatings).add({
      candidateId: candidate.id,
      candidateName: candidate.name,
      candidateEmail: candidate.email || null,
      course: selectedCourse,
      room: selectedRoom,
      scores: { ...currentScores },
      total: total,
      outstandingTeachingPotential: (teachingPotential === true && total >= 12),
      credibilityConfirmed: true,
      ...(mistakeChecked ? { correctsPrevious: true } : {}),
      submittedByUid: currentUser.uid,
      submittedByName: myName,
      submittedByEmail: currentUser.email || null,
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    scoredThisSession.add(candidate.id);
    doneSet.add(candidate.id);
    saveDone();
    justSubmitted = true;
    renderRoster();
    renderDetail();   // shows "Rating submitted" and the Next candidate button
  } catch (err) {
    errEl.textContent = "Couldn't submit. Check your connection and try again.";
    errEl.style.display = "";
    btn.disabled = false;
    btn.textContent = "Submit rating";
  }
}
</script>
