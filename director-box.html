<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Director Box - RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
  <style>
    * { box-sizing: border-box; }
    body { background:#f0f3f6; font-family: var(--font); margin:0; padding:0 0 48px; color:#1f2540; }
    .top-bar { background:var(--rmd-navy); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .top-bar img { height:28px; border-radius:50%; background:#fff; }
    .top-bar-title { flex:1; font-size:15px; font-weight:700; }
    .top-bar a.back { color:rgba(255,255,255,.75); text-decoration:none; font-size:12px; }
    .wrap { max-width:1040px; margin:0 auto; padding:16px 14px; }
    .auth-overlay { position:fixed; inset:0; background:var(--rmd-navy); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:14px; color:#fff; font-family:var(--font); }

    /* course picker */
    .courses { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; -webkit-overflow-scrolling:touch; }
    .cbtn { appearance:none; flex:0 0 auto; border:1.5px solid #d6dbea; background:#fff; color:#35456b; border-radius:12px; padding:8px 14px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; text-align:left; line-height:1.25; }
    .cbtn small { display:block; font-weight:600; color:#6b7aa0; font-size:11.5px; }
    .cbtn.on { background:var(--rmd-navy); border-color:var(--rmd-navy); color:#fff; }
    .cbtn.on small { color:rgba(255,255,255,.75); }
    .cbtn:focus-visible, .door:focus-visible, .next:focus-visible { outline:3px solid #f49001; outline-offset:2px; }

    /* three Mondays */
    .line { display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin:6px 0 16px; position:relative; }
    .line::before { content:""; position:absolute; left:16.6%; right:16.6%; top:13px; height:3px; background:#d6dbea; }
    .nd { text-align:center; position:relative; padding:0 4px; }
    .nd i { display:block; width:28px; height:28px; border-radius:50%; margin:0 auto 6px; background:#fff; border:3px solid #d6dbea; position:relative; z-index:1; }
    .nd.done i { background:#1a6e31; border-color:#1a6e31; }
    .nd.now i { background:#f49001; border-color:#f49001; box-shadow:0 0 0 5px rgba(244,144,1,.2); }
    .nd b { display:block; font-size:13px; }
    .nd small { display:block; font-size:12px; color:#5a6b8c; }

    /* the one thing to do next */
    .next { display:block; text-decoration:none; color:#fff; background:linear-gradient(135deg,var(--rmd-navy),#5a35a0); border-radius:16px; padding:18px 20px; margin-bottom:18px; }
    .next small.k { display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:#ffd9a0; font-weight:800; }
    .next h2 { margin:4px 0 4px; font-size:22px; }
    .next p { margin:0; font-size:14px; line-height:1.45; color:rgba(255,255,255,.9); }
    .next .go { display:inline-block; margin-top:12px; background:#fff; color:var(--rmd-navy); font-weight:800; font-size:13px; padding:8px 16px; border-radius:99px; }

    h3.sec { margin:22px 2px 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#5a6b8c; }
    h3.sec span { font-weight:600; letter-spacing:0; text-transform:none; color:#7d89a8; margin-left:6px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
    .door { display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit; background:#fff; border:1.5px solid #dde2ed; border-radius:14px; padding:13px 14px 12px; min-height:104px; transition:border-color .15s, transform .15s; }
    .door:hover { border-color:var(--rmd-navy); transform:translateY(-1px); }
    .door .hd { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .door b { font-size:15px; line-height:1.25; }
    .door .st { font-size:13.5px; color:#35456b; line-height:1.4; font-weight:600; flex:1; }
    .door .ds { font-size:12px; color:#6b7aa0; line-height:1.4; }
    .door.here { border-color:#f49001; background:#fffaf1; }
    .chip { flex:0 0 auto; font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:#eef1f8; color:#35456b; white-space:nowrap; }
    .chip.ok { background:#e3f4e8; color:#1a6e31; } .chip.todo { background:#fff3cd; color:#7a5200; }
    .chip.bad { background:#fde8ea; color:#b3261e; } .chip.live { background:#f49001; color:#fff; } .chip.na { background:#eef1f8; color:#7d89a8; }
    .note { font-size:12.5px; color:#6b7aa0; margin:18px 2px 0; line-height:1.5; }
    .empty { background:#fff; border:1.5px solid #dde2ed; border-radius:14px; padding:18px; color:#5a6b8c; font-size:14px; }
    @media (max-width:520px) { .next h2 { font-size:19px; } .grid { grid-template-columns:1fr; } .door { min-height:0; } }
    @media (prefers-reduced-motion:reduce) { .door { transition:none; } }
  </style>
</head>
<body>
<div id="authOverlay" class="auth-overlay"><div id="authMsg">Checking access…</div></div>

<div class="top-bar">
  <a href="member-menu.html"><img src="assets/rmd-logo.png" alt="RMD"></a>
  <div class="top-bar-title">Director Box</div>
  <a class="back" href="phase1.html">Monday Night hub</a>
</div>

<div class="wrap">
  <div class="courses" id="courses" role="tablist" aria-label="Course"></div>
  <div class="line" id="line"></div>
  <div id="nextHolder"></div>
  <div id="doors"><div class="empty">Loading…</div></div>
  <p class="note">This page only reads. Nothing here changes any record. Numbers are for the course picked above and come straight from the live data when the page opens. Doors marked "hub" open the Monday Night hub on that job for the course picked above.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
initFirebase();
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

let COURSES = [], PICK = null, SEQ = 0;

function addDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function niceDate(iso) { return new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).replace(",", ""); }
function todayLondon() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date()); }
function dayDiff(a, b) { return Math.round((new Date(a + "T12:00:00Z") - new Date(b + "T12:00:00Z")) / 86400000); }

async function getDoc(path) {
  const [col, id] = path.split("/");
  try { const s = await db.collection(col).doc(id).get(); return s.exists ? (s.data() || {}) : null; } catch (e) { return null; }
}
async function getCol(col, course) {
  try { const s = await db.collection(col).where("course", "==", course).get(); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { return null; }
}

// Same attempt rule as the hub and the night function.
function attemptOf(c) {
  if (typeof c.assessmentAttempt === "number" && c.assessmentAttempt >= 1) return Math.floor(c.assessmentAttempt);
  return (c.firstTimeAssessment === false || c.twoPlusAssessments === true) ? 2 : 1;
}
const hasSlot = c => !!(c.assessmentRoom && c.assessmentSlot);
const wk = (r, n) => (r && r["w" + n] && r["w" + n].status) || null;

function figures(cands, regs, ass, d, today) {
  const F = { total: cands.length };
  F.noRoom = cands.filter(c => !c.room).length;
  F.noTeam = cands.filter(c => c.room && !(c.instructorTeamUids || []).length).length;
  const live = cands.filter(c => c.assessmentAbsent !== true);
  F.cannotAttend = cands.length - live.length;
  F.rap = live.filter(c => c.rap === true).length;
  F.retest = live.filter(c => attemptOf(c) >= 2).length;
  const auto0 = live.filter(c => c.rap !== true && attemptOf(c) < 2);
  // absent in a teaching week (and not overridden) = moves to a new course, so no slot is given
  const rmapA = {}; (regs || []).forEach(r => { rmapA[r.id] = r; });
  const blocked = c => (regs || []).length > 0 && (wk(rmapA[c.id], 1) === "absent" || wk(rmapA[c.id], 2) === "absent") && !(c.eligibilityOverride && c.eligibilityOverride.by);
  const auto = auto0.filter(c => !blocked(c));
  F.auto = auto.length;
  F.needSlot = auto.filter(c => !hasSlot(c)).length;
  F.slotted = cands.filter(hasSlot).length;
  // the same four checks the hub uses before it lets a Director allocate
  const clashes = auto0.filter(c => d && (c.placementBlocks || []).some(b => b.start && b.end && d.some(m => m >= b.start && m <= b.end)));
  F.clash = clashes.length;
  const MK = ["here", "late", "absent"];
  F.unmarked = auto0.filter(c => !MK.includes(wk(rmapA[c.id], 1)) || !MK.includes(wk(rmapA[c.id], 2))).length;
  F.teachDone = !!d && today >= d[1];
  F.blockers = [];
  if (!d) F.blockers.push("no assessment date");
  if (F.clash) F.blockers.push(F.clash + " with a placement clash");
  if (d && !F.teachDone) F.blockers.push("teaching night 2 not done");
  else if (d && !(regs || []).length) F.blockers.push("no register marks");
  else if (d && F.unmarked) F.blockers.push(F.unmarked + " with no register mark");
  F.regKnown = regs !== null;
  const rmap = {}; (regs || []).forEach(r => { rmap[r.id] = r; });
  F.regDocs = (regs || []).length;
  [1, 2].forEach(n => {
    F["w" + n + "marked"] = cands.filter(c => ["here", "late", "absent"].includes(wk(rmap[c.id], n))).length;
    F["w" + n + "absent"] = cands.filter(c => wk(rmap[c.id], n) === "absent").length;
  });
  const first = live.filter(c => attemptOf(c) === 1 || attemptOf(c) >= 3);   // third and fourth sits follow the same attendance rule (Jon, 16 Oct)
  const abs = F.regDocs ? first.filter(c => wk(rmap[c.id], 1) === "absent" || wk(rmap[c.id], 2) === "absent") : [];
  F.notElig = abs.filter(c => !(c.eligibilityOverride && c.eligibilityOverride.by)).length;
  F.overridden = abs.length - F.notElig;
  if (F.notElig) F.blockers.push(F.notElig + " absent and not moved");
  F.emailPending = cands.filter(c => c.email && hasSlot(c) && c.assessmentEmailedSlot !== ((d ? d[2] : "") + "|" + c.assessmentRoom + "|" + c.assessmentSlot) && !blocked(c)).length;
  F.assKnown = ass !== null;
  const done = new Set();
  (ass || []).forEach(a => { const at = a.attempts || {}; if (Object.keys(at).some(k => at[k] && at[k].outcome)) done.add(a.id); });
  F.resulted = cands.filter(c => done.has(c.id)).length;
  return F;
}

// What state is the course in, from the three dates and today.
function phaseOf(d, today) {
  if (!d) return { key: "nodate" };
  if (today === d[0] || today === d[1]) return { key: "teach", n: today === d[0] ? 1 : 2 };
  if (today === d[2]) return { key: "night" };
  if (today < d[0]) return { key: "before", days: dayDiff(d[0], today) };
  if (today < d[1]) return { key: "between1" };
  if (today < d[2]) return { key: "between2", days: dayDiff(d[2], today) };
  return { key: "after" };
}

function hub(course, view) { return "phase1.html?course=" + encodeURIComponent(course) + "#" + view; }
function build(course, F, ph, d) {
  // Each door: id, title, href, group, state text, chip [class, label], small description
  const ok = ["ok", "OK"], todo = ["todo", "To do"], bad = ["bad", "Needs attention"], live = ["live", "Tonight"], na = ["na", "No data"];
  const D = [];
  const teachTonight = ph.key === "teach", nightTonight = ph.key === "night";
  D.push({ id: "people", g: "setup", t: "People", href: "admin-stage1-candidates.html",
    st: F.total ? plural(F.total, "candidate", "candidates") + " on " + course : "Nobody on this course yet",
    ds: "Add, remove, check placement dates, mark repeats", chip: F.total ? ok : bad });
  D.push({ id: "alloc", g: "setup", t: "Course allocation", href: "course-allocation.html",
    st: F.noRoom ? plural(F.noRoom, "person", "people") + " without a room" : (F.total ? "Everyone has a room" : "Nothing to place"),
    ds: "Move people between courses and rooms, one at a time", chip: F.total ? (F.noRoom ? todo : ok) : na });
  D.push({ id: "teams", g: "setup", t: "Rooms and instructor teams", href: "admin-course-room-allocation.html",
    st: F.noTeam ? plural(F.noTeam, "candidate", "candidates") + " in a room with no instructors" : (F.total ? "Every room has instructors" : "Nothing to place"),
    ds: "Who teaches in which room", chip: F.total ? (F.noTeam ? todo : ok) : na });
  D.push({ id: "settings", g: "setup", t: "Course settings", href: "admin-stage1-settings.html",
    st: d ? "Assessment night " + niceDate(d[2]) : "No assessment date set", ds: "Course dates, late time", chip: d ? ok : bad });

  const wkText = n => F.regKnown ? "Week " + n + ": " + F["w" + n + "marked"] + " of " + F.total + " marked, " + F["w" + n + "absent"] + " absent" : "Register not readable";
  D.push({ id: "register", g: "teach", t: "Register (hub)", href: hub(course, "register"),
    st: wkText(1) + (ph.key !== "before" ? ". " + wkText(2) : ""), ds: "Who arrived in weeks 1 and 2, late reasons, follow-ups",
    chip: teachTonight ? live : (F.regKnown ? ok : na) });
  D.push({ id: "regscreen", g: "teach", t: "Register live screen", href: "register-live.html",
    st: "Big-screen counts for the teaching evening", ds: "Open on the room screen", chip: teachTonight ? live : ["na", "Not tonight"] });

  const slotLocked = F.blockers.length > 0 && F.needSlot > 0;
  D.push({ id: "slots", g: "night", t: "Assessment allocation (hub)", href: hub(course, "alloc"),
    st: slotLocked ? "Locked: " + F.blockers.join(", ") : (F.needSlot ? plural(F.needSlot, "person", "people") + " still need a slot" : (F.auto ? (F.emailPending ? F.emailPending + " not emailed their time yet" : "All " + F.auto + " first sits have a slot" + (F.slotted ? " and an email" : "")) : "No first sits to place")),
    ds: "Four steps: check the course, allocate, check the schedule, email. " + F.rap + " RAP placed by hand",
    chip: slotLocked ? ["bad", "Locked"] : (F.auto ? ((F.needSlot || F.emailPending) ? todo : ok) : na) });
  D.push({ id: "elig", g: "night", t: "Who is not eligible (hub)", href: hub(course, "assessor"),
    st: !F.regDocs ? "No register marks yet" : (F.notElig ? plural(F.notElig, "person", "people") + " absent in a teaching week" : "Nobody blocked") + (F.overridden ? ", " + F.overridden + " overridden" : ""),
    ds: "Absent in week 1 or 2 means a new course unless a Director overrides", chip: !F.regDocs ? na : (F.notElig ? bad : ok) });
  D.push({ id: "run", g: "night", t: "Runner and assessor views (hub)", href: hub(course, "runner"),
    st: F.assKnown ? F.resulted + " of " + F.total + " have a result" : "Results not readable", ds: "Rooms, who is here, record results",
    chip: nightTonight ? live : (F.assKnown ? ["na", "Not tonight"] : na) });
  D.push({ id: "retest", g: "night", t: "Retest pool (hub)", href: hub(course, "retest"),
    st: plural(F.retest, "person", "people") + " on attempt 2 or later" + (F.cannotAttend ? ", " + F.cannotAttend + " cannot attend" : ""),
    ds: "Who is waiting and who needs a follow-up", chip: F.retest || F.cannotAttend ? todo : ok });
  D.push({ id: "nightscreen", g: "night", t: "Assessment night live screen", href: "assessment-live.html",
    st: "Big-screen counts for assessment night", ds: "Open on the room screen", chip: nightTonight ? live : ["na", "Not tonight"] });

  D.push({ id: "comms", g: "msg", t: "Comms", href: "admin-comms.html",
    st: F.notElig ? plural(F.notElig, "person", "people") + " to move, then email" : "Bulk emails, copy addresses, history",
    ds: "Slot emails, new-course emails, reminders. Limit 100 a day", chip: F.notElig ? todo : ["na", "Open"] });

  D.push({ id: "ready", g: "check", t: "Readiness check", href: "admin-stage1-readiness.html",
    st: "Is this course ready for assessment night?", ds: "Dates, rooms, teams, slots, emails, assessors, form link", chip: ["na", "Run it"] });
  D.push({ id: "setup", g: "check", t: "Assessment setup (hub)", href: hub(course, "setup"),
    st: "Who can assess, mark sheets, form link", ds: "Directors only, in the hub", chip: ["na", "Open"] });
  D.push({ id: "test", g: "check", t: "Test course", href: "admin-stage1-testcourse.html",
    st: "Standing rehearsal environment", ds: "Try anything here first", chip: ["na", "Open"] });
  return D;
}

// The single door to point at.
function pickNext(D, F, ph) {
  const by = id => D.find(x => x.id === id);
  const mk = (id, k, why) => ({ door: by(id), k, why });
  switch (ph.key) {
    case "nodate": return mk("settings", "Do this next", "This course has no assessment date yet.");
    case "teach": return mk("register", "Tonight", "Teaching night " + ph.n + ". Open the register.");
    case "night": return mk("run", "Tonight", "Assessment night. Open the runner or assessor view.");
    case "before":
      if (!F.total) return mk("people", "Do this next", "Nobody is on this course yet.");
      if (F.noRoom) return mk("alloc", "Do this next", plural(F.noRoom, "person has", "people have") + " no room yet.");
      if (F.noTeam) return mk("teams", "Do this next", "Some rooms have no instructor team.");
      return mk("ready", "Do this next", "People and rooms are placed. Run the readiness check, then email candidates.");
    case "between1":
      if (F.w1absent) return mk("comms", "Do this next", plural(F.w1absent, "person was", "people were") + " absent in week 1. Move them to a new course and email them.");
      return mk("register", "Next", "Week 2 is the next teaching night.");
    case "between2":
      if (F.clash) return mk("alloc", "Do this next", plural(F.clash, "person has", "people have") + " a placement that overlaps this course. Confirm or move them.");
      if (F.unmarked || !F.regDocs) return mk("register", "Do this next", F.regDocs ? plural(F.unmarked, "person has", "people have") + " no register mark for a teaching week." : "There are no register marks for this course.");
      if (F.notElig) return mk("comms", "Do this next", plural(F.notElig, "person", "people") + " absent in a teaching week: move them to a new course and email them, then allocate.");
      if (F.needSlot) return mk("slots", "Do this next", "The course is ready. Allocate slots (" + plural(F.needSlot, "person needs", "people need") + " one, " + ph.days + " days to go).");
      if (F.emailPending) return mk("slots", "Do this next", "Check the schedule, then email " + plural(F.emailPending, "person", "people") + " their time.");
      return mk("ready", "Do this next", "Slots are placed and emailed. Run the readiness check (" + ph.days + " days to go).");
    default:
      return mk("retest", "Do this next", "Assessment night is over. Check the retest pool and follow up.");
  }
}

const GROUPS = [["setup", "Set up the course", ""], ["teach", "Teaching nights", ""], ["night", "Assessment night", ""], ["msg", "Messages", ""], ["check", "Checks and rehearsal", ""]];

function doorHtml(x, here) {
  return `<a class="door${here ? " here" : ""}" href="${esc(x.href)}"><div class="hd"><b>${esc(x.t)}</b><span class="chip ${x.chip[0]}">${esc(x.chip[1])}</span></div><div class="st">${esc(x.st)}</div><div class="ds">${esc(x.ds)}</div></a>`;
}

async function show(name) {
  PICK = name; const my = ++SEQ;
  document.querySelectorAll(".cbtn").forEach(b => b.classList.toggle("on", b.dataset.c === name));
  $("doors").innerHTML = '<div class="empty">Reading ' + esc(name) + '…</div>'; $("nextHolder").innerHTML = "";
  const meta = COURSES.find(c => c.name === name) || {};
  const d = meta.date ? [addDays(meta.date, -14), addDays(meta.date, -7), meta.date] : null;
  const [cands, regs, ass] = await Promise.all([getCol("stage1_candidates", name), getCol("stage1_register", name), getCol("stage1_assessments", name)]);
  if (my !== SEQ) return;   // a newer pick has taken over
  if (cands === null) { $("doors").innerHTML = '<div class="empty">Could not read the candidates for ' + esc(name) + '. Check you are signed in as a Director.</div>'; return; }
  const today = todayLondon(), ph = phaseOf(d, today), F = figures(cands, regs, ass, d, today), D = build(name, F, ph, d);
  // three Mondays
  if (d) {
    const lab = ["Teaching night 1", "Teaching night 2", "Assessment night"];
    $("line").innerHTML = d.map((iso, i) => {
      const past = iso < today, now = iso === today, diff = dayDiff(iso, today);
      return `<div class="nd ${past ? "done" : (now ? "now" : "")}"><i></i><b>${lab[i]}</b><small>${esc(niceDate(iso))}${now ? ", tonight" : (past ? ", done" : ", in " + diff + (diff === 1 ? " day" : " days"))}</small></div>`;
    }).join("");
  } else $("line").innerHTML = "";
  const nx = pickNext(D, F, ph);
  $("nextHolder").innerHTML = nx.door ? `<a class="next" href="${esc(nx.door.href)}"><small class="k">${esc(nx.k)}</small><h2>${esc(nx.door.t)}</h2><p>${esc(nx.why)}</p><span class="go">Open</span></a>` : "";
  $("doors").innerHTML = GROUPS.map(([g, title]) => {
    const items = D.filter(x => x.g === g);
    return items.length ? `<h3 class="sec">${esc(title)}</h3><div class="grid">${items.map(x => doorHtml(x, nx.door && nx.door.id === x.id)).join("")}</div>` : "";
  }).join("");
}

async function boot() {
  const cfg = await getDoc("config/stage1_course_dates");
  COURSES = ((cfg && cfg.courses) || []).filter(c => c.name && !c.test).sort((a, b) => String(a.date || "9") < String(b.date || "9") ? -1 : 1);
  if (!COURSES.length) { $("doors").innerHTML = '<div class="empty">No courses are set up yet. Add them in <a href="admin-stage1-settings.html">Course settings</a>.</div>'; return; }
  $("courses").innerHTML = COURSES.map(c => `<button type="button" class="cbtn" role="tab" data-c="${esc(c.name)}">${esc(c.name)}<small>${c.date ? esc(niceDate(c.date)) : "no date"}</small></button>`).join("");
  $("courses").querySelectorAll(".cbtn").forEach(b => b.onclick = () => show(b.dataset.c));
  const today = todayLondon();
  // default: the course whose assessment night has not passed yet, else the last
  const next = COURSES.find(c => c.date && c.date >= today) || COURSES[COURSES.length - 1];
  show(next.name);
}

requireDirector().then(() => { $("authOverlay").style.display = "none"; boot(); });
</script>
</body>
</html>
