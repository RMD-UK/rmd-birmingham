<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RMD Birmingham</title>
  <link rel="stylesheet" href="css/rmd.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <img src="assets/rmd-logo.png" alt="RMD logo" class="login-logo">
    <h1 class="login-title">RMD Birmingham</h1>
    <p class="login-subtitle">Members sign in</p>

    <!-- Faculty / staff login -->
    <div id="facultyLoginView">
      <form class="login-form" onsubmit="handleFacultyLogin(event)">
        <input class="form-input" type="email" id="loginEmail" placeholder="Email address" required autocomplete="email">
        <input class="form-input" type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn-login">Sign in</button>
      </form>
      <p id="loginError" style="color:var(--rmd-warn);font-size:13px;margin-top:10px;display:none;"></p>

      <p style="text-align:center;margin-top:10px;">
        <a href="#" onclick="toggleForgotPassword(event)" style="font-size:13px;color:var(--rmd-blue);text-decoration:underline;">Forgot password?</a>
      </p>
      <div id="forgotPasswordPanel" style="display:none;margin-top:12px;">
        <input class="form-input" type="email" id="forgotEmail" placeholder="Email address" autocomplete="email">
        <button type="button" class="btn-login" onclick="sendForgotPasswordEmail()" style="margin-top:8px;">Send reset link</button>
        <p id="forgotStatus" style="font-size:13px;margin-top:8px;display:none;"></p>
      </div>
    </div>

    <!-- Candidate QR landing (shown when ?id=xxx in URL) -->
    <div id="candidateView" class="hidden">
      <div style="font-size:48px;margin:16px 0;">✅</div>
      <h2 style="color:var(--rmd-navy);margin-bottom:8px;">Welcome!</h2>
      <p id="candidateName" style="font-size:18px;font-weight:700;color:var(--rmd-blue);margin-bottom:4px;"></p>
      <p id="candidateStream" style="font-size:13px;color:var(--rmd-muted);margin-bottom:20px;"></p>
      <p style="font-size:13px;color:var(--rmd-muted);margin-bottom:16px;">Your arrival has been recorded.</p>
      <button class="btn-login" onclick="goToTimetable()">View Timetable →</button>
    </div>

  </div>

  <p style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:20px;">
    RMD · Resuscitation. Mentorship. Development. · University of Birmingham
  </p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // DIRECTOR_EMAILS/resolveRole are declared once in js/firebase-config.js,
  // loaded above. Re-declaring DIRECTOR_EMAILS here as a second top-level
  // `const` throws a SyntaxError (two <script> tags share one global scope)
  // and silently kills this ENTIRE script block — the login form handler,
  // the candidate QR check-in, everything. Confirmed 2026-07-15. Do not
  // redeclare either identifier in this file.

  initFirebase();

  // ── Candidate QR landing ───────────────────────────────────────────────────
  const params      = new URLSearchParams(window.location.search);
  const candidateId = params.get("id");

  if (candidateId) {
    document.getElementById("facultyLoginView").classList.add("hidden");
    document.getElementById("candidateView").classList.remove("hidden");
    loadCandidateProfile(candidateId);
  }

  async function loadCandidateProfile(id) {
    try {
      const doc  = await db.collection(COLLECTIONS.people).doc(id).get();
      const data = doc.exists ? doc.data() : null;
      document.getElementById("candidateName").textContent   = data ? data.name   : "Candidate";
      document.getElementById("candidateStream").textContent = data ? data.stream : "";
      await db.collection(COLLECTIONS.attendance).doc(id).set({
        arrived: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (err) {
      document.getElementById("candidateName").textContent = "Welcome!";
    }
  }

  function goToTimetable() {
    window.location.href = `timetable.html?id=${candidateId}`;
  }

  // ── Faculty / staff login ──────────────────────────────────────────────────
  async function handleFacultyLogin(e) {
    e.preventDefault();
    const email  = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const errEl  = document.getElementById("loginError");
    const btn    = e.target.querySelector("button[type=submit]");

    errEl.style.display = "none";
    btn.textContent = "Signing in…";
    btn.disabled    = true;

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const role = await resolveRole(cred.user.uid, email);
      routeByRole(role);
    } catch (err) {
      btn.textContent = "Sign in";
      btn.disabled    = false;
      if (err.code === "auth/wrong-password" || err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
        errEl.textContent = "Incorrect email or password.";
      } else if (err.code === "auth/too-many-requests") {
        errEl.textContent = "Too many attempts — try again in a few minutes.";
      } else {
        errEl.textContent = "Sign in failed. Check your connection and try again.";
      }
      errEl.style.display = "block";
    }
  }

  // resolveRole() is the shared one from js/firebase-config.js — do not
  // redeclare it locally (see note above re: duplicate DIRECTOR_EMAILS).

  // ── Forgot password ────────────────────────────────────────────────────────
  // requestPasswordReset() is the shared helper from js/firebase-config.js.
  function toggleForgotPassword(e) {
    e.preventDefault();
    const panel = document.getElementById("forgotPasswordPanel");
    const shown = panel.style.display === "block";
    panel.style.display = shown ? "none" : "block";
    if (!shown) {
      document.getElementById("forgotEmail").value = document.getElementById("loginEmail").value;
      document.getElementById("forgotStatus").style.display = "none";
    }
  }

  async function sendForgotPasswordEmail() {
    const email    = document.getElementById("forgotEmail").value.trim().toLowerCase();
    const statusEl = document.getElementById("forgotStatus");

    if (!email || !email.includes("@")) {
      statusEl.style.color   = "var(--rmd-warn)";
      statusEl.textContent   = "Enter a valid email address first.";
      statusEl.style.display = "block";
      return;
    }

    statusEl.style.color   = "var(--rmd-muted)";
    statusEl.textContent   = "Sending…";
    statusEl.style.display = "block";

    try {
      await requestPasswordReset(email, window.location.origin + "/signin.html");
      statusEl.style.color = "#1a6e31";
      statusEl.textContent = "If that address has an RMD account, a reset link is on its way — check your inbox.";
    } catch (err) {
      statusEl.style.color = "var(--rmd-warn)";
      statusEl.textContent = "Something went wrong — try again, or contact RMD directly.";
    }
  }

  function routeByRole(role) {
    // All password-authenticated members land on the members menu first,
    // rather than jumping straight to the Instructor Weekend timetable —
    // that's now one of several destinations from there. The candidate QR
    // flow (goToTimetable, above) is untouched — it's a separate path.
    window.location.href = "member-menu.html";
  }
</script>

</body>
</html>
